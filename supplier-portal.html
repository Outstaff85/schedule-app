<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Supplier Portal</title>
<link rel="stylesheet" href="icons/tabler-icons.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Supplier Portal — a deliberately separate, lighter file (not an embedded
   mode inside schedule-manager.html) — see docs/supplier-portal.md for
   why: a clean security boundary between the manager app (full
   worker/client rate data) and a supplier login (which must never see any
   of it). Duplicates conventions/constants from schedule-manager.html on
   purpose, same as worker-punch.html already does — see the rules in CLAUDE.md. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#eef0f8;--text2:#7c84a0;--text3:#3a4060;
  --green:#6dd6a0;--green-bg:rgba(109,214,160,0.12);
  --red:#ff4f5e;--red-bg:rgba(255,79,94,0.12);
  --amber:#f5a623;--amber-bg:rgba(245,166,35,0.12);
  --accent:#4f8ef7;--radius:12px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;}
body{padding-bottom:40px;}
.btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.red{background:var(--red-bg);border-color:rgba(255,79,94,0.3);color:var(--red);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:13px;outline:none;}
#sendHoursRows input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:6px 8px;font-size:13px;outline:none;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:500;padding:16px;}
.overlay.open{display:flex;}
.tap-edit{cursor:pointer;} /* a double click / long press opens the item's editor (tapEdit, longPress) */
@media (pointer:coarse){ .tap-edit{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;} }
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.tabs{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{background:none;border:none;color:var(--text2);padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm);white-space:nowrap;}
.tab-btn.active{background:var(--bg3);color:var(--text);}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;gap:8px;max-width:min(340px,calc(100vw - 32px));box-sizing:border-box;background:var(--bg2,#181c27);border:1px solid var(--border2);border-left:3px solid var(--green);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;line-height:1.35;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{font-size:16px;color:var(--green);flex-shrink:0;}
.toast.warn{border-left-color:var(--amber);} .toast.warn i{color:var(--amber);}
.toast.err{border-left-color:var(--red);} .toast.err i{color:var(--red);}
.toast.info{border-left-color:var(--blue,#60a5fa);} .toast.info i{color:var(--blue,#60a5fa);}
table{width:100%;border-collapse:collapse;}
th,td{padding:8px 10px;text-align:left;font-size:13px;border-bottom:1px solid var(--border);}
th{color:var(--text2);font-size:11px;text-transform:uppercase;}
.lang-select{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:4px 6px;font:600 12px/1 inherit;cursor:pointer;width:auto;min-width:0;}
/* Phone (≤ 700 px): the tables become one card per row (cardTables — the same as schedule-manager.html). */
@media (max-width:700px){
  body:not(.tables-list) table.mtable{min-width:0 !important;border-collapse:separate !important;}
  body:not(.tables-list) table.mtable thead{display:none;}
  body:not(.tables-list) table.mtable,body:not(.tables-list) table.mtable tbody,body:not(.tables-list) table.mtable tfoot,body:not(.tables-list) table.mtable tr,body:not(.tables-list) table.mtable td{display:block;width:100%;box-sizing:border-box;}
  body:not(.tables-list) table.mtable tr{background:var(--bg2);border:1px solid var(--border2) !important;border-radius:12px;margin:0 0 10px;padding:6px 12px;}
  body:not(.tables-list) table.mtable td{display:flex;justify-content:flex-end;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:5px 0 !important;border:0 !important;text-align:right !important;min-height:28px;}
  body:not(.tables-list) table.mtable td::before{content:attr(data-label);color:var(--text3);font-size:12px;font-weight:500;text-align:left;flex-shrink:0;margin-right:auto;}
  body:not(.tables-list) table.mtable td:first-child{font-weight:600;font-size:15px;justify-content:flex-start;text-align:left !important;}
  body:not(.tables-list) table.mtable td:first-child::before{display:none;}
  body:not(.tables-list) table.mtable td:empty{display:none;}
  body:not(.tables-list) table.mtable td[colspan]{justify-content:center;}
  body:not(.tables-list) table.mtable td[colspan]::before{display:none;}
}
/* Hebrew has no capitals: no letter-spacing (made for spaced-out uppercase Latin). */
html[lang="he"] *{letter-spacing:normal !important;}
.tables-view-toggle{display:none !important;}
@media (max-width:700px){ .tables-view-toggle{display:inline-flex !important;} }
html.has-session #appRoot{display:block !important;}
/* The app's template (variant 3, the same as the manager app): figures as
   text, sections with a count, lines with a colored mark on the left; on a
   phone a window opens from the bottom. Keep the copies the same. */
.t3-stats{display:flex;gap:20px;flex-wrap:wrap;margin:2px 2px 14px}
.t3-stats>div{font-size:11px;color:var(--text2)}
.t3-stats b{display:block;font-size:24px;font-weight:700;line-height:1.1;color:var(--text)}
.t3-sec{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);margin:16px 2px 6px}
.t3-sec em{font-style:normal;margin-left:auto;color:var(--text3);font-weight:500}
.t3-line{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-left:3px solid var(--c,var(--border2));background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 85%);border-radius:0 8px 8px 0;margin-bottom:4px;font-size:13px}
.t3-line.tap-edit,.t3-line[onclick]{cursor:pointer}
.t3-line .n{flex:1;min-width:0}
.t3-line .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t3-line .n small{display:block;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t3-line .r{font-family:'DM Mono',ui-monospace,monospace;font-size:12px;color:var(--text2);white-space:nowrap}
.t3-av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;background:var(--bg3);color:var(--text2)}
.t3-av img{width:100%;height:100%;object-fit:cover}
.t3-empty{color:var(--text3);font-size:13px;padding:6px 2px 4px}
.t3-x{background:none;border:0;color:var(--red);opacity:.5;font-size:15px;cursor:pointer;padding:4px 6px}
.t3-x:hover{opacity:1}
@media (max-width:700px){
  .overlay{align-items:flex-end;padding:0}
  .overlay>.modal{max-width:100% !important;max-height:88vh;border-radius:18px 18px 0 0;border-bottom:0;padding:14px 16px 20px}
  .overlay>.modal::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 12px}
}

/* The account menu (header variant C, the same in the manager app and both
   portals): one button with the login's name; inside it language and sign out. */
.acct{position:relative;}
.acct-chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font:600 13px inherit;cursor:pointer;max-width:240px;}
.acct-av{width:28px;height:28px;flex:none;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7a5cf7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;text-transform:uppercase;}
.acct-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-chev{color:var(--text2);font-size:14px;}
.acct-menu{display:none;position:absolute;right:0;top:44px;width:230px;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:6px;z-index:900;}
.acct.open .acct-menu{display:block;}
.acct-h{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.acct-h b{display:block;font-size:13px;color:var(--text);}
.acct-h span{font-size:11px;color:var(--text2);}
.acct-mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--text);font:500 13px inherit;cursor:pointer;text-align:left;}
.acct-mi i{font-size:17px;color:var(--text2);}
.acct-mi:hover{background:var(--bg3);}
.acct-mi.out,.acct-mi.out i{color:var(--red);}
.acct-lang .lang-select{margin-left:auto;}
@media (max-width:500px){ .acct-label,.acct-chev{display:none;} .acct-chip{padding:0 4px;} }

</style>
</head>
<body>

<script>
// One login for every role (per user request 2026-10-11): the manager app's
// login page signs a supplier or client in and hands over to its portal; a
// kept login opens the portal at once, no login means that page.
try{ if(localStorage.getItem('supplierPortal_session')) document.documentElement.classList.add('has-session'); else location.replace('schedule-manager.html'); }catch(e){}
</script>
<div id="appRoot" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)">
    <div style="font-size:16px;font-weight:700"><i class="ti ti-truck-delivery"></i> <span data-i18n>Supplier Portal</span></div>
    <div id="headerActions" style="display:flex;gap:6px;align-items:center"><div class="acct" id="accountControl">
      <button type="button" class="acct-chip" onclick="toggleAccountMenu(event)" aria-haspopup="true"><span class="acct-av" id="accountAvatar"></span><span class="acct-label" id="accountLabel"></span><i class="ti ti-chevron-down acct-chev"></i></button>
      <div class="acct-menu" id="accountMenu">
        <div class="acct-h" id="accountMenuHead"></div>
        <div class="acct-mi acct-lang"><i class="ti ti-world"></i><span data-i18n>Language</span><select class="lang-select" id="langSelect" title="Language" data-i18n-title="Language" aria-label="Language" onchange="setLanguage(this.value)"><option value="en">EN</option><option value="he">HE</option><option value="ru">RU</option></select></div>
        <button type="button" class="acct-mi out" onclick="logout()"><i class="ti ti-logout"></i><span data-i18n>Sign out</span></button>
      </div>
    </div></div>
  </div>
  <div class="tabs">
    <button class="tab-btn" id="tabBtn_dashboard" onclick="switchTab('dashboard')" data-i18n>Dashboard</button>
    <button class="tab-btn" id="tabBtn_workers" onclick="switchTab('workers')" data-i18n>My Workers</button>
    <button class="tab-btn" id="tabBtn_hours" onclick="switchTab('hours')" data-i18n>My Hours</button>
    <button class="tab-btn" id="tabBtn_review" onclick="switchTab('review')" style="display:none" data-i18n>Hours approval</button>
  </div>

  <div id="sectionDashboard" style="padding:16px;display:none">
    <div class="t3-stats">
      <div><b id="dashOnSite" style="color:var(--green)">0</b><span data-i18n>On site now</span></div>
      <div><b id="dashTotal">0</b><span data-i18n>My workers</span></div>
      <div><b id="dashPunches">0</b><span data-i18n>punches</span></div>
    </div>
    <div class="t3-sec"><i class="ti ti-clipboard-text"></i> <span data-i18n>Today's log</span></div>
    <div id="dashLog"></div>
  </div>

  <div id="sectionWorkers" style="padding:16px;display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-weight:600" data-i18n>My Workers</div>
      <button class="btn sm accent" onclick="openAddWorkerModal()"><i class="ti ti-plus"></i> <span data-i18n>Add worker</span></button>
    </div>
    <div id="workersList"></div>
  </div>

  <!-- Hours approval (with an hours tick, users.hourPerms): the shared
       hours-review.js over the hours function — per day approve, dispute,
       propose a fix; the month approved at once. -->
  <div id="sectionReview" style="padding:16px;display:none;max-width:760px;margin:0 auto"></div>

  <div id="sectionHours" style="padding:16px;display:none">
    <div class="field"><label data-i18n>Month</label><select id="hoursExportMonthSel" onchange="renderPayTable()"></select></div>
    <!-- With "sees pay": each worker's hours, days, rate, pay and my commission for the month. -->
    <div id="payTableWrap" style="display:none;margin-bottom:16px">
      <div style="font-weight:600;margin-bottom:8px">Pay</div>
      <div id="payTable"></div>
    </div>
    <div class="field"><label>Worker (for detailed export)</label><select id="hoursExportWorkerSel"></select></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn sm" onclick="runDetailExport('excel')"><i class="ti ti-file-spreadsheet"></i> Detail (Excel)</button>
      <button class="btn sm" onclick="runDetailExport('pdf')"><i class="ti ti-file-type-pdf"></i> Detail (PDF)</button>
      <button class="btn sm accent" onclick="runSummaryExport('excel')"><i class="ti ti-file-spreadsheet"></i> Summary (Excel)</button>
      <button class="btn sm accent" onclick="runSummaryExport('pdf')"><i class="ti ti-file-type-pdf"></i> Summary (PDF)</button>
    </div>
    <div id="hoursSummaryPreview"></div>
    <!-- Hours typed here go to the firm owner for approval (supplierSubmitHours);
         the list below shows each batch's status. -->
    <div style="font-weight:600;margin:8px 0" data-i18n>Send hours for approval</div>
    <div class="field"><label data-i18n>Worker</label><select id="sendHoursWorker" onchange="renderSendHoursRows()"></select></div>
    <div id="sendHoursHint" style="font-size:11px;color:var(--text3);margin-bottom:6px"></div>
    <div id="sendHoursRows" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn sm" type="button" onclick="addSendHoursRow()"><i class="ti ti-plus"></i> <span data-i18n>Add shift</span></button>
      <label class="btn sm" title="Columns: Date, In, Out (and Worker — a name or ID number — for a sheet of several workers)" data-i18n-title="Columns: Date, In, Out (and Worker — a name or ID number — for a sheet of several workers)"><i class="ti ti-file-spreadsheet"></i> <span data-i18n>Load from Excel</span><input type="file" id="timesheetFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="loadTimesheetFile(this)"></label>
      <button class="btn sm accent" type="button" id="sendHoursBtn" onclick="submitSendHours()"><i class="ti ti-send"></i> <span data-i18n>Send for approval</span></button>
    </div>
    <div style="font-weight:600;margin:8px 0" data-i18n>Sent for approval</div>
    <div id="sentHoursList" style="font-size:12px;color:var(--text3)"></div>
  </div>
</div>

<div class="overlay" id="workerOverlay">
  <div class="modal" id="workerModal"></div>
</div>
<div id="toast" class="toast"></div>

<script>
// ── Shared constants/helpers duplicated from schedule-manager.html on
// purpose (see the rules in CLAUDE.md) ───────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Translations (the same core as schedule-manager.html: I18N_LANGS, tr,
// applyI18n, uiLocale, loadI18n — keep the copies the same; docs/translations.md).
// The language is this device's choice (the language select, English by
// default), kept in localStorage.uiLang — shared by the three pages.
const I18N_LANGS = {en:'English', he:'עברית', ru:'Русский'};
var I18N = {}, I18N_LANG = 'en';
function tr(s, params){
  let out = (I18N_LANG !== 'en' && I18N[s]) || s;
  if(params) out = out.replace(/\{(\w+)\}/g, (m, k) => params[k] != null ? params[k] : m);
  return out;
}
function applyI18n(root){
  const host = root || document;
  const keyOf = (el, attr) => { const k = '__i18n_' + attr; if(el[k] == null) el[k] = attr === 'text' ? (el.getAttribute('data-i18n') || el.textContent.trim()) : el.getAttribute('data-i18n-' + attr); return el[k]; };
  host.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(keyOf(el, 'text')); });
  host.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = tr(keyOf(el, 'placeholder')); });
  host.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tr(keyOf(el, 'title')); });
}
function uiLocale(){ return {he:'he-IL', ru:'ru-RU'}[I18N_LANG] || 'en-GB'; }
async function loadI18n(lang){
  const set = (l, d) => { I18N_LANG = l; I18N = d || {}; document.documentElement.lang = l; };
  if(!I18N_LANGS[lang] || lang === 'en'){ set('en', {}); return; }
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem('i18n_' + lang) || 'null'); }catch(e){}
  if(cached) set(lang, cached);
  const fresh = fetch('i18n/' + lang + '.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(d => {
    if(!d || typeof d !== 'object') return false;
    const changed = JSON.stringify(d) !== JSON.stringify(cached);
    try{ localStorage.setItem('i18n_' + lang, JSON.stringify(d)); }catch(e){}
    if(I18N_LANG === lang || !cached) set(lang, d);
    return changed;
  }).catch(() => false);
  if(cached){ fresh.then(ch => { if(ch && I18N_LANG === lang) redrawForLanguage(); }); return; }
  await fresh;
}
function storedLanguage(){ try{ const l = localStorage.getItem('uiLang'); return I18N_LANGS[l] ? l : 'en'; }catch(e){ return 'en'; } }
// The language select (one per page, #langSelect): keeps the choice on this device and redraws in it;
// a signed-in user's choice is also saved to their account (updateMyLanguage), and login brings it back on any device.
async function setLanguage(lang, opts){
  lang = I18N_LANGS[lang] ? lang : 'en';
  try{ localStorage.setItem('uiLang', lang); }catch(e){}
  if(!(opts && opts.save === false) && getSession()){
    loadFirestoreBackend().then(b => b.handleAction('updateMyLanguage', {action:'updateMyLanguage', language: lang}, {})).catch(()=>{});
  }
  try{ await loadI18n(lang); }catch(e){}
  redrawForLanguage();
}
// The one language select sits in the header, or on the login screen while that one is shown.
function placeLangSelect(){
  const sel = document.getElementById('langSelect'), host = document.querySelector('#accountMenu .acct-lang');
  if(sel && host && sel.parentNode !== host) host.appendChild(sel);
}
function syncLangSelects(){ document.querySelectorAll('select.lang-select').forEach(el => { el.value = I18N_LANG; }); }
// Phone layout of the tables (CSS table.mtable at ≤ 700 px): each cell gets its
// column's header as data-label. A copy of schedule-manager.html's cardTables — keep the two the same.
// Phone tables: cards (one card per row) or the list (the table itself,
// scrolled sideways) — the toggle in the section header, kept on this device
// (localStorage.tablesView). The same in schedule-manager.html and supplier-portal.html.
function getTablesView(){ try{ return localStorage.getItem('tablesView')==='list'?'list':'cards'; }catch(e){ return 'cards'; } }
function setTablesView(v){
  try{ localStorage.setItem('tablesView', v); }catch(e){}
  applyTablesView();
}
function applyTablesView(){
  const v = getTablesView();
  document.body.classList.toggle('tables-list', v==='list');
  document.querySelectorAll('.tables-view-toggle .tvList').forEach(b => b.classList.toggle('active', v==='list'));
  document.querySelectorAll('.tables-view-toggle .tvCards').forEach(b => b.classList.toggle('active', v==='cards'));
}
function cardTables(root){
  root.querySelectorAll('table').forEach(t => {
    t.classList.add('mtable');
    const head = t.tHead && t.tHead.rows.length ? t.tHead.rows[t.tHead.rows.length - 1] : null;
    if(!head) return;
    const labels = [];
    [...head.cells].forEach(c => { const n = c.colSpan || 1; for(let i = 0; i < n; i++) labels.push(c.textContent.trim()); });
    [...t.tBodies, ...(t.tFoot ? [t.tFoot] : [])].forEach(b => [...b.rows].forEach(r => {
      let col = 0;
      [...r.cells].forEach(c => { if(!c.hasAttribute('data-label') && labels[col]) c.setAttribute('data-label', labels[col]); col += c.colSpan || 1; });
    }));
  });
}
(() => {
  let queued = false;
  const root = document.getElementById('appRoot');
  const mo = new MutationObserver(() => { if(!queued){ queued = true; requestAnimationFrame(() => { queued = false; cardTables(root); }); } });

// ── New version check (2026-10-04; the same code in schedule-manager.html,
// worker-punch.html and supplier-portal.html). An app left open — a PWA in
// the background — keeps running the code it loaded, even after a deploy.
// When the page comes back to the screen, and every 30 min while it is
// shown, the files it runs are asked for their ETag (HEAD: the service
// worker only handles GET, and cache:'no-store' skips the HTTP cache). The
// first answer is the baseline; a changed ETag later means a deploy, and a
// bar offers to reload. Nothing reloads on its own (typed data stays).
function startVersionWatch(files){
  let base=null, shown=false;
  const tags=async()=>{
    const out={};
    for(const f of files()){
      const r=await fetch(f,{method:'HEAD',cache:'no-store'});
      if(!r.ok) return null;
      out[f]=r.headers.get('etag')||r.headers.get('last-modified')||'';
    }
    return out;
  };
  const check=async()=>{
    if(shown||document.visibilityState!=='visible'||navigator.onLine===false) return;
    try{
      const t=await tags(); if(!t) return;
      if(!base){ base=t; return; }
      for(const f in t){ if(!(f in base)){ base[f]=t[f]; continue; } if(t[f]&&base[f]&&t[f]!==base[f]){ shown=true; showNewVersionBar(); return; } }
    }catch(e){}
  };
  document.addEventListener('visibilitychange',check);
  setInterval(check,30*60*1000);
  check();
}

// form on a tap anywhere on it — there is no separate Edit button. A tap on a
// control inside it (a button, link, field, or anything with its own onclick)
// does that control's job instead, and selecting text doesn't count. The
// same code is in schedule-manager.html and supplier-portal.html.
// Tap, double click, long press (user request 2026-10-11): a single tap on a
// list item or card opens its card (tapFn) — never the editor; a double click
// (computer) or a long press (phone, LONG_PRESS_MS; a move or scroll cancels
// it) opens the edit form (editFn). With no tapFn a single tap only says how
// to edit. Markup: onclick="tapEdit(event,this,tapFn,editFn)"
// onpointerdown="longPress(event,this,editFn)" (class .tap-edit). With a mouse

// Same shift-pairing logic as schedule-manager.html's own
// groupPunchesIntoShifts()/analyzeDayPunches() — duplicated here rather than
// imported (no shared build in this codebase).
function groupPunchesIntoShifts(entries){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const buckets=[]; let cur=null;
  chrono.forEach(e=>{
    if(e.type==='in'){ if(cur) buckets.push(cur); cur={date:new Date(e.ts),entries:[e]}; }
    else { if(!cur) cur={date:new Date(e.ts),entries:[]}; cur.entries.push(e); buckets.push(cur); cur=null; }
  });
  if(cur) buckets.push(cur);
  return buckets;
}
function toMins(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function roundMins(m){ return m; }
function analyzeDayPunches(entries,date){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  let hours=0, openIn=null; const warnings=[];
  chrono.forEach(e=>{
    if(e.type==='in'){ openIn=e; }
    else if(e.type==='out'){
      if(!openIn) return;
      if(!openIn.time||!e.time){ openIn=null; return; }
      let dur=toMins(e.time)-toMins(openIn.time); if(dur<0) dur+=1440;
      hours+=dur/60; openIn=null;
    }
  });
  return {hours,warnings};
}

// strip_worker(): no hourlyRate/otRate/shabbatRate/clientRates, no client
// billing data, no GPS fields ever reach this page at all) ──────────────
// ── Pay (duplicated on purpose from schedule-manager.html: PAY_RULES,
// israeliDayPay, effectiveRates … dayOverride, wOwnRate, localYMD — keep the
// copies the same). Used only with "sees pay" (showPay from the server);
// `clients` here are the firm's clients with their worker-pay rates only.
let clients=[];
const PAY_RULES = { regularMax: 8, ot1Span: 2, roundMinutes: 0, otMult: 1.25, shabbatMult: 1.5 };
function israeliDayPay(hours, rate, isSat){
  const base=isSat?1.5:1.0, ot1=isSat?1.75:1.25, ot2=isSat?2.0:1.5;
  const RM=PAY_RULES.regularMax, O1=PAY_RULES.ot1Span;
  const reg=Math.min(hours,RM), o1=Math.min(Math.max(hours-RM,0),O1), o2=Math.max(hours-(RM+O1),0);
  const regularPay=reg*rate*base, otPay=o1*rate*ot1+o2*rate*ot2;
  return { regularPay, otPay, total:regularPay+otPay, isSat };
}
// Effective per-hour rates for one shift, resolving a 3-tier priority chain —
// most specific wins, each tier optional, falling through to the next:
//   1. worker.clientRates[clientId] — this worker's own override for this
//      specific client (set in the Accounting rate matrix).
//   2. the worker's own rate — hourlyRate (or the older regRate), otRate,
//      shabbatRate — set in the worker modal or Accounting → Salary. It
//      changes this worker only (user decision 2026-10-05).
//   3. client.defaultHourlyRate/defaultOtRate/defaultShabbatRate — the
//      client's rate, shared by every worker there without a rate of their own.
// Each of the three rates resolves on its own. `src` says which tier gave the
// regular rate: 'override' / 'worker' / 'client' / '' (none). `has*Override` tells shiftPay() whether an
// explicit flat OT/Shabbat rate was found at ANY tier (vs falling back to
// the israeliDayPay law tiers) — the three tiers can't be told apart just by
// comparing the resolved number to a law-tier calculation.
function effectiveRates(w, clientId){
  const ov = clientId && w && w.clientRates && w.clientRates[clientId];
  const cl = clientId && clients.find(c=>c.id===clientId);
  const set=v=>v!=null&&v!=='';
  const own = set(w&&w.regRate) ? w.regRate : (Number(w&&w.hourlyRate)>0 ? w.hourlyRate : null);
  const pick=(ovVal,wVal,clVal,fallback)=>{
    if(set(ovVal)) return {val:Number(ovVal),has:true,src:'override'};
    if(set(wVal)) return {val:Number(wVal),has:true,src:'worker'};
    if(set(clVal)) return {val:Number(clVal),has:true,src:'client'};
    return {val:fallback,has:false,src:''};
  };
  const reg  = pick(ov&&ov.rate,        own,             cl&&cl.defaultHourlyRate,  0);
  const ot   = pick(ov&&ov.otRate,      w&&w.otRate,      cl&&cl.defaultOtRate,      Math.round(reg.val*PAY_RULES.otMult*100)/100);
  const shab = pick(ov&&ov.shabbatRate, w&&w.shabbatRate, cl&&cl.defaultShabbatRate, Math.round(reg.val*PAY_RULES.shabbatMult*100)/100);
  return {regRate:reg.val, otRate:ot.val, shabbatRate:shab.val, hasOtOverride:ot.has, hasShabbatOverride:shab.has,
    src:reg.src, otSrc:ot.src, shabbatSrc:shab.src};
}

function wOtRate(w,clientId){ return effectiveRates(w,clientId).otRate; }

// Pay for one shift's hours. Default: the israeliDayPay law tiers (125%/150% OT,
// 150%/175%/200% Shabbat) applied to the effective regular rate. An explicit flat
// OT/Shabbat rate (at any tier above) replaces the law tiers with that single flat
// rate across all OT/Shabbat hours of the shift, same as before this defaulted to
// the law. clientId is optional — see effectiveRates() above.
function shiftPay(hours, w, isSat, clientId){
  const RM=PAY_RULES.regularMax, r=effectiveRates(w,clientId);
  if(isSat){
    if(r.hasShabbatOverride) return hours*r.shabbatRate;
    return israeliDayPay(hours, r.regRate, true).total;
  }
  if(r.hasOtOverride) return Math.min(hours,RM)*r.regRate + Math.max(hours-RM,0)*r.otRate;
  return israeliDayPay(hours, r.regRate, false).total;

// Daily pay (w.payMode === 'daily', picked per worker in Accounting →

// Every list that grows draws (a copy of schedule-manager.html's paging
// helper — keep the two the same):
// LIST_PAGE rows at first. The next LIST_PAGE rows come only when the user
// scrolls the "Show more" row into view, or taps it — exactly one page per
// reach of the end, no pre-loading. `sig` describes what is listed (filters,
// grouping): while it stays the same, a redraw (new punch, refresh) keeps
// what was already opened; a new filter starts again from the first page.
// opts.table/colspan: rows of a <tbody>; opts.grid: tiles of a CSS grid.
const LIST_PAGE = 10;
const __pagedLists = {};
function renderPagedList(el, key, sig, items, rowHtml, opts){
  if(!el) return;
  opts = opts || {};
  const st = __pagedLists[key] && __pagedLists[key].sig === sig ? __pagedLists[key] : (__pagedLists[key] = {sig, shown: LIST_PAGE});
  const n = Math.min(items.length, st.shown);
  el.innerHTML = (opts.head || '') + items.slice(0, n).map((it, i) => rowHtml(it, i)).join('') + pagedMoreHtml(items.length - n, opts);
  wirePagedMore(el, key, items, rowHtml, opts);
}
function pagedMoreHtml(left, opts){
  if(left <= 0) return '';
  const btn = `<button class="btn sm paged-more-btn" style="margin:6px auto;display:flex"><i class="ti ti-chevron-down"></i> ${tr('Show more ({0} left)',{0:(left)})}</button>`;
  if(opts.table) return `<tr class="paged-more"><td colspan="${opts.colspan||20}" style="padding:4px">${btn}</td></tr>`;
  return `<div class="paged-more" style="${opts.grid?'grid-column:1/-1;':''}">${btn}</div>`;
}
function wirePagedMore(el, key, items, rowHtml, opts){
  const st = __pagedLists[key];
  st.more = null;
  const more = el.querySelector(':scope > .paged-more');
  if(!more) return;
  st.more = more;
  st.next = () => {
    if(st.more !== more || !more.isConnected) return;
    const from = st.shown;
    st.shown += LIST_PAGE;
    const to = Math.min(items.length, st.shown);
    more.insertAdjacentHTML('beforebegin', items.slice(from, to).map((it, i) => rowHtml(it, from + i)).join(''));
    more.remove();
    el.insertAdjacentHTML('beforeend', pagedMoreHtml(items.length - to, opts));
    wirePagedMore(el, key, items, rowHtml, opts);
  };
  more.querySelector('button').onclick = () => st.next();
}
// On a user scroll (any scrolling element: the page or a modal), each list
// whose "Show more" row is now visible gets its next page — one per frame.
// Only a scroll that follows the user's own input (wheel, touch, key, click)
// counts, and each input allows one page at most: the browser also fires
// scroll when a page's height changes after a redraw, which would otherwise
// chain-load page after page.
// __pagedUp: the last input moved up (wheel up, finger down, ArrowUp…) —
// then nothing loads, even with "Show more" in view.
let __pagedScrollQueued = false, __pagedUserAt = 0, __pagedUp = false, __pagedTouchY = null;
['wheel','touchstart','touchmove','touchend','keydown','pointerdown'].forEach(t =>
  window.addEventListener(t, e => {
    __pagedUserAt = Date.now();
    // A downward wheel / swipe / key while "Show more" is already in view
    // loads the next page too: a page too short to scroll fires no scroll.
    let down = false;
    if(t === 'touchstart'){ __pagedTouchY = e.touches && e.touches[0] ? e.touches[0].clientY : null; __pagedUp = false; }
    else if(t === 'touchmove' && e.touches && e.touches[0] && __pagedTouchY != null){
      const y = e.touches[0].clientY;
      if(Math.abs(y - __pagedTouchY) > 4){ __pagedUp = y > __pagedTouchY; down = !__pagedUp; __pagedTouchY = y; }
    }
    else if(t === 'wheel' && e.deltaY){ __pagedUp = e.deltaY < 0; down = !__pagedUp; }
    else if(t === 'keydown'){
      if(['ArrowDown','PageDown','End',' '].includes(e.key)){ __pagedUp = false; down = true; }
      else if(['ArrowUp','PageUp','Home'].includes(e.key)) __pagedUp = true;
    }
    else if(t === 'pointerdown' && e.pointerType === 'mouse') __pagedUp = false;
    if(down) _pagedOnScroll();
  }, {capture:true, passive:true}));
function _pagedVisibleBottom(node){
  let bottom = window.innerHeight;
  for(let p = node.parentElement; p && p !== document.body; p = p.parentElement){
    const oy = getComputedStyle(p).overflowY;
    if(oy === 'auto' || oy === 'scroll') bottom = Math.min(bottom, p.getBoundingClientRect().bottom);
  }
  return bottom;
}
function _pagedOnScroll(){
  if(__pagedScrollQueued || __pagedUp || !__pagedUserAt || Date.now() - __pagedUserAt > 1500) return;
  __pagedScrollQueued = true;
  requestAnimationFrame(() => {
    __pagedScrollQueued = false;
    for(const k in __pagedLists){
      const st = __pagedLists[k], more = st.more;
      if(!more || !more.isConnected || !more.getClientRects().length) continue;
      if(more.getBoundingClientRect().top <= _pagedVisibleBottom(more)){ __pagedUserAt = 0; st.next(); return; }
    }
  });
}
window.addEventListener('scroll', _pagedOnScroll, {capture:true, passive:true});

function getWorkerMonthShifts(workerId, year, month){
  const log = punchLog.filter(e=>e.workerId===workerId);
  return groupPunchesIntoShifts(log)
    .filter(b => b.date.getFullYear()===year && b.date.getMonth()===month)
    .map(b => {
      const res = analyzeDayPunches(b.entries, b.date);
      const ins = b.entries.filter(x=>x.type==='in').map(x=>x.time).sort();
      const outs = b.entries.filter(x=>x.type==='out').map(x=>x.time).sort();
      return { date: b.date, inTime: ins[0]||'', outTime: outs[outs.length-1]||'', hours: res.hours };
    })
    .sort((a,b)=>a.date-b.date);
}

// A timesheet file (Excel / CSV) fills the shift rows of the picked worker,
// to check and send like rows typed by hand. Columns by their header: Date,
// In, Out (English or Hebrew); an optional Worker column (a name or an ID /
// passport number) lets one sheet hold several workers — only the picked
// worker's rows are taken, the others wait until that worker is picked.
function parseTimesheetFile(file){
  return loadXlsx().then(()=>new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error(tr('Could not read the file')));
    reader.onload = ()=>{
      try{
        const wb = XLSX.read(reader.result, {type:'array', cellDates:true});
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
        if(!rows.length){ resolve([]); return; }
        const head = rows[0].map(h=>String(h||'').trim().toLowerCase().replace(/["'׳״.]/g,''));
        const col = names => head.findIndex(h=>names.includes(h));
        const di = col(['date','תאריך']), ii = col(['in','start','כניסה']), oi = col(['out','end','יציאה']), wi = col(['worker','name','id','עובד','שם','תז']);
        if(di < 0){ reject(new Error(tr('No Date column (expected Date, In, Out)'))); return; }
        const p2 = n => String(n).padStart(2,'0');
        const day = v=>{
          if(v instanceof Date) return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());
          const t = String(v||'').trim();
          let m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/); if(m) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
          m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
          return '';
        };
        const time = v=>{
          if(v instanceof Date) return p2(v.getHours())+':'+p2(v.getMinutes());
          if(typeof v === 'number' && v >= 0 && v < 1){ const mins = Math.round(v*1440); return p2(Math.floor(mins/60)%24)+':'+p2(mins%60); }
          const m = String(v||'').trim().match(/^(\d{1,2})[:.](\d{2})/);
          return m ? p2(m[1])+':'+m[2] : '';
        };
        resolve(rows.slice(1).filter(r=>String(r[di]??'').trim()!=='').map(r=>({
          worker: wi >= 0 ? String(r[wi]||'').trim() : '', date: day(r[di]),
          inTime: ii >= 0 ? time(r[ii]) : '', outTime: oi >= 0 ? time(r[oi]) : '' })));
      }catch(e){ reject(e); }
    };
    reader.readAsArrayBuffer(file);
  }));
}
// Does a sheet's Worker cell name this worker (its name, or its ID number)?
function timesheetRowIsFor(cell, w){
  if(!cell) return true;
  const norm = v => String(v||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
  const c = norm(cell);
  return c === norm(w.name) || (!!w.docId && c === norm(w.docId)) || c === norm((w.docGiven||'')+(w.docSurname||''));
}
async function loadTimesheetFile(input){
  const file = input.files && input.files[0]; input.value = '';
  if(!file) return;
  const w = myWorkers.find(x=>x.id===document.getElementById('sendHoursWorker').value);
  if(!w){ showToast(tr('Pick a worker first')); return; }
  let rows;
  try{ rows = await parseTimesheetFile(file); }catch(e){ showToast(e.message || tr('Could not read the file'), 6000); return; }
  const mine = rows.filter(r=>timesheetRowIsFor(r.worker, w)), others = rows.length - mine.length;
  if(!mine.length){ showToast(others ? tr('No rows for {0} in this file ({1} row(s) of other workers)',{0:w.name,1:others}) : tr('No rows for {0} in this file',{0:w.name}), 6000); return; }
  mine.forEach(r=>sendHoursRows.push({date:r.date, inTime:r.inTime, outTime:r.outTime}));
  renderSendHoursRows();
  showToast(others ? tr('{0} shift(s) loaded for {1} — check them and send; {2} row(s) of other workers: pick that worker and load the file again',{0:mine.length,1:w.name,2:others}) : tr('{0} shift(s) loaded for {1} — check them and send',{0:mine.length,1:w.name}), 7000);
}
async function submitSendHours(){
  const wid = document.getElementById('sendHoursWorker').value, w = myWorkers.find(x=>x.id===wid);
  if(!sendHoursRows.length){ showToast(tr('Add at least one shift')); return; }
  // A row that can't be sent is explained, never dropped silently.
  const daily = isDailyPay(w);
  const bad = sendHoursRows.map((r,i)=>(!r.date || (!daily && (!r.inTime || !r.outTime)) || (!!r.inTime !== !!r.outTime)) ? i : -1).filter(i=>i>=0);
  if(bad.length){
    document.querySelectorAll('#sendHoursRows [data-row]').forEach(el=>{ el.style.outline = bad.includes(Number(el.dataset.row)) ? '1px solid var(--red)' : ''; });
    const r = sendHoursRows[bad[0]];
    showToast(tr('Shift {0}: {1}',{0:bad[0]+1,1:(!r.date ? tr('pick a date') : !daily ? tr('enter the in and out times — this worker is paid by the hour') : tr('enter both times, or leave both empty for a whole day'))}));
    return;
  }
  const entries = sendHoursRows.map(r=>{
    let inTime = r.inTime, outTime = r.outTime;
    if(!inTime && !outTime && isDailyPay(w)) [inTime, outTime] = MANUAL_DAY_SHIFT;
    if(!r.date || !inTime || !outTime) return null;
    const [y,m,d] = r.date.split('-');
    return {date: d+'/'+m+'/'+y, inTime, outTime};
  }).filter(Boolean);
  if(!entries.length){ showToast(tr('Add at least one shift with a date, in and out')); return; }
  const btn = document.getElementById('sendHoursBtn'); btn.disabled = true;
  try{
    const r = await supplierCall({action:'supplierSubmitHours', workerId: wid, clientId: (w&&w.clientIds||[])[0]||'', entries});
    if(r.error){ showToast(r.error); return; }
    showToast(tr('{0} shift(s) sent for review',{0:(r.count)}));
    sendHoursRows = []; renderSendHoursRows(); loadSentHours();
  }catch(e){ showToast(tr('Failed: {0}',{0:(e.message)})); }
  finally{ btn.disabled = false; }
}
// Each batch with its status: amber "Sent for review", green "Approved", red "Rejected".
const HOURS_STATUS = {pending:['Sent for review','var(--amber)','var(--amber-bg)','ti-clock'],
  approved:['Approved','var(--green)','var(--green-bg)','ti-circle-check'],
  rejected:['Rejected','var(--red)','var(--red-bg)','ti-circle-x']};
function hoursStatusChip(st, when){
  const [label,color,bg,icon] = HOURS_STATUS[st] || HOURS_STATUS.pending;
  return `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:${color};background:${bg}"><i class="ti ${icon}"></i>${esc(tr(label))}${when?' · '+esc(new Date(when).toLocaleDateString('en-GB')):''}</span>`;
}
async function loadSentHours(){
  const el = document.getElementById('sentHoursList');
  let batches = [];
  try{ batches = (await supplierCall({action:'supplierListHours'})).batches || []; }catch(e){ el.textContent = tr('Could not load'); return; }
  if(!batches.length){ el.textContent = tr('Nothing sent yet'); return; }
  const nameOf = id => (myWorkers.find(w=>w.id===id)||{}).name || '';
  renderPagedList(el, 'sentHours', '', batches, b=>{
    const rows = b.entries||[];
    return t3Line({c:b.status==='approved'?'var(--green)':b.status==='rejected'?'var(--red)':'var(--amber)',
      name:tr('{0} · {1} shift(s): {2}{3}',{0:(esc(nameOf(rows[0]&&rows[0].workerId))),1:(rows.length),2:(esc((rows[0]||{}).date||'')),3:(rows.length>1?' – '+esc(rows[rows.length-1].date):'')}),
      right:hoursStatusChip(b.status, b.status==='pending'?b.uploadedAt:b.decidedAt)});
  });
}
// The month's pay per own worker, with the app's own pay functions (the
// copies above): hours, days, the worker's rate (₪/h or ₪/day), their pay,
// and my commission (myCommission). Shown only when the server says this
// login sees pay.
// My commission for one worker: a fixed ₪ per day worked when the firm set
// one for a worker paid by the day (supplierDayRate, sent only for such a
// worker), else hours × my ₪/h (supplierRate, default 5).
function myCommission(w, hours, days){
  if(w.supplierDayRate!=null && Number(w.supplierDayRate)>0) return days*Number(w.supplierDayRate);
  return hours*(w.supplierRate!=null?w.supplierRate:5);
}
function renderPayTable(){
  const wrap=document.getElementById('payTableWrap'); if(!wrap) return;
  wrap.style.display=showPay?'':'none';
  if(!showPay) return;
  const [year,month]=document.getElementById('hoursExportMonthSel').value.split('-').map(Number);
  const key='m:'+year+'-'+String(month+1).padStart(2,'0');
  const rows=myWorkers.map(w=>{
    const seen=new Set(), days=new Set(); let hours=0, pay=0;
    groupPunchesIntoShifts(punchLog.filter(e=>e.workerId===w.id))
      .filter(b=>b.date.getFullYear()===year && b.date.getMonth()===month)
      .forEach(b=>{
        const h=analyzeDayPunches(b.entries,b.date).hours;
        if(h<=0) return;
        hours+=h; days.add(localYMD(b.date));
        pay+=shiftPayFor(h,w,b.date.getDay()===6,b.entries[0]&&b.entries[0].clientId,b.date,seen);
      });
    const daily=isDailyPay(w), ov=daily?dayOverride(w,key):null;
    if(ov!=null) pay=ov*dailyRate(w);
    const rate=daily?dailyRate(w):wRegRate(w,(w.clientIds||[])[0]);
    const com=w.supplierRate!=null?w.supplierRate:5, d=ov!=null?ov:days.size;
    return {w, hours, days:d, rate:daily?'₪'+rate+'/day':'₪'+rate+'/h', pay, commission:myCommission(w,hours,d)};
  }).filter(r=>r.hours>0);
  const el=document.getElementById('payTable');
  if(!rows.length){ el.innerHTML='<div style="color:#8b90a8;font-size:13px">'+tr('No hours this month')+'</div>'; return; }
  const tot=k=>rows.reduce((t,r)=>t+r[k],0);
  // Totals as figures, then a line per worker (template 3).
  el.innerHTML=`<div class="t3-stats"><div><b>${esc(tr('{h}h',{h:tot('hours').toFixed(1)}))}</b>${esc(tr('Hours'))}</div><div><b>₪${tot('pay').toFixed(0)}</b>${esc(tr('Pay'))}</div><div><b style="color:var(--green)">₪${tot('commission').toFixed(0)}</b>${esc(tr('My commission'))}</div></div>
    <div class="pay-rows"></div>`;
  renderPagedList(el.querySelector('.pay-rows'),'pay',key,rows,r=>t3Line({c:'var(--green)', av:t3Av(r.w), name:esc(r.w.name),
    sub:esc(tr('{h}h',{h:r.hours.toFixed(1)})+' · '+(r.days===1?tr('1 day'):tr('{n} days',{n:r.days}))+' · '+r.rate+' · '+tr('Pay')+' ₪'+r.pay.toFixed(0)),
    right:`<span class="r" style="color:var(--green);font-weight:700">₪${r.commission.toFixed(0)}</span>`}));
}
function runDetailExport(format){
  const workerId = document.getElementById('hoursExportWorkerSel').value;
  const [year,month] = document.getElementById('hoursExportMonthSel').value.split('-').map(Number);
  exportShiftsDetail(workerId, year, month, format);
}
function runSummaryExport(format){
  const [year,month] = document.getElementById('hoursExportMonthSel').value.split('-').map(Number);
  const rows = myWorkers.map(w=>{
    const shifts = getWorkerMonthShifts(w.id, year, month);
    const hours = shifts.reduce((s,x)=>s+x.hours,0);
    const rate = w.supplierRate!=null ? w.supplierRate : 5;
    const days = new Set(shifts.filter(x=>x.hours>0).map(x=>localYMD(x.date))).size;
    return { label: w.name, hours, rate: w.supplierDayRate!=null ? tr('₪{0}/day',{0:w.supplierDayRate}) : rate, total: myCommission(w, hours, days) };
  }).filter(r=>r.hours>0);
  exportPayableSummary(rows, { title:tr('My hours — payable summary'), filename:'my-hours-summary', format });
}
