<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10141f">
  <script>/* The theme before the first draw (docs/redesign.md → Light theme; src/lib/theme.ts): Dark by default, Light, or System — the device's setting. */try{var t=localStorage.getItem('uiTheme');if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}</script>
  <title>Client Portal</title>
  <link rel="icon" href="/icon-192.png" type="image/png">
  <!-- The client portal (/client) — a page of the new stack (docs/client-portal.md,
       docs/build.md): built by Vite from src/client/. The same og.css and fonts as
       every page; Vite bundles them into this page's CSS. -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/og.css">
  <script>
    // One login for every role: without this portal's kept session the one login page (the manager app's) opens at once.
    try{ if(!localStorage.getItem('clientPortal_session')) location.replace('schedule-manager.html'); }catch(e){}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/client/main.tsx"></script>
</body>
</html>
