<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Client Portal</title>
<link rel="stylesheet" href="icons/tabler-icons.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Client Portal (/client) — a separate page, like the supplier portal: a
   client login must never see wages, rates, suppliers, GPS or documents, so
   it never reads Firestore; the hours function (functions-auth/hours.py)
   hands out only its own workers' shifts at its site, drawn by the shared
   hours-review.js.
   docs/client-portal.md. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#eef0f8;--text2:#7c84a0;--text3:#3a4060;
  --green:#6dd6a0;--green-bg:rgba(109,214,160,0.12);
  --red:#ff4f5e;--red-bg:rgba(255,79,94,0.12);
  --amber:#f5a623;--amber-bg:rgba(245,166,35,0.12);
  --accent:#4f8ef7;--radius:12px;--radius-sm:8px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;}
body{padding-bottom:40px;}
.btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.green{background:var(--green-bg);border-color:rgba(109,214,160,0.35);color:var(--green);}
.btn:disabled{opacity:.5;cursor:default;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;}
.field input,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:13px;outline:none;font-family:inherit;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:500;padding:16px;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;gap:8px;max-width:min(340px,calc(100vw - 32px));box-sizing:border-box;background:var(--bg2,#181c27);border:1px solid var(--border2);border-left:3px solid var(--green);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;line-height:1.35;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{font-size:16px;color:var(--green);flex-shrink:0;}
.toast.warn{border-left-color:var(--amber);} .toast.warn i{color:var(--amber);}
.toast.err{border-left-color:var(--red);} .toast.err i{color:var(--red);}
.toast.info{border-left-color:var(--blue,#60a5fa);} .toast.info i{color:var(--blue,#60a5fa);}
table{width:100%;border-collapse:collapse;}
th,td{padding:7px 8px;text-align:left;font-size:12px;border-bottom:1px solid var(--border);}
th{color:var(--text2);font-size:11px;}
.lang-select.on-cover{position:absolute;top:max(env(safe-area-inset-top,0px),12px);right:12px;z-index:2;}
.lang-select{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:4px 6px;font:600 12px/1 inherit;cursor:pointer;width:auto;min-width:0;}
html[lang="he"] *{letter-spacing:normal !important;}
html.has-session #appRoot{display:block !important;}
@media (max-width:500px){ .mgr-label{display:none;} }
</style>
</head>
<body>

<div id="loginScreen" style="display:flex;position:fixed;inset:0;z-index:1000;background:var(--bg);align-items:center;justify-content:center">
  <select class="lang-select on-cover" id="langSelect" title="Language" data-i18n-title="Language" aria-label="Language" onchange="setLanguage(this.value)"><option value="en">EN</option><option value="he">HE</option><option value="ru">RU</option></select>
  <div style="width:100%;max-width:340px;padding:24px">
    <div style="text-align:center;margin-bottom:22px">
      <i class="ti ti-building-store" style="font-size:32px;color:var(--accent)"></i>
      <div style="font-size:18px;font-weight:700;margin-top:8px" data-i18n>Client Portal</div>
    </div>
    <div class="field"><label data-i18n>Username</label><input type="text" id="loginUsername" autocomplete="username"></div>
    <div class="field"><label data-i18n>Password</label><input type="password" id="loginPassword" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitLogin()"></div>
    <div id="loginError" style="color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px"></div>
    <button class="btn accent" style="width:100%;justify-content:center" onclick="submitLogin()" data-i18n>Log in</button>
    <div style="text-align:center;margin-top:14px"><a href="schedule-manager.html" style="color:var(--text2);font-size:12px;text-decoration:none"><i class="ti ti-home"></i> <span data-i18n>Manager login</span></a></div>
  </div>
</div>

<script>
// A login kept on this device opens the portal at once — no flash of the
// login screen while the Firebase sign-in is checked; gateApp() brings the
// login back only when that sign-in is really gone.
try{ if(localStorage.getItem('clientPortal_session')){ document.getElementById('loginScreen').style.display = 'none'; document.documentElement.classList.add('has-session'); } }catch(e){}
</script>
<div id="appRoot" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)">
    <div style="min-width:0">
      <div style="font-size:16px;font-weight:700"><i class="ti ti-building-store"></i> <span data-i18n>Client Portal</span></div>
      <div id="clientName" style="font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
    </div>
    <div id="headerActions" style="display:flex;gap:6px;align-items:center">
      <button class="btn sm" onclick="goToManager()" title="Back to the manager app" data-i18n-title="Back to the manager app"><i class="ti ti-home"></i> <span class="mgr-label" data-i18n>Manager</span></button>
      <button class="btn sm" onclick="logout()"><i class="ti ti-logout"></i> <span data-i18n>Log out</span></button>
    </div>
  </div>
  <div style="padding:16px;max-width:760px;margin:0 auto" id="hoursRoot"></div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── Shared helpers duplicated on purpose from the other pages (CLAUDE.md →
// Duplicated on purpose; keep the copies the same).
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function localYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ── Translations (the same core as schedule-manager.html: I18N_LANGS, tr,
// applyI18n, uiLocale, loadI18n — keep the copies the same; docs/translations.md).
// The language is this device's choice (the language select, English by
// default), kept in localStorage.uiLang — shared by the three pages.
const I18N_LANGS = {en:'English', he:'עברית', ru:'Русский'};
var I18N = {}, I18N_LANG = 'en';
function tr(s, params){
  let out = (I18N_LANG !== 'en' && I18N[s]) || s;
  if(params) out = out.replace(/\{(\w+)\}/g, (m, k) => params[k] != null ? params[k] : m);
  return out;
}
function applyI18n(root){
  const host = root || document;
  const keyOf = (el, attr) => { const k = '__i18n_' + attr; if(el[k] == null) el[k] = attr === 'text' ? (el.getAttribute('data-i18n') || el.textContent.trim()) : el.getAttribute('data-i18n-' + attr); return el[k]; };
  host.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(keyOf(el, 'text')); });
  host.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = tr(keyOf(el, 'placeholder')); });
  host.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tr(keyOf(el, 'title')); });
}
function uiLocale(){ return {he:'he-IL', ru:'ru-RU'}[I18N_LANG] || 'en-GB'; }
async function loadI18n(lang){
  const set = (l, d) => { I18N_LANG = l; I18N = d || {}; document.documentElement.lang = l; };
  if(!I18N_LANGS[lang] || lang === 'en'){ set('en', {}); return; }
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem('i18n_' + lang) || 'null'); }catch(e){}
  if(cached) set(lang, cached);
  const fresh = fetch('i18n/' + lang + '.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(d => {
    if(!d || typeof d !== 'object') return false;
    const changed = JSON.stringify(d) !== JSON.stringify(cached);
    try{ localStorage.setItem('i18n_' + lang, JSON.stringify(d)); }catch(e){}
    if(I18N_LANG === lang || !cached) set(lang, d);
    return changed;
  }).catch(() => false);
  if(cached){ fresh.then(ch => { if(ch && I18N_LANG === lang) redrawForLanguage(); }); return; }
  await fresh;
}
function storedLanguage(){ try{ const l = localStorage.getItem('uiLang'); return I18N_LANGS[l] ? l : 'en'; }catch(e){ return 'en'; } }
// The language select (one per page, #langSelect): keeps the choice on this device and redraws in it;
// a signed-in user's choice is also saved to their account (updateMyLanguage), and login brings it back on any device.
async function setLanguage(lang, opts){
  lang = I18N_LANGS[lang] ? lang : 'en';
  try{ localStorage.setItem('uiLang', lang); }catch(e){}
  if(!(opts && opts.save === false) && getSession()){
    loadFirestoreBackend().then(b => b.handleAction('updateMyLanguage', {action:'updateMyLanguage', language: lang}, {})).catch(()=>{});
  }
  try{ await loadI18n(lang); }catch(e){}
  redrawForLanguage();
}
// The one language select sits in the header, or on the login screen while that one is shown.
function placeLangSelect(){
  const sel = document.getElementById('langSelect'); if(!sel) return;
  const login = document.getElementById('loginScreen');
  const onLogin = login && login.style.display !== 'none';
  const host = onLogin ? login : document.getElementById('headerActions');
  sel.classList.toggle('on-cover', !!onLogin);
  if(host && sel.parentNode !== host) host.prepend(sel);
}
function syncLangSelects(){ document.querySelectorAll('select.lang-select').forEach(el => { el.value = I18N_LANG; }); }
function redrawForLanguage(){
  applyI18n(); syncLangSelects();
  if(document.getElementById('appRoot').style.display !== 'none') { if(window.hrvRender) hrvRender(); }
}
// SheetJS (Excel read and write, ~900 KB) is loaded only when an Excel
// export or import needs it, not with the page. Same code in
// schedule-manager.html and supplier-portal.html.
let __xlsxLoading = null;
function loadXlsx(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  return __xlsxLoading || (__xlsxLoading = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => res();
    sc.onerror = () => { __xlsxLoading = null; sc.remove(); rej(new Error(tr('Excel library not loaded'))); };
    document.head.appendChild(sc);
  }));
}

// Toast (the same in all three pages): small, an icon and a coloured edge by
// its kind, guessed from the text — error, ongoing (ends with …), warning,
// else done.
const TOAST_ICONS={ok:'ti-circle-check',warn:'ti-alert-triangle',err:'ti-alert-circle',info:'ti-info-circle'};
function toastKind(t){
  if(/fail|error|could not|couldn't|not saved|denied|refused|invalid|נכשל|שגיאה|לא נשמר|לא ניתן/i.test(t)) return 'err';
  if(/(…|\.\.\.)\s*$/.test(t)) return 'info';
  if(/⚠|warn|check|empty|missing|not found|בדקו|ריק|חסר|לא נמצא/i.test(t)) return 'warn';
  return 'ok';
}
function showToast(msg,dur){
  const t=document.getElementById('toast'), text=String(msg), k=toastKind(text);
  t.className='toast show '+k; t.innerHTML='<i class="ti '+TOAST_ICONS[k]+'"></i><span></span>'; t.lastChild.textContent=text;
  clearTimeout(t.__hide); t.__hide=setTimeout(()=>t.classList.remove('show'),dur||2500);
}
// ── New version check (2026-10-04; the same code in schedule-manager.html,
// worker-punch.html and supplier-portal.html). An app left open — a PWA in
// the background — keeps running the code it loaded, even after a deploy.
// When the page comes back to the screen, and every 30 min while it is
// shown, the files it runs are asked for their ETag (HEAD: the service
// worker only handles GET, and cache:'no-store' skips the HTTP cache). The
// first answer is the baseline; a changed ETag later means a deploy, and a
// bar offers to reload. Nothing reloads on its own (typed data stays).
function startVersionWatch(files){
  let base=null, shown=false;
  const tags=async()=>{
    const out={};
    for(const f of files()){
      const r=await fetch(f,{method:'HEAD',cache:'no-store'});
      if(!r.ok) return null;
      out[f]=r.headers.get('etag')||r.headers.get('last-modified')||'';
    }
    return out;
  };
  const check=async()=>{
    if(shown||document.visibilityState!=='visible'||navigator.onLine===false) return;
    try{
      const t=await tags(); if(!t) return;
      if(!base){ base=t; return; }
      for(const f in t){ if(!(f in base)){ base[f]=t[f]; continue; } if(t[f]&&base[f]&&t[f]!==base[f]){ shown=true; showNewVersionBar(); return; } }
    }catch(e){}
  };
  document.addEventListener('visibilitychange',check);
  setInterval(check,30*60*1000);
  check();
}
function showNewVersionBar(){
  if(document.getElementById('newVersionBar')) return;
  document.body.insertAdjacentHTML('beforeend',`<div id="newVersionBar" style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100000;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 12px 10px 16px;border-radius:12px;background:#1f6feb;color:#fff;font:600 14px/1.3 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)">
    <span>${tr('A new version is available')}</span>
    <button type="button" onclick="location.reload()" style="border:0;border-radius:8px;padding:6px 12px;background:#fff;color:#1f6feb;font:inherit;cursor:pointer">${tr('Update')}</button>
    <button type="button" aria-label="${tr('Close')}" onclick="this.parentElement.remove()" style="border:0;background:none;color:#fff;font:inherit;font-size:18px;cursor:pointer;padding:0 4px">✕</button></div>`);
}
startVersionWatch(()=>[location.pathname,'firestore-backend.js',...(window.hoursReviewMount?['hours-review.js']:[])]);
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
// Every modal closes on a tap anywhere outside it — on the dark backdrop,
// including where the card or row that opened it was (per user request
// 2026-10-04, for every modal; modals have no ✕ and no Cancel button). Only
// when the press also started on the backdrop, so a drag that starts inside
// the modal (selecting text, moving a map pin) and ends outside doesn't close
// it. The topmost open overlay is the one under the tap, so a modal over
// another closes alone. An overlay whose closing must undo something sets
// overlay.__onUserClose (e.g. the client billing-rate popup reverts the rate
// mode); otherwise closeModal(id). The same code is in schedule-manager.html
// and supplier-portal.html.
let _overlayDownOn=null;
document.addEventListener('pointerdown',e=>{ _overlayDownOn=e.target; },true);
document.addEventListener('click',e=>{
  const t=e.target;
  if(!(t&&t.classList&&t.classList.contains('overlay')&&t.classList.contains('open')&&_overlayDownOn===t&&t.id)) return;
  if(typeof t.__onUserClose==='function') t.__onUserClose(); else closeModal(t.id);
});


// Same shift-pairing logic as schedule-manager.html's own
// groupPunchesIntoShifts()/analyzeDayPunches() — duplicated here rather than
// imported (no shared build in this codebase).
function groupPunchesIntoShifts(entries){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const buckets=[]; let cur=null;
  chrono.forEach(e=>{
    if(e.type==='in'){ if(cur) buckets.push(cur); cur={date:new Date(e.ts),entries:[e]}; }
    else { if(!cur) cur={date:new Date(e.ts),entries:[]}; cur.entries.push(e); buckets.push(cur); cur=null; }
  });
  if(cur) buckets.push(cur);
  return buckets;
}
function toMins(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function roundMins(m){ return m; }
function analyzeDayPunches(entries,date){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  let hours=0, openIn=null; const warnings=[];
  chrono.forEach(e=>{
    if(e.type==='in'){ openIn=e; }
    else if(e.type==='out'){
      if(!openIn) return;
      if(!openIn.time||!e.time){ openIn=null; return; }
      let dur=toMins(e.time)-toMins(openIn.time); if(dur<0) dur+=1440;
      hours+=dur/60; openIn=null;
    }
  });
  return {hours,warnings};
}


// ── Session (own key: never shares another page's login) ─────────────────────
const SESSION_KEY = 'clientPortal_session';
function getSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(!s || !s.uid || s.role !== 'client'){ localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
// Back to the manager app (its own login): this portal's sign-in ends first,
// since one browser holds one Firebase sign-in for the whole site.
async function goToManager(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  try{ await (await loadFirestoreBackend()).signOut(); }catch(e){}
  location.href = 'schedule-manager.html';
}
async function logout(){
  localStorage.removeItem(SESSION_KEY);
  try{ await (await loadFirestoreBackend()).signOut(); }catch(e){}
  location.reload();
}

// ── Backend: the login function signs the device in (firestore-backend.js);
// every data call goes to the hours function (hours-review.js) with the
// Firebase ID token.
let __fsBackend = null;
function loadFirestoreBackend(){
  if(__fsBackend) return __fsBackend;
  __fsBackend = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = 'firestore-backend.js';
    el.onload = () => window.initFirestoreBackend().then(resolve, reject);
    el.onerror = () => reject(new Error('firestore-backend.js failed to load'));
    document.head.appendChild(el);
  }).catch(e => { __fsBackend = null; throw e; });
  return __fsBackend;
}
loadFirestoreBackend().catch(e => console.warn('Firestore backend:', e));
async function hoursCall(body){
  const idToken = await (await loadFirestoreBackend()).idToken();
  const res = await fetch(HOURS_FN_URL, {method:'POST',
    headers:{'Content-Type':'application/json', Authorization:'Bearer ' + idToken}, body: JSON.stringify(body)});
  return res.json();
}
async function submitLogin(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = tr('Enter username and password'); return; }
  try{
    const b = await loadFirestoreBackend();
    const json = await b.login(username, password);
    if(json.error){ errEl.textContent = json.error; return; }
    if(json.role !== 'client'){ await b.signOut(); errEl.textContent = tr('This login is not a client account'); return; }
    saveSession({uid: json.uid, role: json.role, tenantId: json.tenantId, clientId: json.clientId, username: json.username});
    if(json.language && json.language !== I18N_LANG) await setLanguage(json.language, {save:false});
    gateApp();
  }catch(e){ errEl.textContent = tr('Network error'); }
}

// The hours screen (hours-review.js, shared with the supplier portal and the
// manager app's HR view), loaded once.
let __hrvLoading = null;
function loadHoursReview(){
  if(window.hoursReviewMount) return Promise.resolve();
  return __hrvLoading = __hrvLoading || new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = 'hours-review.js';
    el.onload = resolve;
    el.onerror = () => { __hrvLoading = null; reject(new Error('hours-review.js failed to load')); };
    document.head.appendChild(el);
  });
}

async function gateApp(){
  let s = getSession();
  // The Firebase sign-in is gone (site data cleared, signed out): log in again.
  if(s){ try{ if(!(await loadFirestoreBackend()).currentUser()){ localStorage.removeItem(SESSION_KEY); s = null; } }catch(e){} }
  document.documentElement.classList.remove('has-session');  // the early open ends here
  document.getElementById('loginScreen').style.display = s ? 'none' : 'flex';
  document.getElementById('appRoot').style.display = s ? '' : 'none';
  placeLangSelect();
  if(!s) return;
  try{ await loadHoursReview(); }catch(e){ showToast(tr('Could not load — check the connection and try again.')); return; }
  await hoursReviewMount(document.getElementById('hoursRoot'), {hideOwner: true, call: async body => {
    const r = await hoursCall(body);
    if(r && r.error && /session|sign in|token/i.test(r.error)) logout();
    if(body.action === 'load' && r && r.owner) document.getElementById('clientName').textContent = [r.owner.name, r.owner.object].filter(Boolean).join(' · ');
    return r;
  }});
}
new MutationObserver(placeLangSelect).observe(document.getElementById('loginScreen'), {attributes:true, attributeFilter:['style']});
loadI18n(storedLanguage()).catch(()=>{}).then(()=>{ applyI18n(); syncLangSelects(); placeLangSelect(); gateApp(); });
</script>
</body>
</html>
