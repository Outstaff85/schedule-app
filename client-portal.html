<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Client Portal</title>
<link rel="stylesheet" href="icons/tabler-icons.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Client Portal (/client) — a separate page, like the supplier portal: a
   client login must never see wages, rates, suppliers, GPS or documents, so
   it never reads Firestore; the hours function (functions-auth/hours.py)
   hands out only its own workers' shifts at its site, drawn by the shared
   hours-review.js.
   docs/client-portal.md. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#eef0f8;--text2:#7c84a0;--text3:#3a4060;
  --green:#6dd6a0;--green-bg:rgba(109,214,160,0.12);
  --red:#ff4f5e;--red-bg:rgba(255,79,94,0.12);
  --amber:#f5a623;--amber-bg:rgba(245,166,35,0.12);
  --accent:#4f8ef7;--radius:12px;--radius-sm:8px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;}
body{padding-bottom:40px;}
.btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.green{background:var(--green-bg);border-color:rgba(109,214,160,0.35);color:var(--green);}
.btn:disabled{opacity:.5;cursor:default;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;}
.field input,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:13px;outline:none;font-family:inherit;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:500;padding:16px;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;gap:8px;max-width:min(340px,calc(100vw - 32px));box-sizing:border-box;background:var(--bg2,#181c27);border:1px solid var(--border2);border-left:3px solid var(--green);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;line-height:1.35;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{font-size:16px;color:var(--green);flex-shrink:0;}
.toast.warn{border-left-color:var(--amber);} .toast.warn i{color:var(--amber);}
.toast.err{border-left-color:var(--red);} .toast.err i{color:var(--red);}
.toast.info{border-left-color:var(--blue,#60a5fa);} .toast.info i{color:var(--blue,#60a5fa);}
table{width:100%;border-collapse:collapse;}
th,td{padding:7px 8px;text-align:left;font-size:12px;border-bottom:1px solid var(--border);}
th{color:var(--text2);font-size:11px;}
html[lang="he"] *{letter-spacing:normal !important;}
html.has-session #appRoot{display:block !important;}
/* The app's template (variant 3, the same as the manager app): figures as
   text, sections with a count, lines with a colored mark on the left; on a
   phone a window opens from the bottom. Keep the copies the same. */
.t3-stats{display:flex;gap:20px;flex-wrap:wrap;margin:2px 2px 14px}
.t3-stats>div{font-size:11px;color:var(--text2)}
.t3-stats b{display:block;font-size:24px;font-weight:700;line-height:1.1;color:var(--text)}
.t3-sec{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);margin:16px 2px 6px}
.t3-sec em{font-style:normal;margin-left:auto;color:var(--text3);font-weight:500}
.t3-line{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-left:3px solid var(--c,var(--border2));background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 85%);border-radius:0 8px 8px 0;margin-bottom:4px;font-size:13px}
.t3-line.tap-edit,.t3-line[onclick]{cursor:pointer}
.t3-line .n{flex:1;min-width:0}
.t3-line .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t3-line .n small{display:block;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t3-line .r{font-family:'DM Mono',ui-monospace,monospace;font-size:12px;color:var(--text2);white-space:nowrap}
.t3-av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;background:var(--bg3);color:var(--text2)}
.t3-av img{width:100%;height:100%;object-fit:cover}
.t3-empty{color:var(--text3);font-size:13px;padding:6px 2px 4px}
.t3-x{background:none;border:0;color:var(--red);opacity:.5;font-size:15px;cursor:pointer;padding:4px 6px}
.t3-x:hover{opacity:1}
@media (max-width:700px){
  .overlay{align-items:flex-end;padding:0}
  .overlay>.modal{max-width:100% !important;max-height:88vh;border-radius:18px 18px 0 0;border-bottom:0;padding:14px 16px 20px}
  .overlay>.modal::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 12px}
}

/* The account menu (header variant C, the same in the manager app and both
   portals): one button with the login's name; inside it language and sign out. */
.acct{position:relative;}
.acct-chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font:600 13px inherit;cursor:pointer;max-width:240px;}
.acct-av{width:28px;height:28px;flex:none;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7a5cf7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;text-transform:uppercase;}
.acct-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-chev{color:var(--text2);font-size:14px;}
.acct-menu{display:none;position:absolute;right:0;top:44px;width:230px;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:6px;z-index:900;}
.acct.open .acct-menu{display:block;}
.acct-h{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.acct-h b{display:block;font-size:13px;color:var(--text);}
.acct-h span{font-size:11px;color:var(--text2);}
.acct-mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--text);font:500 13px inherit;cursor:pointer;text-align:left;}
.acct-mi i{font-size:17px;color:var(--text2);}
.acct-mi:hover{background:var(--bg3);}
.acct-mi.out,.acct-mi.out i{color:var(--red);}
@media (max-width:500px){ .acct-label,.acct-chev{display:none;} .acct-chip{padding:0 4px;} }


/* A window open: the page behind it does not scroll, and a scroll inside the
   window never carries over to the page (swipe down closes it on a phone). */
body:has(.overlay.open){overflow:hidden}
.overlay,.overlay>.modal{overscroll-behavior:contain}
/* ── Odinson Glass foundation (docs/redesign.md): the ground, glass, plates, the
   highlight line, tick tiles, the Language button and sheet. The same block in
   all four pages — keep the copies the same. ── */
:root{--ground:#10141f;--plate:#1b1e29;--glass:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.2);--glass-edge:rgba(255,255,255,.28);--glass-dark:rgba(17,20,31,.92);--fig:#9fe6c0;--ok:#6dd6a0;--info:#4f8ef7;--warn:#f5a623;--bad:#ff5f6d;--uline:linear-gradient(90deg,#818cf8,#22d3ee,#f472b6,#818cf8);}
html{background:var(--ground);}
body{background:transparent;}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(79,70,229,.50) 0,transparent 56%),radial-gradient(circle at 92% 62%,rgba(6,182,212,.36) 0,transparent 54%),radial-gradient(circle at 40% 108%,rgba(219,39,119,.34) 0,transparent 56%),var(--ground);}
@keyframes og-flow{to{background-position:300% 0}}
@keyframes og-pop{0%{transform:scaleX(0)}60%{transform:scaleX(1.12)}100%{transform:scaleX(1)}}
/* The highlight line: one 3px flowing gradient line with a glow; .og-line on any
   element draws it under that element (it springs in when it appears). */
.og-line{position:relative;}
.og-line::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:2px;background:var(--uline);background-size:300% 100%;box-shadow:0 0 10px rgba(34,211,238,.55),0 0 4px rgba(244,114,182,.5);animation:og-flow 2.4s linear infinite,og-pop .5s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
/* Glass buttons: white fill + blur, a shine sweep on every tap (.shine, set by
   the pointerdown handler), the highlight line on hover and when .on. */
.gbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-edge);color:#fff;font:600 14px 'DM Sans','Heebo',Arial,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.gbtn.primary{background:rgba(255,255,255,.28);}
.gbtn.icon{width:42px;padding:0;}
.gbtn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);pointer-events:none;}
.gbtn.shine::after{left:130%;transition:left .6s;}
.gbtn::before{content:'';position:absolute;left:12px;right:12px;bottom:1px;height:3px;border-radius:2px;background:var(--uline);background-size:300% 100%;box-shadow:0 0 10px rgba(34,211,238,.55),0 0 4px rgba(244,114,182,.5);animation:og-flow 2.4s linear infinite;transform:scaleX(0);transition:transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
@media (hover:hover){.gbtn:hover::before{transform:scaleX(1);}}
.gbtn.on::before{transform:scaleX(1);}
/* Plates: the solid content tile, a 4px status bar (--c) on the left and the
   avatar disc in the same color; figures (hours, money) in one soft green. */
.plate{position:relative;display:flex;align-items:center;gap:12px;padding:11px 8px 11px 14px;background:var(--plate);border-radius:16px;box-shadow:inset 4px 0 0 var(--c,var(--ok));}
.plate-av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--c,var(--ok));background:color-mix(in srgb,var(--c,var(--ok)) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--c,var(--ok));}
.fig{font-family:'DM Mono',ui-monospace,monospace;color:var(--fig);}
/* Tick tiles: a grey box; ticked — the tile tinted green, the box green and
   the check mark drawing itself (350 ms). */
label.check-chip{background:var(--plate);border-color:transparent;transition:background .25s,border-color .25s;}
label.check-chip input[type=checkbox]{-webkit-appearance:none;appearance:none;position:relative;width:22px;height:22px;flex:0 0 22px;margin:0;border-radius:7px;border:2px solid #4a5170;background:transparent;cursor:pointer;transition:background .25s,border-color .25s;}
label.check-chip input[type=checkbox]::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #0b0d14;border-width:0 3px 3px 0;transform:rotate(45deg);clip-path:inset(100% 0 0 0);transition:clip-path .35s .05s;}
label.check-chip input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok);}
label.check-chip input[type=checkbox]:checked::after{clip-path:inset(0);}
label.check-chip:has(input:checked){background:#1b2a28;border-color:rgba(109,214,160,.4);}
/* The Language button (top right of every page) and its sheet. */
.lang-btn{height:36px;padding:0 10px 0 9px;gap:6px;border-radius:14px;font-size:13px;flex:none;}
.lang-btn i{font-size:17px;}
.lang-btn .lang-btn-chev{font-size:14px;opacity:.7;}
.lang-btn.on-cover{position:absolute;top:max(env(safe-area-inset-top,0px),12px);right:12px;z-index:2;}
.lang-ov{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;}
.lang-ov.open{opacity:1;pointer-events:auto;}
.lang-sheet{width:min(380px,100%);max-height:min(560px,80vh);display:flex;flex-direction:column;padding:14px 14px 16px;border-radius:22px;background:var(--glass-dark);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.5);color:#fff;transform:translateY(12px) scale(.98);transition:transform .35s cubic-bezier(.3,.7,.3,1);}
.lang-ov.open .lang-sheet{transform:none;}
.lang-grab{display:none;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:0 auto 10px;}
.lang-sheet h4{font-size:17px;font-weight:600;margin:0 4px 10px;}
.lang-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);}
.lang-search i{color:#8b90a0;font-size:16px;}
.lang-search input{flex:1;min-width:0;border:0;background:none;color:#fff;font:14px 'DM Sans','Heebo',Arial,sans-serif;outline:none;padding:0;}
.lang-list{overflow:auto;display:flex;flex-direction:column;gap:4px;}
.lang-li{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:#fff;font-family:'DM Sans','Heebo',Arial,sans-serif;text-align:left;cursor:pointer;}
.lang-li:hover{background:rgba(255,255,255,.06);}
.lang-li b{font-size:15px;font-weight:600;}
.lang-li small{flex:1;font-size:12px;color:#8b90a0;}
.lang-li.on{background:rgba(109,214,160,.1);}
.lang-li.on::after{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:linear-gradient(180deg,#818cf8,#22d3ee,#f472b6);}
.lang-tick{width:22px;height:22px;border-radius:7px;background:var(--ok);color:#0b0d14;display:flex;align-items:center;justify-content:center;font-size:14px;}
.lang-none{padding:14px 12px;color:#8b90a0;font-size:13px;}
@media (max-width:700px){
  .lang-ov{align-items:flex-end;padding:0;}
  .lang-sheet{width:100%;max-height:78vh;border-radius:22px 22px 0 0;border-width:1px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);}
  .lang-grab{display:block;}
}
@media (prefers-reduced-motion:reduce){.og-line::after,.gbtn::before{animation:none;}.gbtn.shine::after{transition:none;}}
/* Portal header and tabs (redesign stage 10): the logo mark, a glass header,
   glass tabs with the highlight line. */
.pt-head{background:rgba(16,20,31,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1)!important;position:sticky;top:0;z-index:40}
.pt-mark{width:30px;height:30px;flex:none;overflow:visible;vertical-align:-8px;margin-right:6px}
.og-roof{fill:none;stroke:rgba(255,255,255,.28);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.og-run{fill:none;stroke:url(#ogMarkGrad);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40 180;animation:og-run 2.8s linear infinite}
@keyframes og-run{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
.og-p{opacity:.55;animation:og-lit 2.8s ease-in-out infinite}.og-p2{animation-delay:.93s}.og-p3{animation-delay:1.86s}
@keyframes og-lit{0%,100%{opacity:.55;transform:none}15%{opacity:1;transform:translateY(-4px)}35%{opacity:.55;transform:none}}
.og-link{fill:none;stroke:rgba(255,255,255,.22);stroke-width:4;stroke-linecap:round}
.og-linkrun{fill:none;stroke:url(#ogMarkGrad);stroke-width:4;stroke-linecap:round;stroke-dasharray:14 90;animation:og-linkrun 2.8s linear infinite}
@keyframes og-linkrun{from{stroke-dashoffset:104}to{stroke-dashoffset:0}}
.tab-btn{position:relative;border:1px solid transparent!important;border-radius:14px!important;height:36px;padding:0 14px!important}
.tab-btn.active{background:var(--glass-hi)!important;border-color:rgba(255,255,255,.35)!important;color:#fff!important}
.tab-btn.active::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:2px;background:var(--uline);background-size:300% 100%;box-shadow:0 0 10px rgba(34,211,238,.55);animation:og-flow 2.4s linear infinite,og-pop .5s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion:reduce){.og-run,.og-p,.og-linkrun{animation:none}}
  /* Odinson Glass form fields (mockup 04, owner 2026-10-13): every field in a
     window is a soft rounded glass box — 46px tall, 14px corners, a faint fill
     and hairline, a cyan focus ring; selects carry a thin chevron; labels are
     small and muted. The same block in the manager app and both portals. */
  .modal .field>label:not(.check-chip){font-size:12px;font-weight:500;color:#8b90a0;margin:0 4px 5px}
  .modal .field input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]),.modal .field select,.modal .field textarea{
    height:46px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background-color:rgba(255,255,255,.05);color:var(--text);font-size:15px;
    box-shadow:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
  .modal .field textarea{height:auto;min-height:92px;padding:12px 14px;line-height:1.45}
  .modal .field select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#8b90a0 50%),linear-gradient(135deg,#8b90a0 50%,transparent 50%);
    background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px;background-repeat:no-repeat}
  .modal [dir=rtl] .field select,.modal .field select[dir=rtl]{padding-right:14px;padding-left:36px;background-position:14px 20px,19px 20px}
  .modal .field input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]):focus,.modal .field select:focus,.modal .field textarea:focus{
    outline:none;border-color:rgba(34,211,238,.6);background-color:rgba(255,255,255,.07);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
  .modal .field input::placeholder,.modal .field textarea::placeholder{color:rgba(255,255,255,.35)}
  .modal .field input:disabled,.modal .field select:disabled{opacity:.55}
  .modal .field .scan-missing{border-color:rgba(245,166,35,.6) !important;background-color:rgba(245,166,35,.06) !important}
  .modal .rate-in input{padding-left:58px !important}
  .modal .seg-toggle{gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .modal .seg-toggle button{position:relative;height:36px;padding:0 6px;border-radius:10px;color:#8b90a0}
  .modal .seg-toggle button.on{background:rgba(255,255,255,.12);color:#fff}
  .modal .seg-toggle button.on::after{content:'';position:absolute;left:28%;right:28%;bottom:3px;height:2px;border-radius:2px;background:var(--uline,#22d3ee);background-size:300% 100%;animation:og-flow 2.4s linear infinite}
</style>
</head>
<body>

<script>
// One login for every role (per user request 2026-10-11): the manager app's
// login page signs a supplier or client in and hands over to its portal; a
// kept login opens the portal at once, no login means that page.
try{ if(localStorage.getItem('clientPortal_session')) document.documentElement.classList.add('has-session'); else location.replace('schedule-manager.html'); }catch(e){}
</script>
<div id="appRoot" style="display:none">
  <div class="pt-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)">
    <div style="min-width:0">

<div id="toast" class="toast"></div>

<script>
// ── Shared helpers duplicated on purpose from the other pages (CLAUDE.md →
// Duplicated on purpose; keep the copies the same).
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function localYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ── Translations (the same core as schedule-manager.html: I18N_LANGS, tr,
// applyI18n, uiLocale, loadI18n — keep the copies the same; docs/translations.md).
// The language is this device's choice (the language select, English by
// default), kept in localStorage.uiLang — shared by the three pages.
const I18N_LANGS = {en:'English', he:'עברית', ru:'Русский'};
var I18N = {}, I18N_LANG = 'en';
function tr(s, params){
  let out = (I18N_LANG !== 'en' && I18N[s]) || s;
  if(params) out = out.replace(/\{(\w+)\}/g, (m, k) => params[k] != null ? params[k] : m);
  return out;
}
function applyI18n(root){
  const host = root || document;
  const keyOf = (el, attr) => { const k = '__i18n_' + attr; if(el[k] == null) el[k] = attr === 'text' ? (el.getAttribute('data-i18n') || el.textContent.trim()) : el.getAttribute('data-i18n-' + attr); return el[k]; };
  host.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(keyOf(el, 'text')); });
  host.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = tr(keyOf(el, 'placeholder')); });
  host.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tr(keyOf(el, 'title')); });
}
function uiLocale(){ return {he:'he-IL', ru:'ru-RU'}[I18N_LANG] || 'en-GB'; }
async function loadI18n(lang){
  const set = (l, d) => { I18N_LANG = l; I18N = d || {}; document.documentElement.lang = l; };
  if(!I18N_LANGS[lang] || lang === 'en'){ set('en', {}); return; }
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem('i18n_' + lang) || 'null'); }catch(e){}
  if(cached) set(lang, cached);
  const fresh = fetch('i18n/' + lang + '.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(d => {
    if(!d || typeof d !== 'object') return false;
    const changed = JSON.stringify(d) !== JSON.stringify(cached);
    try{ localStorage.setItem('i18n_' + lang, JSON.stringify(d)); }catch(e){}
    if(I18N_LANG === lang || !cached) set(lang, d);
    return changed;
  }).catch(() => false);
  if(cached){ fresh.then(ch => { if(ch && I18N_LANG === lang) redrawForLanguage(); }); return; }
  await fresh;
}
function storedLanguage(){ try{ const l = localStorage.getItem('uiLang'); return I18N_LANGS[l] ? l : 'en'; }catch(e){ return 'en'; } }
// The language (the Language button, .lang-btn): keeps the choice on this device and redraws in it;
// a signed-in user's choice is also saved to their account (updateMyLanguage), and login brings it back on any device.
async function setLanguage(lang, opts){
  lang = I18N_LANGS[lang] ? lang : 'en';
  try{ localStorage.setItem('uiLang', lang); }catch(e){}
  if(!(opts && opts.save === false) && getSession()){
    loadFirestoreBackend().then(b => b.handleAction('updateMyLanguage', {action:'updateMyLanguage', language: lang}, {})).catch(()=>{});
  }
  try{ await loadI18n(lang); }catch(e){}
  redrawForLanguage();
}
// The Language button (.lang-btn, top right of every page) and its sheet: the
// button shows the current language's own name; a tap opens a sheet with a
// search field and every language of I18N_LANGS (own script + English name),
// the current one ticked; a pick goes through setLanguage. A tap outside the
// sheet or Escape closes it. The same code in all four pages — keep them the same.
const I18N_LANG_EN = {en:'English', he:'Hebrew', ru:'Russian'};
function syncLangButtons(){
  document.querySelectorAll('.lang-btn .lang-btn-name').forEach(el => { el.textContent = I18N_LANGS[I18N_LANG] || I18N_LANGS.en; });
  const ov = document.getElementById('langSheet'); if(ov && ov.classList.contains('open')) renderLangList();
}
function openLangSheet(e){
  if(e) e.stopPropagation();
  let ov = document.getElementById('langSheet');
  if(!ov){
    ov = document.createElement('div'); ov.id = 'langSheet'; ov.className = 'lang-ov';
    ov.innerHTML = '<div class="lang-sheet" role="dialog" aria-modal="true"><div class="lang-grab"></div><h4></h4><label class="lang-search"><i class="ti ti-search"></i><input type="search" autocomplete="off" spellcheck="false"></label><div class="lang-list"></div></div>';
    ov.addEventListener('click', ev => { if(ev.target === ov) closeLangSheet(); });
    ov.querySelector('input').addEventListener('input', renderLangList);
    document.body.appendChild(ov);
  }
  ov.querySelector('h4').textContent = tr('Language');
  const inp = ov.querySelector('input'); inp.value = ''; inp.placeholder = tr('Search a language');
  renderLangList();
  void ov.offsetWidth; ov.classList.add('open');
}
function closeLangSheet(){ const ov = document.getElementById('langSheet'); if(ov) ov.classList.remove('open'); }
function renderLangList(){
  const ov = document.getElementById('langSheet'); if(!ov) return;
  const q = ov.querySelector('input').value.trim().toLowerCase();
  const langs = Object.keys(I18N_LANGS).filter(l => !q || [l, I18N_LANGS[l], I18N_LANG_EN[l] || ''].join(' ').toLowerCase().includes(q));
  ov.querySelector('.lang-list').innerHTML = langs.map(l => `<button type="button" class="lang-li${l === I18N_LANG ? ' on' : ''}" data-lang="${esc(l)}" onclick="pickLanguage('${esc(l)}')"><b>${esc(I18N_LANGS[l])}</b><small>${esc(I18N_LANG_EN[l] || '')}</small>${l === I18N_LANG ? '<span class="lang-tick"><i class="ti ti-check"></i></span>' : ''}</button>`).join('')
    || `<div class="lang-none">${esc(tr('No language found'))}</div>`;
}
function pickLanguage(l){ closeLangSheet(); if(l !== I18N_LANG) setLanguage(l); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeLangSheet(); });
// Glass buttons shine on every tap (CSS .gbtn.shine).
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.gbtn'); if(!b) return;
  b.classList.remove('shine'); void b.offsetWidth; b.classList.add('shine');
  clearTimeout(b.__shineT); b.__shineT = setTimeout(() => b.classList.remove('shine'), 650);
});
function redrawForLanguage(){
  applyI18n(); syncLangButtons();
  if(document.getElementById('appRoot').style.display !== 'none') { if(window.hrvRender) hrvRender(); }
}
// SheetJS (Excel read and write, ~900 KB) is loaded only when an Excel
// export or import needs it, not with the page. Same code in
// schedule-manager.html and supplier-portal.html.
let __xlsxLoading = null;
function loadXlsx(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  return __xlsxLoading || (__xlsxLoading = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => res();
    sc.onerror = () => { __xlsxLoading = null; sc.remove(); rej(new Error(tr('Excel library not loaded'))); };
    document.head.appendChild(sc);
  }));
}

// Toast (the same in all three pages): small, an icon and a coloured edge by
// its kind, guessed from the text — error, ongoing (ends with …), warning,
// else done.
const TOAST_ICONS={ok:'ti-circle-check',warn:'ti-alert-triangle',err:'ti-alert-circle',info:'ti-info-circle'};
function toastKind(t){
  if(/fail|error|could not|couldn't|not saved|denied|refused|invalid|נכשל|שגיאה|לא נשמר|לא ניתן/i.test(t)) return 'err';
  if(/(…|\.\.\.)\s*$/.test(t)) return 'info';
  if(/⚠|warn|check|empty|missing|not found|בדקו|ריק|חסר|לא נמצא/i.test(t)) return 'warn';
  return 'ok';
}
function showToast(msg,dur){
  const t=document.getElementById('toast'), text=String(msg), k=toastKind(text);
  t.className='toast show '+k; t.innerHTML='<i class="ti '+TOAST_ICONS[k]+'"></i><span></span>'; t.lastChild.textContent=text;
  clearTimeout(t.__hide); t.__hide=setTimeout(()=>t.classList.remove('show'),dur||2500);
}
// ── New version check (2026-10-04; the same code in schedule-manager.html,
// worker-punch.html and supplier-portal.html). An app left open — a PWA in
// the background — keeps running the code it loaded, even after a deploy.
// When the page comes back to the screen, and every 30 min while it is
// shown, the files it runs are asked for their ETag (HEAD: the service
// worker only handles GET, and cache:'no-store' skips the HTTP cache). The
// first answer is the baseline; a changed ETag later means a deploy, and a
// bar offers to reload. Nothing reloads on its own (typed data stays).
function startVersionWatch(files){
  let base=null, shown=false;
  const tags=async()=>{
    const out={};
    for(const f of files()){
      const r=await fetch(f,{method:'HEAD',cache:'no-store'});
      if(!r.ok) return null;
      out[f]=r.headers.get('etag')||r.headers.get('last-modified')||'';
    }
    return out;
  };
  const check=async()=>{
    if(shown||document.visibilityState!=='visible'||navigator.onLine===false) return;
    try{
      const t=await tags(); if(!t) return;
      if(!base){ base=t; return; }
      for(const f in t){ if(!(f in base)){ base[f]=t[f]; continue; } if(t[f]&&base[f]&&t[f]!==base[f]){ shown=true; showNewVersionBar(); return; } }
    }catch(e){}
  };
  document.addEventListener('visibilitychange',check);
  setInterval(check,30*60*1000);
  check();
}
function showNewVersionBar(){
  if(document.getElementById('newVersionBar')) return;
  // One compact line at the top (per user request 2026-10-11): it never
  // covers the bottom tab bar and stays until Update or ✕.
  document.body.insertAdjacentHTML('beforeend',`<div id="newVersionBar" role="status" style="position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:100000;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;padding:6px 6px 6px 12px;border-radius:999px;background:#181c27;border:1px solid rgba(79,142,247,.45);color:#eef0f8;font:600 13px/1.2 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.45)">
    <span style="width:8px;height:8px;border-radius:50%;background:#4f8ef7;box-shadow:0 0 0 4px rgba(79,142,247,.2);flex:none"></span>
    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${tr('A new version is available')}</span>
    <button type="button" onclick="location.reload()" style="flex:none;border:0;border-radius:999px;padding:6px 14px;background:#4f8ef7;color:#fff;font:inherit;cursor:pointer">${tr('Update')}</button>
    <button type="button" aria-label="${tr('Close')}" onclick="this.parentElement.remove()" style="flex:none;border:0;background:none;color:#7c84a0;font:inherit;font-size:15px;cursor:pointer;padding:4px 8px 4px 2px">✕</button></div>`);
}
startVersionWatch(()=>[location.pathname,'firestore-backend.js',...(window.hoursReviewMount?['hours-review.js']:[])]);
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
// Every modal closes on a tap anywhere outside it — on the dark backdrop,
// including where the card or row that opened it was (per user request
// 2026-10-04, for every modal; modals have no ✕ and no Cancel button). Only
// when the press also started on the backdrop, so a drag that starts inside
// the modal (selecting text, moving a map pin) and ends outside doesn't close
// it. The topmost open overlay is the one under the tap, so a modal over
// another closes alone. An overlay whose closing must undo something sets
// overlay.__onUserClose (e.g. the client billing-rate popup reverts the rate
// mode); otherwise closeModal(id). The same code is in schedule-manager.html
// and supplier-portal.html.
let _overlayDownOn=null;
document.addEventListener('pointerdown',e=>{ _overlayDownOn=e.target; },true);
document.addEventListener('click',e=>{
  const t=e.target;
  if(!(t&&t.classList&&t.classList.contains('overlay')&&t.classList.contains('open')&&_overlayDownOn===t&&t.id)) return;
  if(typeof t.__onUserClose==='function') t.__onUserClose(); else closeModal(t.id);
});

// Phone (≤ 700 px): a window, opened from the bottom as a sheet, also closes
// with a swipe down on it (user request 2026-10-11) — the same way as a tap
// outside (__onUserClose, else closeModal). Only when the sheet and anything
// scrolled under the finger are at their top, never from a field, a map,
// a canvas or a .no-swipe surface (the scan crop editor, the avatar crop —
// a drag there moves the photo, not the sheet); while it is open the page behind does not scroll (CSS). The
// same code is in the manager app and both portals.
(function(){
  let sw=null;
  document.addEventListener('touchstart',e=>{
    sw=null;
    if(!window.matchMedia('(max-width:700px)').matches||e.touches.length!==1) return;
    const m=e.target.closest&&e.target.closest('.overlay.open>.modal');
    if(!m||e.target.closest('input,textarea,select,canvas,.leaflet-container,.no-swipe')) return;
    for(let n=e.target;n&&n!==m.parentElement;n=n.parentElement){ if(n.scrollTop>0) return; }
    sw={m, x:e.touches[0].clientX, y:e.touches[0].clientY, dy:0, on:false};
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!sw) return;
    const dx=e.touches[0].clientX-sw.x, dy=e.touches[0].clientY-sw.y;
    if(!sw.on){
      if(dy<0||Math.abs(dx)>Math.abs(dy)){ if(dy<-6||Math.abs(dx)>10) sw=null; return; }
      if(dy<8) return;
      sw.on=true; sw.m.style.transition='none';
    }
    sw.dy=Math.max(0,dy); sw.m.style.transform='translateY('+sw.dy+'px)';
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  const end=()=>{
    if(!sw) return;
    const {m,dy,on}=sw; sw=null; if(!on) return;
    m.style.transition='transform .18s ease';
    const ov=m.parentElement;
    if(dy>90){
      m.style.transform='translateY(100%)';
      setTimeout(()=>{ m.style.transform=''; m.style.transition=''; if(typeof ov.__onUserClose==='function') ov.__onUserClose(); else closeModal(ov.id); },180);
    } else { m.style.transform=''; setTimeout(()=>{ m.style.transition=''; },200); }
  };
  document.addEventListener('touchend',end); document.addEventListener('touchcancel',end);
})();


// Same shift-pairing logic as schedule-manager.html's own
// groupPunchesIntoShifts()/analyzeDayPunches() — duplicated here rather than
// imported (no shared build in this codebase).
function groupPunchesIntoShifts(entries){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const buckets=[]; let cur=null;
  chrono.forEach(e=>{
    if(e.type==='in'){ if(cur) buckets.push(cur); cur={date:new Date(e.ts),entries:[e]}; }
    else { if(!cur) cur={date:new Date(e.ts),entries:[]}; cur.entries.push(e); buckets.push(cur); cur=null; }
  });
  if(cur) buckets.push(cur);
  return buckets;
}
function toMins(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function roundMins(m){ return m; }
function analyzeDayPunches(entries,date){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  let hours=0, openIn=null; const warnings=[];
  chrono.forEach(e=>{
    if(e.type==='in'){ openIn=e; }
    else if(e.type==='out'){
      if(!openIn) return;
      if(!openIn.time||!e.time){ openIn=null; return; }
      let dur=toMins(e.time)-toMins(openIn.time); if(dur<0) dur+=1440;
      hours+=dur/60; openIn=null;
    }
  });
  return {hours,warnings};
}


// ── Session (own key: never shares another page's login) ─────────────────────
const SESSION_KEY = 'clientPortal_session';
function getSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(!s || !s.uid || s.role !== 'client'){ localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
// Sign out: this portal's session and the site's Firebase sign-in end, and
// the one login page (the manager app's) opens.
async function logout(){
  localStorage.removeItem(SESSION_KEY);
  try{ await (await loadFirestoreBackend()).signOut(); }catch(e){}
  location.href = 'schedule-manager.html';
}
// The account menu: a tap on the name button opens it, a tap anywhere else
// (or Escape) closes it. The same in the manager app and the other portal.
function toggleAccountMenu(e){ if(e) e.stopPropagation(); document.getElementById('accountControl').classList.toggle('open'); }
function closeAccountMenu(){ const a = document.getElementById('accountControl'); if(a) a.classList.remove('open'); }
document.addEventListener('click', e => { const a = document.getElementById('accountControl'); if(a && a.classList.contains('open') && !a.contains(e.target)) closeAccountMenu(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeAccountMenu(); });
function renderAccountChip(name, sub){
  document.getElementById('accountAvatar').textContent = (String(name || '').trim()[0] || '?');
  document.getElementById('accountLabel').textContent = name || '';
  document.getElementById('accountMenuHead').innerHTML = '<b>' + esc(name || '') + '</b><span>' + esc(sub || '') + '</span>';
}

// ── Backend: the login function signs the device in (firestore-backend.js);
// every data call goes to the hours function (hours-review.js) with the
// Firebase ID token.
let __fsBackend = null;
function loadFirestoreBackend(){
  if(__fsBackend) return __fsBackend;
  __fsBackend = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = 'firestore-backend.js';
    el.onload = () => window.initFirestoreBackend().then(resolve, reject);
    el.onerror = () => reject(new Error('firestore-backend.js failed to load'));
    document.head.appendChild(el);
  }).catch(e => { __fsBackend = null; throw e; });
  return __fsBackend;
}
loadFirestoreBackend().catch(e => console.warn('Firestore backend:', e));
async function hoursCall(body){
  const idToken = await (await loadFirestoreBackend()).idToken();
  const res = await fetch(HOURS_FN_URL, {method:'POST',
    headers:{'Content-Type':'application/json', Authorization:'Bearer ' + idToken}, body: JSON.stringify(body)});
  return res.json();
}

// The hours screen (hours-review.js, shared with the supplier portal and the
// manager app's HR view), loaded once.
let __hrvLoading = null;
function loadHoursReview(){
  if(window.hoursReviewMount) return Promise.resolve();
  return __hrvLoading = __hrvLoading || new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = 'hours-review.js';
    el.onload = resolve;
    el.onerror = () => { __hrvLoading = null; reject(new Error('hours-review.js failed to load')); };
    document.head.appendChild(el);
  });
}

async function gateApp(){
  let s = getSession();
  // The Firebase sign-in is gone (site data cleared, signed out): log in again.
  if(s){ try{ if(!(await loadFirestoreBackend()).currentUser()){ localStorage.removeItem(SESSION_KEY); s = null; } }catch(e){} }
  document.documentElement.classList.remove('has-session');  // the early open ends here
  if(!s){ location.replace('schedule-manager.html'); return; }
  document.getElementById('appRoot').style.display = '';
  renderAccountChip(s.username, tr('Client'));
  try{ await loadHoursReview(); }catch(e){ showToast(tr('Could not load — check the connection and try again.')); return; }
  await hoursReviewMount(document.getElementById('hoursRoot'), {hideOwner: true, call: async body => {
    const r = await hoursCall(body);
    if(r && r.error && /session|sign in|token/i.test(r.error)) logout();
    if(body.action === 'load' && r && r.owner) document.getElementById('clientName').textContent = [r.owner.name, r.owner.object].filter(Boolean).join(' · ');
    return r;
  }});
}
loadI18n(storedLanguage()).catch(()=>{}).then(()=>{ applyI18n(); syncLangButtons(); gateApp(); });
</script>
