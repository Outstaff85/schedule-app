<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest-punch.json">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-title" content="Punch Clock">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Clock In / Out</title>
<link rel="stylesheet" href="icons/tabler-icons.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1117;
  --card:#181c27;
  --card2:#1e2333;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --text:#eef0f8;
  --text2:#7c84a0;
  --text3:#3a4060;
  --green:#6dd6a0;
  --green2:#4eb888;
  --green-glow:rgba(109,214,160,0.25);
  --red:#ff4f5e;
  --red2:#d93040;
  --red-glow:rgba(255,79,94,0.25);
  --amber:#f5a623;
  --amber-bg:rgba(245,166,35,0.12);
  --blue:#4f8ef7;
  --blue-bg:rgba(79,142,247,0.10);
  --blue-glow:rgba(79,142,247,0.2);
}

html,body{
  height:100%;width:100%;
  background:var(--bg);color:var(--text);
  font-family:'DM Sans','Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
}

/* ── Screens ────────────────────────────────────────────────────── */
.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(env(safe-area-inset-top,24px),24px) 20px max(env(safe-area-inset-bottom,24px),24px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transition:opacity 0.3s cubic-bezier(.4,0,.2,1), transform 0.3s cubic-bezier(.4,0,.2,1);
  background:var(--bg);
}
.screen.hidden{opacity:0;pointer-events:none;transform:translateY(16px) scale(0.98);}
.screen.center-v{justify-content:center;}

/* ══ SCREEN 1 — Worker Select ══════════════════════════════════════ */
#screenWorker{justify-content:center;gap:0;}
#screenWorker > *{width:100%;max-width:480px;}

/* Top bar */
.top-bar{
  width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.site-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(109,214,160,0.08);border:1px solid rgba(109,214,160,0.2);
  color:var(--green);border-radius:100px;padding:6px 14px;
  font-size:13px;font-weight:600;letter-spacing:0.2px;
}
.time-pill{font-family:'DM Mono',ui-monospace,monospace;
  font-size:22px;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;letter-spacing:-0.5px;
}

/* Section label */
.section-label{
  width:100%;max-width:480px;text-align:left;
  font-size:12px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:14px;
}

/* Worker grid */
.worker-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:12px;width:100%;max-width:500px;margin-bottom:20px;
}
@media(min-width:540px){.worker-grid{grid-template-columns:repeat(3,1fr);}}

.w-card{
  position:relative;
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:20px;padding:18px 12px 14px;
  text-align:center;cursor:pointer;
  transition:border-color 0.2s,background 0.2s,transform 0.15s;
  touch-action:manipulation;user-select:none;
}
.w-card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,255,255,0.04),transparent);
  pointer-events:none;
}
.w-card:active{transform:scale(0.94);}
.w-card.selected{
  border-color:var(--blue);
  background:linear-gradient(135deg,rgba(79,142,247,0.08),rgba(79,142,247,0.04));
  box-shadow:0 0 0 3px rgba(79,142,247,0.12);
}
.w-card.in-progress{
  border-color:var(--green);
  background:linear-gradient(135deg,rgba(109,214,160,0.08),rgba(109,214,160,0.03));
}

.w-avatar{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;margin:0 auto 10px;
  position:relative;
}
.w-avatar-ring{
  position:absolute;inset:-3px;border-radius:50%;
  border:2px solid transparent;transition:border-color 0.2s;
}
.w-card.in-progress .w-avatar-ring{border-color:var(--green);}
.w-card.selected .w-avatar-ring{border-color:var(--blue);}

.w-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;}
.w-status{font-size:11px;color:var(--text3);line-height:1.3;}
.w-card.in-progress .w-status{color:var(--green);}

/* Status dot */
.w-dot{
  position:absolute;top:10px;right:10px;
  width:8px;height:8px;border-radius:50%;
  background:var(--text3);
}
.w-card.in-progress .w-dot{
  background:var(--green);
  animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}

/* Continue button */
.continue-btn{
  width:100%;max-width:500px;
  background:var(--blue);
  color:#fff;border:none;border-radius:16px;
  padding:17px;font-size:17px;font-weight:700;
  cursor:pointer;touch-action:manipulation;
  transition:opacity 0.15s,transform 0.1s;
  letter-spacing:-0.2px;
}
.continue-btn:active{transform:scale(0.97);}
.continue-btn:disabled{
  background:var(--card2);color:var(--text3);
  cursor:not-allowed;box-shadow:none;
}

/* ══ SCREEN 2 — Punch ══════════════════════════════════════════════ */
#screenPunch{justify-content:center;text-align:center;}
#screenPunch > *{width:100%;max-width:400px;}

.punch-header{margin-bottom:8px;}
.punch-site{
  font-size:11px;font-weight:700;color:var(--blue);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;
  opacity:0.8;
}
.punch-greeting{
  font-size:15px;font-weight:500;color:var(--text2);margin-bottom:2px;
}
.punch-worker-name{
  font-size:clamp(24px,7vw,32px);font-weight:900;
  letter-spacing:-0.5px;color:var(--text);margin-bottom:0;
}

/* Clock */
.clock-block{margin:16px 0 6px;}
.punch-clock{
  font-family:'DM Mono',ui-monospace,monospace;
  font-size:clamp(48px,15vw,68px);font-weight:400;
  letter-spacing:-3px;font-variant-numeric:tabular-nums;
  color:var(--text);line-height:1;
}
.punch-date{font-size:13px;color:var(--text3);margin-top:6px;letter-spacing:0.3px;}

/* Location chip */
.loc-chip{
  display:inline-flex;align-items:center;gap:7px;
  border-radius:100px;padding:9px 18px;
  font-size:13px;font-weight:600;margin:16px 0 32px;
  transition:all 0.3s;max-width:90vw;
}
.loc-chip.ok{
  background:rgba(109,214,160,0.08);
  border:1px solid rgba(109,214,160,0.25);color:var(--green);
}
.loc-chip.warn{
  background:var(--amber-bg);
  border:1px solid rgba(245,166,35,0.3);color:var(--amber);
}
.loc-chip.loading{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);color:var(--text2);
}
.loc-dot{
  width:7px;height:7px;border-radius:50%;
  background:currentColor;flex-shrink:0;
}
.loc-chip.loading .loc-dot{animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* ── BIG ROUND PUNCH BUTTON ── */
.punch-btn-wrap{
  position:relative;display:flex;
  align-items:center;justify-content:center;
  margin-bottom:28px;width:100%;
}

/* Outer glow ring */
.btn-ring{
  position:absolute;
  width:clamp(180px,55vw,224px);
  height:clamp(180px,55vw,224px);
  border-radius:50%;
  animation:ring-pulse 2.5s ease-in-out infinite;
  transition:background 0.4s;
}
.btn-ring.in {background:radial-gradient(circle,var(--green-glow) 0%,transparent 70%);}
.btn-ring.out{background:radial-gradient(circle,var(--red-glow) 0%,transparent 70%);}
.btn-ring.off{background:transparent;}
@keyframes ring-pulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.08);opacity:1}}

.big-punch-btn{
  position:relative;z-index:1;
  width:clamp(148px,46vw,192px);
  height:clamp(148px,46vw,192px);
  border-radius:50%;border:none;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  cursor:pointer;touch-action:manipulation;
  transition:transform 0.15s cubic-bezier(.4,0,.2,1),box-shadow 0.3s;
  font-weight:800;
}
.big-punch-btn:active{transform:scale(0.90)!important;}

.big-punch-btn.in{
  background:linear-gradient(145deg,#32e882,var(--green2));
  box-shadow:0 4px 32px var(--green-glow), 0 0 0 2px rgba(109,214,160,0.3);
  color:#fff;
}
.big-punch-btn.out{
  background:linear-gradient(145deg,#ff6b78,var(--red2));
  box-shadow:0 4px 32px var(--red-glow), 0 0 0 2px rgba(255,79,94,0.3);
  color:#fff;
}
.big-punch-btn.disabled{
  background:var(--card2);
  box-shadow:none;color:var(--text3);cursor:not-allowed;
}
.big-punch-btn.disabled .btn-ring{display:none;}

.btn-icon{font-size:clamp(36px,11vw,48px);line-height:1;}
.btn-label{font-size:clamp(13px,4vw,16px);font-weight:800;letter-spacing:1.5px;}
.btn-sub{font-size:clamp(11px,3vw,13px);opacity:0.7;font-weight:500;}

.back-link{
  font-size:14px;color:var(--text3);cursor:pointer;
  padding:10px 20px;border-radius:100px;
  transition:color 0.15s,background 0.15s;
  touch-action:manipulation;
}
.back-link:active{color:var(--text);background:rgba(255,255,255,0.04);}

/* ══ SCREEN 3 — Success ════════════════════════════════════════════ */
#screenSuccess{justify-content:center;text-align:center;gap:0;}
#screenSuccess > *{width:100%;max-width:360px;}

.success-anim{
  width:90px;height:90px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;margin:0 auto 20px;
  animation:pop .45s cubic-bezier(.175,.885,.32,1.275);
}
.success-anim.in {background:rgba(109,214,160,0.12);border:2px solid rgba(109,214,160,0.3);}
.success-anim.out{background:rgba(255,79,94,0.12);  border:2px solid rgba(255,79,94,0.3);}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}

.success-label{font-size:clamp(26px,8vw,34px);font-weight:900;margin-bottom:6px;letter-spacing:-0.5px;}
.success-label.in {color:var(--green);}
.success-label.out{color:var(--red);}
.success-worker{font-size:clamp(15px,5vw,18px);color:var(--text2);margin-bottom:16px;}
.success-time{
  font-size:clamp(52px,16vw,72px);font-weight:200;
  letter-spacing:-3px;font-variant-numeric:tabular-nums;
  color:var(--text);line-height:1;margin-bottom:4px;
}
.success-date{font-size:13px;color:var(--text3);margin-bottom:36px;letter-spacing:0.3px;}

.success-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;}
.btn-primary{
  background:var(--blue);
  color:#fff;border:none;border-radius:14px;
  padding:15px;font-size:16px;font-weight:700;
  cursor:pointer;touch-action:manipulation;
  box-shadow:0 4px 20px rgba(79,142,247,0.2);
}
.btn-secondary{
  background:rgba(255,255,255,0.04);
  color:var(--text2);border:1px solid var(--border);
  border-radius:14px;padding:14px;font-size:15px;
  font-weight:600;cursor:pointer;touch-action:manipulation;
}
.btn-primary:active,.btn-secondary:active{opacity:0.8;transform:scale(0.97);}

/* ── Toast ── */
.toast{position:fixed;bottom:max(env(safe-area-inset-bottom,16px),16px);left:50%;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;gap:8px;max-width:min(340px,calc(100vw - 32px));box-sizing:border-box;background:var(--bg2,#181c27);border:1px solid var(--border2);border-left:3px solid var(--green);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;line-height:1.35;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{font-size:16px;color:var(--green);flex-shrink:0;}
.toast.warn{border-left-color:var(--amber);} .toast.warn i{color:var(--amber);}
.toast.err{border-left-color:var(--red);} .toast.err i{color:var(--red);}
.toast.info{border-left-color:var(--blue,#60a5fa);} .toast.info i{color:var(--blue,#60a5fa);}

/* ── Offline banner ── */
#offlineBadge{
  position:fixed;top:max(env(safe-area-inset-top,12px),12px);
  left:50%;transform:translateX(-50%);
  background:rgba(245,166,35,0.95);backdrop-filter:blur(8px);
  color:#fff;font-size:13px;font-weight:700;
  padding:7px 18px;border-radius:100px;z-index:999;
  display:none;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(245,166,35,0.3);
}

/* ── Small phone ── */
@media(max-width:380px){
  .w-card{border-radius:16px;padding:14px 10px 12px;}
  .w-avatar{width:44px;height:44px;font-size:14px;}
  .w-name{font-size:13px;}
  .worker-grid{gap:8px;}
  .punch-clock{font-size:clamp(42px,14vw,60px);}
}
.top-bar{padding-right:64px;}
.lang-select{position:fixed;right:max(env(safe-area-inset-right,0px),12px);top:max(env(safe-area-inset-top,0px),12px);z-index:50;background:rgba(255,255,255,0.06);color:var(--text2,#7c84a0);border:1px solid rgba(255,255,255,0.13);border-radius:8px;padding:4px 6px;font:600 12px/1 inherit;cursor:pointer;}
.punch-links{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
.sched-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.sched-head .m{font-size:17px;font-weight:700;color:var(--text);text-transform:capitalize;text-align:center;flex:1;}
.sched-nav{background:rgba(255,255,255,0.05);border:1px solid var(--border2);color:var(--text);border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:18px;}
.sched-today{background:var(--blue-bg);border:1px solid rgba(79,142,247,0.35);color:var(--blue);border-radius:10px;height:36px;padding:0 12px;cursor:pointer;font:600 13px inherit;}
.sched-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--text2);}
.sched-legend span{display:inline-flex;align-items:center;gap:5px;}
.sched-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
.sched-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.sched-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text2);padding:4px 0;text-transform:uppercase;}
.sched-cell{min-height:62px;border-radius:8px;padding:4px 3px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,0.02);}
.sched-cell.out{opacity:.35;}
.sched-cell.today{border-color:var(--blue);}
.sched-cell.sel{border-color:var(--text);background:rgba(255,255,255,0.06);}
.sched-cell .n{font-size:12px;font-weight:600;color:var(--text2);padding-left:2px;}
.sched-cell.today .n{color:var(--blue);}
.shift-bar{flex:1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',ui-monospace,monospace;font-size:10.5px;font-weight:500;line-height:1.25;text-align:center;}
.shift-bar.work{background:rgba(109,214,160,0.13);color:var(--green);}
.shift-bar.midnight{background:rgba(96,165,250,0.12);color:#60a5fa;}
.shift-bar.off{background:var(--amber-bg);color:var(--amber);font-family:inherit;font-size:10px;}
.shift-bar.dated{outline:1.5px dashed currentColor;outline-offset:-2px;}
.sched-notice{display:none;align-items:center;gap:8px;margin:0 auto 12px;max-width:340px;padding:7px 12px;border-radius:999px;background:var(--amber-bg);border:1px solid rgba(245,166,35,0.35);color:var(--amber);font-size:13px;font-weight:600;cursor:pointer;}
.sched-notice.show{display:flex;}
.sched-notice span{flex:1;text-align:left;}
.sched-notice .go{opacity:.8;font-size:12px;white-space:nowrap;}
.sched-badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-left:4px;vertical-align:middle;box-shadow:0 0 0 3px rgba(245,166,35,.25);}
.sched-detail{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;gap:14px;}
.sched-detail .dd{flex:1;}
.sched-detail .dd b{display:block;font-size:15px;color:var(--text);text-transform:capitalize;}
.sched-detail .dd span{font-size:13px;color:var(--text2);}
.sched-detail .tt{font-family:'DM Mono',ui-monospace,monospace;font-size:18px;font-weight:600;}
.sched-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.sched-sum div{padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);text-align:center;}
.sched-sum b{display:block;font-size:20px;color:var(--text);}
.sched-sum span{font-size:12px;color:var(--text2);}
.hours-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:14px;}
.hours-row .d{flex:1;color:var(--text);}
.hours-row .t{font-family:'DM Mono',ui-monospace,monospace;color:var(--text2);font-size:13px;}
.hours-row .h{min-width:52px;text-align:right;color:var(--green);font-weight:600;}
.hours-row .p{min-width:64px;text-align:right;color:var(--text);font-weight:600;}
.hours-break{margin-top:8px;font-size:12px;color:var(--text2);text-align:center;}
.sched-note{margin-top:10px;text-align:center;font-size:12px;color:var(--text3);}
/* Hebrew has no capitals: no letter-spacing (made for spaced-out uppercase Latin). */
html[lang="he"] *{letter-spacing:normal !important;}
</style>
</head>
<body>
<select class="lang-select" id="langSelect" title="Language" data-i18n-title="Language" aria-label="Language" onchange="setLanguage(this.value)"><option value="en">EN</option><option value="he">HE</option><option value="ru">RU</option></select>

<!-- Screen 1: Worker select -->
<div class="screen" id="screenWorker">
  <div class="top-bar">
    <div class="site-pill"><i class="ti ti-map-pin"></i> <span id="verifiedSiteName">Work Site</span></div>
    <div class="time-pill" id="workerClock">--:--</div>
  </div>
  <div class="section-label" data-i18n>Who are you?</div>
  <div class="worker-grid" id="workerGrid"></div>
  <button class="continue-btn" id="continueBtn" disabled onclick="goToPunch()">
    Select a worker to continue
  </button>
</div>

<!-- Screen 2: Punch -->
<div class="screen center-v hidden" id="screenPunch">
  <div class="punch-header">
    <div class="punch-site" id="punchSite"></div>
    <div class="punch-greeting" id="punchGreeting"></div>
    <div class="punch-worker-name" id="punchWorkerName"></div>
  </div>
  <!-- Stays until the worker opens My Schedule (per user request 2026-10-11:
       the schedule-change notice hangs, it does not flash by). -->
  <div class="sched-notice" id="schedNotice" onclick="openSchedule()" role="button"><i class="ti ti-calendar-event"></i><span data-i18n>Your schedule was updated</span><span class="go"><span data-i18n>View</span> ›</span></div>
  <div class="clock-block">
    <div class="punch-clock" id="punchClock">--:--:--</div>
    <div class="punch-date"  id="punchDate"></div>
  </div>
  <div class="loc-chip loading" id="locChip">
    <span class="loc-dot"></span>
    <span data-i18n>Checking location...</span>
  </div>
  <div class="punch-btn-wrap">
    <div class="btn-ring off" id="btnRing"></div>
    <button class="big-punch-btn disabled" id="bigPunchBtn" onclick="doPunch()">
      <span class="btn-icon">👆</span>
      <span class="btn-label" data-i18n>LOADING</span>
    </button>
  </div>
  <div class="punch-links">
    <div class="back-link" onclick="openSchedule()" style="color:var(--blue)"><i class="ti ti-calendar-week"></i> <span data-i18n>My Schedule</span><span class="sched-badge" id="schedBadge" style="display:none" title="Updated" data-i18n-title="Updated"></span></div>

<div id="toast" class="toast"></div>

<script>
const params = new URLSearchParams(window.location.search);
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let _site = null;
try{ _site=JSON.parse(localStorage.getItem('punchClockSite')||'null'); }catch(e){}

const URL_WORKER = params.get('worker') || null;
const URL_TOKEN  = params.get('t') || params.get('token') || null;

// A personal link (token in URL) is self-contained: trust ONLY the URL/base,
// never a stale punchClockSite left in localStorage from an admin session.
const _siteEff = URL_TOKEN ? null : _site;
// Legacy long links carry their own &lat=&lng=; short token links don't (geo comes from DB).
const _urlHasGeo = !!(params.get('lat') && params.get('lng'));

// `||` on lat/lng would collapse a legitimate 0 coordinate (equator / prime
// meridian — real for a site near e.g. Greenwich, Accra, or Lagos) to null,
// silently disabling the geofence/anti-spoofing check below for that site.
// `??` only falls through on null/undefined, so a real 0 stays 0.
const _rawLat=_siteEff?.lat ?? params.get('lat');
const _rawLng=_siteEff?.lng ?? params.get('lng');
const SITE = {
  name:     _siteEff?.clientName || params.get('site') || 'Work Site',
  object:   '',
  lat:      _rawLat!=null && _rawLat!=='' && !isNaN(parseFloat(_rawLat)) ? parseFloat(_rawLat) : null,
  lng:      _rawLng!=null && _rawLng!=='' && !isNaN(parseFloat(_rawLng)) ? parseFloat(_rawLng) : null,
  radius:   parseInt(_siteEff?.radius   || params.get('r'))   || 100,
  clientId: _siteEff?.clientId || null,
};

const QUEUE_KEY = 'punchQueue';

// The page talks only to the punch Cloud Function (functions-auth/portal.py),
// which hands out only this worker and their sites and accepts punches for
// this worker only. There is no login: the link token is the credential.
const PUNCH_FN_URL = 'https://europe-west3-schedule-odinson.cloudfunctions.net/punch';
function punchFn(body){
  return fetch(PUNCH_FN_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
}
// One punch to the server; the reply is {ok} or {error}.
function postPunch(e){
  return punchFn({action:'savePunch', token: e.workerToken || _wpToken(), data:e});
}

const WORKER_COLORS=[
  {bg:'rgba(109,214,160,0.2)', text:'#6dd6a0'},
  {bg:'rgba(79,142,247,0.2)', text:'#4f8ef7'},
  {bg:'rgba(255,167,60,0.2)', text:'#ffa73c'},
  {bg:'rgba(196,140,250,0.2)',text:'#c48cf5'},
  {bg:'rgba(255,210,60,0.2)', text:'#ffd23c'},
  {bg:'rgba(255,80,100,0.2)', text:'#ff5064'},
];

let workers=[], allClients=[], selectedWorker=null, locOk=false, locDist=null, clockTick=null, _lastPunchAt=0, _geoLocked=false;

// ── Offline queue ─────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Translations (the same core as schedule-manager.html: I18N_LANGS, tr,
// applyI18n, uiLocale, loadI18n — keep the copies the same; docs/translations.md).
// The language is this device's choice (the language select, English by
// default), kept in localStorage.uiLang — shared by the three pages.
const I18N_LANGS = {en:'English', he:'עברית', ru:'Русский'};
var I18N = {}, I18N_LANG = 'en';
function tr(s, params){
  let out = (I18N_LANG !== 'en' && I18N[s]) || s;
  if(params) out = out.replace(/\{(\w+)\}/g, (m, k) => params[k] != null ? params[k] : m);
  return out;
}
function applyI18n(root){
  const host = root || document;
  const keyOf = (el, attr) => { const k = '__i18n_' + attr; if(el[k] == null) el[k] = attr === 'text' ? (el.getAttribute('data-i18n') || el.textContent.trim()) : el.getAttribute('data-i18n-' + attr); return el[k]; };
  host.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(keyOf(el, 'text')); });
  host.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = tr(keyOf(el, 'placeholder')); });
  host.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tr(keyOf(el, 'title')); });
}
function uiLocale(){ return {he:'he-IL', ru:'ru-RU'}[I18N_LANG] || 'en-GB'; }
async function loadI18n(lang){
  const set = (l, d) => { I18N_LANG = l; I18N = d || {}; document.documentElement.lang = l; };
  if(!I18N_LANGS[lang] || lang === 'en'){ set('en', {}); return; }
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem('i18n_' + lang) || 'null'); }catch(e){}
  if(cached) set(lang, cached);
  const fresh = fetch('i18n/' + lang + '.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(d => {
    if(!d || typeof d !== 'object') return false;
    const changed = JSON.stringify(d) !== JSON.stringify(cached);
    try{ localStorage.setItem('i18n_' + lang, JSON.stringify(d)); }catch(e){}
    if(I18N_LANG === lang || !cached) set(lang, d);
    return changed;
  }).catch(() => false);
  if(cached){ fresh.then(ch => { if(ch && I18N_LANG === lang) redrawForLanguage(); }); return; }
  await fresh;
}
function storedLanguage(){ try{ const l = localStorage.getItem('uiLang'); return I18N_LANGS[l] ? l : 'en'; }catch(e){ return 'en'; } }
// The language select (one per page, #langSelect, top right like the other pages): keeps the choice on this device
// (the page has no login) and redraws in it.
async function setLanguage(lang){
  lang = I18N_LANGS[lang] ? lang : 'en';
  try{ localStorage.setItem('uiLang', lang); }catch(e){}
  try{ await loadI18n(lang); }catch(e){}
  redrawForLanguage();
}
function syncLangSelects(){ document.querySelectorAll('select.lang-select').forEach(el => { el.value = I18N_LANG; }); }
function redrawForLanguage(){
  applyI18n();
  syncLangSelects();
  try{
    const on = id => { const s = document.getElementById(id); return s && !s.classList.contains('hidden'); };
    if(on('screenPunch')){ tickPunch(); updateBigBtn(); getLocation(); }
    else if(on('screenWorker')) renderWorkerGrid();
    else if(on('screenHistory')) openHistory();
    else if(on('screenSchedule')) renderMySchedule();
  }catch(e){}
}
function getQueue(){ try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');}catch(e){return[];} }
function saveQueue(q){ localStorage.setItem(QUEUE_KEY,JSON.stringify(q)); }

// Multi-tenant: the backend has no login for workers, so it resolves which
// firm a punch belongs to from the worker's OWN per-worker link token —
// URL_TOKEN on a personal link, or the picked worker's own token in the
// (legacy, no-token) picker-grid flow. Queued/offline entries carry their
// own token so a flush after switching links still posts to the right firm.
function _wpToken(){
  return (typeof selectedWorker!=='undefined' && selectedWorker && selectedWorker.token) || URL_TOKEN || null;
}

async function gsSavePunch(entry){
  if(!navigator.onLine){ queueEntry(entry); return; }
  try{
    const res=await postPunch(entry);
    const json=await res.json();
    // A refusal (unknown link, bad punch) comes back as json.error, so the
    // reply is checked, not just the HTTP status; a refused punch is queued
    // for a retry instead of being lost.
    if(!json || json.error){ queueEntry(entry); }
  }catch(e){ queueEntry(entry); }
}

function queueEntry(entry){
  entry.workerToken = entry.workerToken || _wpToken();
  const q=getQueue(); q.push(entry); saveQueue(q);
  showOfflineBadge(q.length);
}

let _flushingQueue=false;
async function flushQueue(){
  if(_flushingQueue) return; // 'online' and 'load' can both fire in quick succession on a
  const q=getQueue();        // flaky connection — without this guard, two overlapping runs
  if(!q.length||!navigator.onLine) return; // would both read the same queue and double-post every entry.
  _flushingQueue=true;
  const failed=[];
  try{
    for(const e of q){
      try{
        const r=await postPunch(e);
        const json=await r.json();
        if(!json || json.error) failed.push(e);
      }
      catch(err){ failed.push(e); }
    }
    saveQueue(failed);
  } finally { _flushingQueue=false; }
  if(!failed.length){ hideOfflineBadge(); if(q.length) showSyncToast(q.length); }
}

function showOfflineBadge(n){
  let b=document.getElementById('offlineBadge');
  if(!b){ b=document.createElement('div'); b.id='offlineBadge'; document.body.appendChild(b); }
  b.style.cssText='position:fixed;top:max(env(safe-area-inset-top,12px),12px);left:50%;transform:translateX(-50%);background:rgba(245,166,35,0.95);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:700;padding:7px 18px;border-radius:100px;z-index:999;display:flex;align-items:center;gap:6px;';
  b.textContent=n>1?tr('📶 Offline — {0} punches queued',{0:n}):tr('📶 Offline — 1 punch queued');
}
function hideOfflineBadge(){ const b=document.getElementById('offlineBadge'); if(b) b.style.display='none'; }
function showSyncToast(n){ showToast(n>1?tr('Synced {0} offline punches',{0:n}):tr('Synced 1 offline punch')); }

window.addEventListener('online', ()=>flushQueue());
window.addEventListener('load',   ()=>{ const q=getQueue(); if(q.length){showOfflineBadge(q.length);flushQueue();} });

// ── Init ──────────────────────────────────────────────────────────
function init(){
  loadWorkers();

  if(URL_TOKEN){
    const cached = workers.find(w=> w.token===URL_TOKEN);
    if(cached){
      // Fast path: show instantly from cache (also works offline).
      goToPunchDirect(cached);
      // If online, verify against the DB in the background: refreshes the
      // geofence and instantly revokes a regenerated/removed token.
      if(navigator.onLine) verifyAndRefresh();
    } else if(navigator.onLine){
      // Not in cache → must verify against the DB before letting them in.
      showLoadingScreen(tr('Verifying...'));
      loadWorkersFromGS().then(ok=>{
        hideLoadingScreen();
        if(!ok){ showInvalidLink(tr('Connection problem'),tr('Couldn\'t reach the server. Check your connection and reload.'),'ti-wifi-off'); return; }
        const verified = workers.find(w=> w.token===URL_TOKEN);
        if(verified){ goToPunchDirect(verified); } else { showInvalidLink(); }
      }).catch(()=>{ hideLoadingScreen(); showInvalidLink(tr('Connection problem'),tr('Couldn\'t reach the server. Check your connection and reload.'),'ti-wifi-off'); });
    } else {
      // Offline and never opened before → nothing to verify against.
      showInvalidLink(tr('No connection'),tr('Open this link once while online to set it up. After that it works offline.'),'ti-wifi-off');
    }
    return;
  }

  // No personal link - show worker list
  if(workers.length){
    showScreen('screenWorker');
    startWorkerClock();
    if(navigator.onLine) loadWorkersFromGS().catch(()=>{}); // refresh cache in background
  } else {
    showLoadingScreen(tr('Loading...'));
    loadWorkersFromGS().then(()=>{
      hideLoadingScreen();
      showScreen('screenWorker');
      startWorkerClock();
    });
  }
}

// Background check for a token link: confirm the token still exists in the DB
// (instant revocation of regenerated/removed tokens) and refresh the geofence.
function verifyAndRefresh(){
  loadWorkersFromGS().then(ok=>{
    if(!ok) return;                                  // server unreachable → keep cached view
    const fresh = workers.find(w=> w.token===URL_TOKEN);
    if(!fresh){ showInvalidLink(); return; }         // token regenerated/removed → revoke now
    selectedWorker = fresh;
    checkScheduleChange();
    if(!_urlHasGeo && !_geoLocked){                 // short token link, single object → re-resolve from DB
      SITE.lat=null; SITE.lng=null;
      resolveSiteFromWorker(fresh);
      const ps=document.getElementById('punchSite'); if(ps) ps.innerHTML='<i class="ti ti-map-pin"></i> '+siteLabel();
      getLocation();
    }
  }).catch(()=>{});
}

function showInvalidLink(title, msg, icon){
  title = title || tr('Invalid Link');
  msg   = msg ? esc(msg) : esc(tr('This link is no longer valid.'))+'<br>'+esc(tr('Ask your manager for a new link.'));
  icon  = icon  || 'ti-link-off';
  document.body.innerHTML = '<div style="position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center">'
    + '<div style="color:#ff4f5e;margin-bottom:18px"><i class="ti '+icon+'" style="font-size:64px"></i></div>'
    + '<div style="font-size:24px;font-weight:900;color:#ff4f5e;margin-bottom:10px">'+esc(title)+'</div>'
    + '<div style="font-size:15px;color:#7c84a0;line-height:1.6;max-width:280px">'+msg+'</div>'
    + '</div>';
}

// For a token-only link, fill the geofence from the worker's linked client
// (only when the URL didn't already carry lat/lng — legacy long links keep their own).
function resolveSiteFromWorker(w){
  if(SITE.lat!=null && SITE.lng!=null) return;            // URL already provided geo
  if(!w || !(w.clientIds||[]).length || !allClients.length) return;
  const cs = w.clientIds.map(id=>allClients.find(x=>x.id===id)).filter(Boolean);
  const geo = cs.find(c=> c.lat!=null && c.lng!=null && c.lat!=='' && c.lng!=='');
  if(geo){
    SITE.name     = geo.name || SITE.name;
    SITE.object   = geo.object || '';
    SITE.lat      = Number(geo.lat);
    SITE.lng      = Number(geo.lng);
    SITE.radius   = Number(geo.radius)||100;
    SITE.clientId = geo.id;
  } else if(cs[0]){
    SITE.name     = cs[0].name;                            // client without coords: show name, no geofence
    SITE.object   = cs[0].object || '';
    SITE.clientId = cs[0].id;
  }
}
// Label for the site pill: client name, plus its object/branch if set.
function siteLabel(){ const n=esc(!SITE.name||SITE.name==='Work Site'?tr('Work Site'):SITE.name); return SITE.object?(n+' · '+esc(SITE.object)):n; }

function goToPunchDirect(w){
  selectedWorker = w;
  if(!workers.find(x=>x.id===w.id)) workers = [w, ...workers];
  // #5: a worker tied to several objects chooses which one they're at.
  const ids = [...new Set(w.clientIds||[])];
  // If the worker has several objects but the client list isn't loaded yet
  // (fast cache path on the worker's phone), fetch it first so the picker
  // can be built — otherwise the object window would be silently skipped.
  if(ids.length>1 && SITE.lat==null && !allClients.length && navigator.onLine){
    loadWorkersFromGS().then(()=>decideObjectOrPunch(w)).catch(()=>enterPunch(w,false));
    return;
  }
  decideObjectOrPunch(w);
}

function decideObjectOrPunch(w){
  const objs = [...new Set(w.clientIds||[])].map(id=>allClients.find(x=>x.id===id)).filter(Boolean);
  if(objs.length>1 && SITE.lat==null){
    _geoLocked = true;
    showObjectPicker(w, objs);
    return;
  }
  enterPunch(w, false);
}

function enterPunch(w, skipResolve){
  if(!skipResolve) resolveSiteFromWorker(w);
  document.getElementById('punchSite').innerHTML = '<i class="ti ti-map-pin"></i> '+siteLabel();
  document.getElementById('punchWorkerName').textContent = w.name;
  const cw=document.getElementById('changeWorkerLink'); if(cw) cw.style.display=URL_TOKEN?'none':'';
  // Pay only on the worker's own link, never on a shared picker device.
  const mh=document.getElementById('myHoursLink'); if(mh) mh.style.display=URL_TOKEN?'':'none';
  showScreen('screenPunch');
  startPunchClock();
  getLocation();
  updateBigBtn();
  checkScheduleChange();
}

function showObjectPicker(w, objs){
  const d=document.createElement('div'); d.id='objectPicker';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:998;font-family:"DM Sans",-apple-system,sans-serif';
  let h='<div style="background:#181c27;border:1px solid rgba(255,255,255,0.13);border-radius:14px;padding:24px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto">';
  h+='<div style="display:flex;align-items:center;gap:8px;font-size:19px;font-weight:600;color:#eef0f8;letter-spacing:-0.3px"><i class="ti ti-building-store"></i> '+tr('Choose a site')+'</div>';
  h+='<div style="color:#7c84a0;font-size:13px;margin-top:4px;margin-bottom:18px">'+esc(w.name)+'</div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px">';
  objs.forEach(c=>{
    const hasGeo = c.lat!=null&&c.lng!=null&&c.lat!==''&&c.lng!=='';
    h+='<button onclick="pickObject(\''+c.id+'\')" style="background:#1e2333;border:1px solid rgba(255,255,255,0.13);border-radius:12px;padding:14px 16px;color:#eef0f8;font-size:15px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .15s" onmouseover="this.style.borderColor=\'rgba(109,214,160,0.5)\'" onmouseout="this.style.borderColor=\'rgba(255,255,255,0.13)\'">'
      +'<div><i class="ti ti-building"></i> '+esc(c.name||'—')+'</div>'
      +(c.object?'<div style="font-size:12px;color:#7c84a0;font-weight:400;margin-top:3px">'+esc(c.object)+'</div>':'')
      +'<div style="font-size:11px;color:'+(hasGeo?'#6dd6a0':'#f5a623')+';font-weight:400;margin-top:5px"><i class="ti ti-map-pin'+(hasGeo?'':'-off')+'"></i> '+(hasGeo?tr('geofence · {0} m',{0:Number(c.radius)||100}):tr('no geofence'))+'</div>'
      +'</button>';
  });
  h+='</div></div>';
  d.innerHTML=h;
  document.body.appendChild(d);
}

function pickObject(clientId){
  const pk=document.getElementById('objectPicker'); if(pk) pk.remove();
  const c=allClients.find(x=>x.id===clientId);
  if(c){
    SITE.name = c.name || SITE.name;
    SITE.object = c.object || '';
    SITE.clientId = c.id;
    if(c.lat!=null&&c.lng!=null&&c.lat!==''&&c.lng!==''){
      SITE.lat=Number(c.lat); SITE.lng=Number(c.lng); SITE.radius=Number(c.radius)||100;
    } else { SITE.lat=null; SITE.lng=null; }
  }
  _geoLocked = true;
  enterPunch(selectedWorker, true);
}

function showLoadingScreen(msg){
  const d = document.createElement('div');
  d.id = 'loadingScreen';
  d.style.cssText = 'position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#7c84a0;font-family:"DM Sans",-apple-system,sans-serif;z-index:999';
  d.innerHTML = '<div style="font-size:48px;margin-bottom:16px">📡</div><div style="font-size:16px">'+msg+'</div>';
  document.body.appendChild(d);
}

function hideLoadingScreen(){
  document.getElementById('loadingScreen')?.remove();
}
function loadWorkers(){
  // Priority 1: data passed from schedule manager (same device)
  if(_site?.workers?.length){ workers=_site.workers; return; }
  // Priority 2: localStorage cache (same device)
  try{
    const raw=localStorage.getItem('schedMgr_v1')||localStorage.getItem('scheduleManagerData');
    if(raw){
      const d=JSON.parse(raw); let list=d.workers||[];
      allClients = d.clients||[];
      // Filter by client if clientId provided, but fall back to ALL workers if filtered list is empty
      if(SITE.clientId){
        const filtered=list.filter(w=>(w.clientIds||[]).includes(SITE.clientId));
        list = filtered.length ? filtered : list;
      }
      workers=list.map((w,i)=>({id:w.id,name:w.name,colorIdx:w.colorIdx||i,token:w.token||null,clientIds:w.clientIds||[],schedule:Array.isArray(w.schedule)?w.schedule:[],dates:(w.dates&&typeof w.dates==='object')?w.dates:{}}));
      if(workers.length) return;
    }
  }catch(e){}
  // Priority 3: load from the server (init() calls loadWorkersFromGS())
  workers=[];
}

async function loadWorkersFromGS(){
  // Resolvable only on a personal link (URL_TOKEN): the old no-token
  // picker-grid flow has no way to name a firm, so it only works from the
  // same-device cache (see docs/multi-tenant-plan.md).
  if(!URL_TOKEN) return false;
  try{
    const res = await punchFn({action:'load', token: URL_TOKEN});
    const data = JSON.parse(await res.text());
    // The server answered but does not know this link (regenerated or the
    // worker removed): no workers, so init()/verifyAndRefresh() revoke it.
    if(data.error==='Unknown worker link'){ workers=[]; return true; }
    if(data.workers&&data.workers.length){
      let list = data.workers;
      allClients = data.clients||[];
      // Filter by client but fall back to all if empty
      if(SITE.clientId){
        const filtered=list.filter(w=>(w.clientIds||[]).includes(SITE.clientId));
        list = filtered.length ? filtered : list;
      }
      workers=list.map((w,i)=>({id:w.id,name:w.name,colorIdx:w.colorIdx||i,token:w.token||null,clientIds:w.clientIds||[],schedule:Array.isArray(w.schedule)?w.schedule:[],dates:(w.dates&&typeof w.dates==='object')?w.dates:{}}));
      localStorage.setItem('schedMgr_v1', JSON.stringify(data));
      return true;
    }
  }catch(e){ console.warn('Worker load failed:', e.message); }
  return false;
}

// ── GPS anti-spoof ────────────────────────────────────────────────
const GPS_MAX_ACCURACY=150, GPS_REQUEST_MS=800, GPS_MAX_SPEED=55;
let _lastGpsPos=null, _gpsWarnings=[];

function analyseGps(pos){
  const warnings=[], {latitude:lat,longitude:lng,accuracy:acc,speed:spd,altitude:alt}=pos.coords, ts=pos.timestamp;
  if(acc===0) warnings.push('accuracy=0 (fake GPS suspected)');
  else if(acc>GPS_MAX_ACCURACY) warnings.push('accuracy too low ('+Math.round(acc)+'m)');
  if(_lastGpsPos){ const dt=(ts-_lastGpsPos.ts)/1000; if(dt>0&&dt<300){ const sp=haversine(lat,lng,_lastGpsPos.lat,_lastGpsPos.lng)/dt; if(sp>GPS_MAX_SPEED) warnings.push('impossible speed ('+(sp*3.6).toFixed(0)+'km/h)'); } }
  if(spd!=null&&spd>GPS_MAX_SPEED) warnings.push('device speed '+(spd*3.6).toFixed(0)+'km/h');
  if(alt===0&&acc<10) warnings.push('altitude=0 with high accuracy');
  _lastGpsPos={lat,lng,ts}; _gpsWarnings=warnings;
  return {lat,lng,acc,suspicious:warnings.length>0,warnings};
}

function getLocation(){
  const chip=document.getElementById('locChip');
  chip.className='loc-chip loading';
  chip.innerHTML='<span class="loc-dot"></span><span>'+tr('Checking GPS...')+'</span>';
  locOk=false;
  if(!navigator.geolocation){ chip.className='loc-chip warn'; chip.innerHTML='<span class="loc-dot"></span><span>'+tr('GPS not available')+'</span>'; updateBigBtn(); return; }
  if(SITE.lat==null||SITE.lng==null){ chip.className='loc-chip ok'; chip.innerHTML='<span class="loc-dot"></span><span>'+tr('Location check skipped')+'</span>'; locOk=true; updateBigBtn(); return; }
  const t0=Date.now();
  navigator.geolocation.getCurrentPosition(pos=>{
    const elapsed=Date.now()-t0, a=analyseGps(pos);
    const dist=Math.round(haversine(a.lat,a.lng,SITE.lat,SITE.lng)); locDist=dist;
    const tooFast=elapsed<GPS_REQUEST_MS;
    const distOk=dist<=SITE.radius, accOk=a.acc>0&&a.acc<=GPS_MAX_ACCURACY;
    window._lastGpsAnalysis={lat:a.lat,lng:a.lng,accuracy:a.acc,dist,suspicious:a.suspicious||tooFast,warnings:tooFast?['Response in '+elapsed+'ms (too fast)'].concat(a.warnings):a.warnings,elapsed};
    if(!distOk){ locOk=false; chip.className='loc-chip warn'; chip.innerHTML='<span class="loc-dot"></span><span>'+tr('{0}m from site (max {1}m)',{0:dist,1:SITE.radius})+'</span>'; }
    else if(!accOk){ locOk=false; chip.className='loc-chip warn'; chip.innerHTML='<span class="loc-dot"></span><span>'+tr('Weak GPS (±{0}m) — go outside',{0:Math.round(a.acc)})+'</span>'; }
    else if(a.suspicious||tooFast){ locOk=false; chip.className='loc-chip warn'; chip.innerHTML='<span class="loc-dot"></span><span>'+esc(tr('Suspicious GPS: {0}',{0:tooFast?tr('instant response'):a.warnings[0]}))+'</span>'; }
    else{ locOk=true; chip.className='loc-chip ok'; chip.innerHTML='<span class="loc-dot"></span><span>'+tr('On site · {0}m · ±{1}m',{0:dist,1:Math.round(a.acc)})+'</span>'; }
    updateBigBtn();
  }, err=>{
    chip.className='loc-chip warn';
    chip.innerHTML='<span class="loc-dot"></span><span>'+(err.code===1?tr('GPS denied — enable in settings'):tr('GPS error — go outside'))+'</span>';
    locOk=false; updateBigBtn();
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function shiftMonth(n){ _schedMonth = n === 0 ? 0 : _schedMonth + n; _schedSel = null; renderMySchedule(); }
function pickSchedDay(t){ _schedSel = t; renderMySchedule(); }
function schedDay(d){
  const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const dated = selectedWorker && selectedWorker.dates && selectedWorker.dates[k];
  const day = dated || ((selectedWorker && selectedWorker.schedule) || [])[d.getDay()] || {};
  if(!(day.type === 'work' && day.start && day.end)) return {work:false, dated:!!dated};
  const toM = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
  let m = toM(day.end) - toM(day.start); const night = m <= 0; if(night) m += 1440;
  return {work:true, start:day.start, end:day.end, night, hours:m / 60, dated:!!dated};
}
function renderMySchedule(){

  const month = first.getMonth();

  const hasAny = ((selectedWorker && selectedWorker.schedule) || []).some(x => x && x.type === 'work' && x.start && x.end)
    || Object.values((selectedWorker && selectedWorker.dates) || {}).some(x => x && x.type === 'work');

  for(let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if(i >= 35 && d.getMonth() !== month) break;
    const x = schedDay(d), inMonth = d.getMonth() === month;
    if(inMonth && x.work){ days++; hours += x.hours; }
    const cls = ['sched-cell', inMonth ? '' : 'out', d.getTime() === today.getTime() ? 'today' : '', d.getTime() === sel.getTime() ? 'sel' : ''].join(' ');
    cells += `<div class="${cls}" onclick="pickSchedDay(${d.getTime()})"><span class="n">${d.getDate()}</span>`
      + (x.work ? `<div class="shift-bar ${x.night ? 'midnight' : 'work'}${x.dated ? ' dated' : ''}">${esc(x.start)}<br>${esc(x.end)}</div>` : `<div class="shift-bar off${x.dated ? ' dated' : ''}">${esc(tr('Off'))}</div>`)
      + `</div>`;

      <span>${esc(sx.work ? (sx.night ? tr('Night shift — ends the next day') : tr('Work day')) : tr('Day off'))}${sx.dated ? ' · ' + esc(tr('changed for this date')) : ''}</span></div>
      ${sx.work ? `<div class="tt" style="color:${sx.night ? '#60a5fa' : 'var(--green)'}">${esc(sx.start)} – ${esc(sx.end)}<div style="font-size:12px;color:var(--text2);text-align:right">${esc(tr('{h}h', {h: sx.hours.toFixed(1)}))}</div></div>` : ''}
    </div>`;
  el.innerHTML = `<div class="sched-head"><button type="button" class="sched-nav" onclick="shiftMonth(-1)" aria-label="${esc(tr('Previous month'))}">‹</button>
      <div class="m">${esc(first.toLocaleDateString(loc, {month:'long', year:'numeric'}))}</div>
      ${_schedMonth !== 0 ? `<button type="button" class="sched-today" onclick="shiftMonth(0)">${esc(tr('Today'))}</button>` : ''}
      <button type="button" class="sched-nav" onclick="shiftMonth(1)" aria-label="${esc(tr('Next month'))}">›</button></div>
    <div class="sched-legend"><span><i style="background:rgba(109,214,160,0.35)"></i>${esc(tr('Work'))}</span><span><i style="background:rgba(96,165,250,0.35)"></i>${esc(tr('Night shift'))}</span><span><i style="background:rgba(245,166,35,0.35)"></i>${esc(tr('Day off'))}</span><span><i style="outline:1.5px dashed var(--text2);outline-offset:-2px"></i>${esc(tr('This date only'))}</span></div>`
    + (hasAny ? `<div class="sched-grid">${dows}${cells}</div>${detail}
      <div class="sched-sum"><div><b>${days}</b><span>${esc(tr('Work days this month'))}</span></div><div><b>${esc(tr('{h}h', {h: hours.toFixed(1)}))}</b><span>${esc(tr('Planned hours this month'))}</span></div></div>
      <div class="sched-note">${esc(tr('Your manager plans this schedule; changes show here at once.'))}</div>`

// ── My hours & pay (worker's own link only): one month of the worker's own
// punches from the punch function (myMonth — portal.py hands out only this
// worker's punches, their own pay inputs and their sites' worker-pay rates),
// summed with the canonical functions below exactly as Accounting → Salary
// does for a month (salaryEntriesFor): punches of the month, paired into
// shifts, each shift priced by shiftPayFor, daily days set by hand, travel.
// It is an estimate before deductions; the payslip is the final figure.
let _hoursMonth = 0;
const _hoursData = {};
function hoursMonthKey(){ const n = new Date(); return localYMD(new Date(n.getFullYear(), n.getMonth() + _hoursMonth, 1)).slice(0, 7); }
function openMyHours(){
  if(!selectedWorker || !URL_TOKEN) return;
  _hoursMonth = 0;
  showScreen('screenHours');
  loadMyHours();
}
function shiftHoursMonth(n){ _hoursMonth = n === 0 ? 0 : Math.min(0, _hoursMonth + n); loadMyHours(); }
async function loadMyHours(){
  const key = hoursMonthKey();
  renderMyHours(key);
  try{
    const r = await (await punchFn({action:'myMonth', token:_wpToken(), month:key})).json();
    _hoursData[key] = (r && !r.error) ? r : (_hoursData[key] || {failed:true});
  }catch(e){ _hoursData[key] = _hoursData[key] && !_hoursData[key].failed ? _hoursData[key] : {failed:true}; }
  if(key === hoursMonthKey() && !document.getElementById('screenHours').classList.contains('hidden')) renderMyHours(key);
}
function myMonthFigures(data, key){
  clients = data.clients || [];
  const w = data.pay || {};
  const [y, m] = key.split('-').map(Number), from = new Date(y, m - 1, 1), to = new Date(y, m, 1);
  const list = (data.punches || []).filter(e => { const d = new Date(e.ts); return d >= from && d < to; });
  const seen = new Set(), dayKeys = new Set(), shifts = [];
  let hours = 0, regH = 0, otH = 0, shabH = 0, total = 0;
  groupPunchesIntoShifts(list).forEach(b => {
    const h = analyzeDayPunches(b.entries, b.date).hours;
    const inE = b.entries.find(e => e.type === 'in'), outE = b.entries.find(e => e.type === 'out');
    let pay = 0;
    if(h > 0){
      const isSat = b.date.getDay() === 6, RM = PAY_RULES.regularMax;
      if(isSat) shabH += h; else { regH += Math.min(h, RM); otH += Math.max(h - RM, 0); }
      hours += h;
      pay = shiftPayFor(h, w, isSat, b.entries[0] && b.entries[0].clientId, b.date, seen);
      total += pay;
      dayKeys.add(localYMD(b.date));
    }
    shifts.push({date:b.date, inT:inE && inE.time, outT:outE && outE.time, h, pay});
  });
  const ov = isDailyPay(w) ? dayOverride(w, 'm:' + key) : null;
  if(ov != null) total = ov * dailyRate(w);
  const days = ov != null ? ov : dayKeys.size;
  const travel = travelPay(w, days, dayKeys.size ? 1 : 0);
  const hasRate = isDailyPay(w) ? dailyRate(w) > 0 : true;
  return {shifts, hours, regH, otH, shabH, total, travel, days, ov, hasRate};
}
function money(n){ return '₪' + (Number(n) || 0).toLocaleString(uiLocale(), {minimumFractionDigits:0, maximumFractionDigits:2}); }
function renderMyHours(key){
  const el = document.getElementById('hoursContent'), loc = uiLocale();
  const [y, m] = key.split('-').map(Number);
  const head = `<div class="sched-head"><button type="button" class="sched-nav" onclick="shiftHoursMonth(-1)" aria-label="${esc(tr('Previous month'))}">‹</button>
      <div class="m">${esc(new Date(y, m - 1, 1).toLocaleDateString(loc, {month:'long', year:'numeric'}))}</div>
      ${_hoursMonth !== 0 ? `<button type="button" class="sched-today" onclick="shiftHoursMonth(0)">${esc(tr('Today'))}</button>` : ''}
      <button type="button" class="sched-nav" onclick="shiftHoursMonth(1)" aria-label="${esc(tr('Next month'))}" ${_hoursMonth === 0 ? 'disabled style="opacity:.3"' : ''}>›</button></div>`;
  const data = _hoursData[key];
  const msg = t => `<div style="text-align:center;padding:40px;color:var(--text3);font-size:15px">${esc(t)}</div>`;
  if(!data){ el.innerHTML = head + msg(tr('Loading…')); return; }
  if(data.failed){ el.innerHTML = head + msg(tr('Could not load your hours — check the connection and try again.')); return; }
  const f = myMonthFigures(data, key);
  if(!f.shifts.length){ el.innerHTML = head + msg(tr('No shifts this month')); return; }
  const rows = [...f.shifts].reverse().map(s => `<div class="hours-row">
      <span class="d">${esc(s.date.toLocaleDateString(loc, {weekday:'short', day:'2-digit', month:'short'}))}</span>
      <span class="t">${esc(s.inT || '--:--')} – ${esc(s.outT || '--:--')}</span>
      <span class="h">${s.h > 0 ? esc(tr('{h}h', {h:s.h.toFixed(1)})) : '—'}</span>
      ${f.ov == null && f.hasRate ? `<span class="p">${s.pay > 0 ? esc(money(s.pay)) : '—'}</span>` : ''}
    </div>`).join('');
  const parts = [tr('Regular {h}h', {h:f.regH.toFixed(1)})];
  if(f.otH > 0) parts.push(tr('Overtime {h}h', {h:f.otH.toFixed(1)}));
  if(f.shabH > 0) parts.push(tr('Shabbat {h}h', {h:f.shabH.toFixed(1)}));
  el.innerHTML = head
    + `<div class="sched-sum"><div><b>${esc(tr('{h}h', {h:f.hours.toFixed(1)}))}</b><span>${esc(tr('Hours worked'))}</span></div><div><b>${f.days}</b><span>${esc(tr('Days worked'))}</span></div>`
    + (f.hasRate ? `<div><b>${esc(money(f.total))}</b><span>${esc(tr('Pay'))}</span></div><div><b>${esc(money(f.total + f.travel))}</b><span>${esc(f.travel > 0 ? tr('Total with travel ({t})', {t:money(f.travel)}) : tr('Total'))}</span></div>` : '')
    + `</div><div class="hours-break">${esc(parts.join(' · '))}</div>
    <div style="margin-top:10px">${rows}</div>
    <div class="sched-note">${esc(f.hasRate ? tr('An estimate before deductions — your payslip is the final figure.') : tr('Your pay rate is not set yet — ask your manager.'))}</div>`;
}

// ── Shift pairing and pay (duplicated on purpose from schedule-manager.html:
// groupPunchesIntoShifts, analyzeDayPunches, PAY_RULES, israeliDayPay,
// effectiveRates … travelPay, localYMD — keep the copies the same).
// `clients` here are the worker's sites with their worker-pay rates only.
let clients = [];
function groupPunchesIntoShifts(entries){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const buckets=[]; let cur=null;
  chrono.forEach(e=>{
    if(e.type==='in'){ if(cur) buckets.push(cur); cur={date:new Date(e.ts),entries:[e]}; }
    else { if(!cur) cur={date:new Date(e.ts),entries:[]}; cur.entries.push(e); buckets.push(cur); cur=null; }
  });
  if(cur) buckets.push(cur);
  return buckets;
}
function toMins(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function roundMins(m){ return m; }
function analyzeDayPunches(entries,date){
  const chrono=[...entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  let hours=0, openIn=null; const warnings=[];
  chrono.forEach(e=>{
    if(e.type==='in'){ openIn=e; }
    else if(e.type==='out'){
      if(!openIn) return;
      if(!openIn.time||!e.time){ openIn=null; return; }
      let dur=toMins(e.time)-toMins(openIn.time); if(dur<0) dur+=1440;
      hours+=dur/60; openIn=null;
    }
  });
  return {hours,warnings};
}
const PAY_RULES = { regularMax: 8, ot1Span: 2, roundMinutes: 0, otMult: 1.25, shabbatMult: 1.5 };
function israeliDayPay(hours, rate, isSat){
  const base=isSat?1.5:1.0, ot1=isSat?1.75:1.25, ot2=isSat?2.0:1.5;
  const RM=PAY_RULES.regularMax, O1=PAY_RULES.ot1Span;
  const reg=Math.min(hours,RM), o1=Math.min(Math.max(hours-RM,0),O1), o2=Math.max(hours-(RM+O1),0);
  const regularPay=reg*rate*base, otPay=o1*rate*ot1+o2*rate*ot2;
  return { regularPay, otPay, total:regularPay+otPay, isSat };
}
// Effective per-hour rates for one shift, resolving a 3-tier priority chain —
// most specific wins, each tier optional, falling through to the next:
//   1. worker.clientRates[clientId] — this worker's own override for this
//      specific client (set in the Accounting rate matrix).
//   2. the worker's own rate — hourlyRate (or the older regRate), otRate,
//      shabbatRate — set in the worker modal or Accounting → Salary. It
//      changes this worker only (user decision 2026-10-05).
//   3. client.defaultHourlyRate/defaultOtRate/defaultShabbatRate — the
//      client's rate, shared by every worker there without a rate of their own.
// Each of the three rates resolves on its own. `src` says which tier gave the
// regular rate: 'override' / 'worker' / 'client' / '' (none). `has*Override` tells shiftPay() whether an
// explicit flat OT/Shabbat rate was found at ANY tier (vs falling back to
// the israeliDayPay law tiers) — the three tiers can't be told apart just by
// comparing the resolved number to a law-tier calculation.
function effectiveRates(w, clientId){
  const ov = clientId && w && w.clientRates && w.clientRates[clientId];
  const cl = clientId && clients.find(c=>c.id===clientId);
  const set=v=>v!=null&&v!=='';
  const own = set(w&&w.regRate) ? w.regRate : (Number(w&&w.hourlyRate)>0 ? w.hourlyRate : null);
  const pick=(ovVal,wVal,clVal,fallback)=>{
    if(set(ovVal)) return {val:Number(ovVal),has:true,src:'override'};
    if(set(wVal)) return {val:Number(wVal),has:true,src:'worker'};
    if(set(clVal)) return {val:Number(clVal),has:true,src:'client'};
    return {val:fallback,has:false,src:''};
  };
  const reg  = pick(ov&&ov.rate,        own,             cl&&cl.defaultHourlyRate,  0);
  const ot   = pick(ov&&ov.otRate,      w&&w.otRate,      cl&&cl.defaultOtRate,      Math.round(reg.val*PAY_RULES.otMult*100)/100);
  const shab = pick(ov&&ov.shabbatRate, w&&w.shabbatRate, cl&&cl.defaultShabbatRate, Math.round(reg.val*PAY_RULES.shabbatMult*100)/100);
  return {regRate:reg.val, otRate:ot.val, shabbatRate:shab.val, hasOtOverride:ot.has, hasShabbatOverride:shab.has,
    src:reg.src, otSrc:ot.src, shabbatSrc:shab.src};
}
function wRegRate(w,clientId){ return effectiveRates(w,clientId).regRate; }
function wOtRate(w,clientId){ return effectiveRates(w,clientId).otRate; }
function wShabRate(w,clientId){ return effectiveRates(w,clientId).shabbatRate; }
// Pay for one shift's hours. Default: the israeliDayPay law tiers (125%/150% OT,
// 150%/175%/200% Shabbat) applied to the effective regular rate. An explicit flat
// OT/Shabbat rate (at any tier above) replaces the law tiers with that single flat
// rate across all OT/Shabbat hours of the shift, same as before this defaulted to
// the law. clientId is optional — see effectiveRates() above.
function shiftPay(hours, w, isSat, clientId){
  const RM=PAY_RULES.regularMax, r=effectiveRates(w,clientId);
  if(isSat){
    if(r.hasShabbatOverride) return hours*r.shabbatRate;
    return israeliDayPay(hours, r.regRate, true).total;
  }
  if(r.hasOtOverride) return Math.min(hours,RM)*r.regRate + Math.max(hours-RM,0)*r.otRate;
  return israeliDayPay(hours, r.regRate, false).total;
}
// Daily pay (w.payMode === 'daily', picked per worker in Accounting →
// Salary; 2026-10-05): the worker is paid their own rate (the worker card's
// rate, read as ₪/day) once for every day worked, whatever the hours. A
// client's rate (an hourly figure) never applies to a daily-paid worker.
function isDailyPay(w){ return !!(w && w.payMode==='daily'); }
function dailyRate(w){ return Number(wOwnRate(w))||0; }
// One shift's pay, for every payroll figure (Salary, its export, the
// super-admin summary). seenDays is a Set kept per worker over the period:
// a daily-paid worker's later shifts on a day already paid pay 0.
function shiftPayFor(hours, w, isSat, clientId, date, seenDays){
  if(isDailyPay(w)){
    const k=localYMD(date);
    if(seenDays.has(k)) return 0;
    seenDays.add(k);
    return dailyRate(w);
  }
  return shiftPay(hours, w, isSat, clientId);
}
// The days of a daily-paid worker can be set by hand for one period
// (w.dayOverrides[key]); key = the concrete period: 'w:<Sunday yyyy-mm-dd>',
// 'm:<yyyy-mm>' or 'all'.
function salaryPeriodKey(period, now){
  now=now||new Date();
  if(period==='week'){ const ws=new Date(now); ws.setDate(ws.getDate()-ws.getDay()); return 'w:'+localYMD(ws); }
  if(period==='month') return 'm:'+localYMD(now).slice(0,7);
  return period||'all';
}
function dayOverride(w, key){
  const v=w&&w.dayOverrides&&w.dayOverrides[key];
  return (v==null||v==='')?null:Number(v);
}
function wOwnRate(w){
  if(!w) return '';
  if(w.regRate!=null&&w.regRate!=='') return w.regRate;
  return Number(w.hourlyRate)>0?w.hourlyRate:'';
}
function travelPay(w, days, months){
  return (Number(w&&w.travelAllowance)||0)*days + (Number(w&&w.travelMonthly)||0)*months;
}
function localYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function closeHistory(){ if(URL_TOKEN&&selectedWorker){ showScreen('screenPunch'); startPunchClock(); getLocation(); updateBigBtn(); } else { showScreen('screenWorker'); startWorkerClock(); } }

// ── Helpers ───────────────────────────────────────────────────────
function getPunchLog(){ try{return JSON.parse(localStorage.getItem('punchLog')||'[]');}catch(e){return[];} }
function savePunchLog(log){ localStorage.setItem('punchLog',JSON.stringify(log)); }
function getLastEntry(log,wid){ const es=log.filter(e=>e.workerId===wid); if(!es.length) return null; return es.reduce((a,b)=> new Date(b.ts).getTime()>new Date(a.ts).getTime()?b:a); }
function haversine(a,b,c,d){ const R=6371000,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
function updateScheduleManager(wid,s,e){ try{ const k='schedMgr_v1',r=localStorage.getItem(k)||localStorage.getItem('scheduleManagerData'); if(!r)return; const d=JSON.parse(r),w=d.workers?.find(x=>x.id===wid); if(w){w.schedule[new Date().getDay()]={type:'work',start:s,end:e};localStorage.setItem(k,JSON.stringify(d));} }catch(e){} }
// Toast (the same in all three pages): small, an icon and a coloured edge by
// its kind, guessed from the text — error, ongoing (ends with …), warning,
// else done.
const TOAST_ICONS={ok:'ti-circle-check',warn:'ti-alert-triangle',err:'ti-alert-circle',info:'ti-info-circle'};
function toastKind(t){
  if(/fail|error|could not|couldn't|not saved|denied|refused|invalid|נכשל|שגיאה|לא נשמר|לא ניתן/i.test(t)) return 'err';
  if(/(…|\.\.\.)\s*$/.test(t)) return 'info';
  if(/⚠|warn|check|empty|missing|not found|בדקו|ריק|חסר|לא נמצא/i.test(t)) return 'warn';
  return 'ok';
}
function showToast(msg,dur){
  const t=document.getElementById('toast'), text=String(msg), k=toastKind(text);
  t.className='toast show '+k; t.innerHTML='<i class="ti '+TOAST_ICONS[k]+'"></i><span></span>'; t.lastChild.textContent=text;
  clearTimeout(t.__hide); t.__hide=setTimeout(()=>t.classList.remove('show'),dur||3500);
}
// ── New version check (2026-10-04; the same code in schedule-manager.html,
// worker-punch.html and supplier-portal.html). An app left open — a PWA in
// the background — keeps running the code it loaded, even after a deploy.
// When the page comes back to the screen, and every 30 min while it is
// shown, the files it runs are asked for their ETag (HEAD: the service
// worker only handles GET, and cache:'no-store' skips the HTTP cache). The
// first answer is the baseline; a changed ETag later means a deploy, and a
// bar offers to reload. Nothing reloads on its own (typed data stays).
function startVersionWatch(files){
  let base=null, shown=false;
  const tags=async()=>{
    const out={};
    for(const f of files()){
      const r=await fetch(f,{method:'HEAD',cache:'no-store'});
      if(!r.ok) return null;
      out[f]=r.headers.get('etag')||r.headers.get('last-modified')||'';
    }
    return out;
  };
  const check=async()=>{
    if(shown||document.visibilityState!=='visible'||navigator.onLine===false) return;
    try{
      const t=await tags(); if(!t) return;
      if(!base){ base=t; return; }
      for(const f in t){ if(!(f in base)){ base[f]=t[f]; continue; } if(t[f]&&base[f]&&t[f]!==base[f]){ shown=true; showNewVersionBar(); return; } }
    }catch(e){}
  };
  document.addEventListener('visibilitychange',check);
  setInterval(check,30*60*1000);
  check();
}
function showNewVersionBar(){
  if(document.getElementById('newVersionBar')) return;
  document.body.insertAdjacentHTML('beforeend',`<div id="newVersionBar" style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100000;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 12px 10px 16px;border-radius:12px;background:#1f6feb;color:#fff;font:600 14px/1.3 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)">
    <span>${tr('A new version is available')}</span>
    <button type="button" onclick="location.reload()" style="border:0;border-radius:8px;padding:6px 12px;background:#fff;color:#1f6feb;font:inherit;cursor:pointer">${tr('Update')}</button>
    <button type="button" aria-label="${tr('Close')}" onclick="this.parentElement.remove()" style="border:0;background:none;color:#fff;font:inherit;font-size:18px;cursor:pointer;padding:0 4px">✕</button></div>`);
}
startVersionWatch(()=>[location.pathname]);

// Site shown in history: keep a recorded site only if it's one of THIS worker's
// own clients; otherwise show the client the worker is attached to.
function histSite(e){
  if(e.clientId && allClients.length){ const c=allClients.find(x=>x.id===e.clientId); if(c) return c.name; }
  const w=selectedWorker;
  if(w && allClients.length){
    const wc=(w.clientIds||[]).map(id=>allClients.find(x=>x.id===id)).filter(Boolean);
    const match = e.site && wc.find(c=>c.name===e.site);
    if(match) return match.name;
    if(wc[0]) return wc[0].name;
  }
  if(SITE && SITE.name && SITE.name!=='Work Site') return SITE.name;
  return e.site || '';
}

function openHistory(){
  if(!selectedWorker) return;
  showScreen('screenHistory');
  const log=getPunchLog();
  const wLog=log.filter(e=>e.workerId===selectedWorker.id);
  const el=document.getElementById('historyContent');
  if(!wLog.length){
    el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3);font-size:15px">'+tr('No history yet')+'</div>';
    return;
  }
  // Pair punches into shifts chronologically — mirrors groupPunchesIntoShifts
  // in schedule-manager.html (kept in sync per CLAUDE.md's duplication
  // convention) — and group by the SHIFT's own (IN-punch) date, not each
  // entry's own calendar day. Grouping by calendar day first (the previous
  // approach) split an overnight IN→OUT pair into two unpaired halves —
  // the IN alone on day N with no matching OUT, and the OUT alone on day
  // N+1 with no matching IN — so an overnight shift's hours silently
  // vanished from the worker's own history even though they're correctly
  // counted in the manager's payroll view.
  const chronoAll=[...wLog].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const shifts=[]; let openShift=null;
  chronoAll.forEach(e=>{
    if(e.type==='in'){
      if(openShift) shifts.push(openShift);
      openShift={date:new Date(e.ts),entries:[e]};
    } else {
      if(!openShift) openShift={date:new Date(e.ts),entries:[]};
      openShift.entries.push(e);
      shifts.push(openShift); openShift=null;
    }
  });
  if(openShift) shifts.push(openShift);
  // Group by date
  const byDate={};
  [...shifts].reverse().forEach(sh=>{
    const d=sh.date.toLocaleDateString(uiLocale(),{weekday:'short',day:'2-digit',month:'short'});
    if(!byDate[d]) byDate[d]=[];
    byDate[d].push(sh);
  });
  // Calculate total hours per day
  el.innerHTML=Object.entries(byDate).slice(0,14).map(([date,dayShifts])=>{
    let hours=0;
    dayShifts.forEach(sh=>{
      const inE=sh.entries.find(e=>e.type==='in'), outE=sh.entries.find(e=>e.type==='out');
      if(inE && outE && inE.time && outE.time){
        const sm=inE.time.split(':').map(Number), em=outE.time.split(':').map(Number);
        let dur=(em[0]*60+em[1])-(sm[0]*60+sm[1]); if(dur<0) dur+=1440;
        hours+=dur/60;
      }
    });
    const entries=dayShifts.flatMap(sh=>sh.entries);
    const rows=entries.map(e=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
        <span style="font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;min-width:44px;text-align:center;${e.type==='in'?'background:rgba(109,214,160,0.12);color:#6dd6a0':'background:rgba(255,79,94,0.12);color:#ff4f5e'}">${e.type==='in'?tr('IN'):tr('OUT')}</span>
        <span style="font-size:15px;font-family:'DM Mono',ui-monospace,monospace;font-weight:600;color:var(--text)">${e.time}</span>
        ${(()=>{const s=histSite(e);return s?`<span style="font-size:11px;color:var(--text3)"><i class="ti ti-map-pin"></i> ${esc(s)}</span>`:'';})()}
        ${e.dist!=null?`<span style="font-size:11px;color:var(--text3)">${e.dist}m</span>`:''}
      </div>`).join('');
    return `<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(date)}</div>
        ${hours>0?`<div style="font-size:13px;font-weight:600;color:var(--green)">${tr('{h}h',{h:hours.toFixed(1)})}</div>`:''}
      </div>
      ${rows}
    </div>`;
  }).join('');
}

// Error telemetry: send client errors to the errors collection (throttled, silent).
let _errSent={}, _errCount=0;
function reportError(message, source, stack){
  try{
    if(_errCount>20) return;
    const key=String(message||'').slice(0,120), nowT=Date.now();
    if(_errSent[key] && nowT-_errSent[key]<60000) return;
    _errSent[key]=nowT; _errCount++;
    punchFn({
      action:'logError',
      page:(location.pathname.split('/').pop()||location.href),
      role:'worker',
      worker:(typeof selectedWorker!=='undefined'&&selectedWorker&&selectedWorker.name)||(URL_TOKEN?('token:'+String(URL_TOKEN).slice(0,4)):''),
      message:String(message||'').slice(0,500),
      source:String(source||'').slice(0,300),
      stack:String(stack||'').slice(0,1200)
    }).catch(()=>{});
  }catch(e){}
}
window.addEventListener('error', function(ev){ reportError(ev.message, (ev.filename||'')+':'+(ev.lineno||''), ev.error&&ev.error.stack); });
window.addEventListener('unhandledrejection', function(ev){ const r=ev.reason; reportError((r&&r.message)||String(r), 'promise', r&&r.stack); });
loadI18n(storedLanguage()).catch(()=>{}).then(()=>{
  applyI18n();
  syncLangSelects();
  try{ init(); }catch(err){ console.error('init failed',err); reportError('init failed: '+(err&&err.message), 'init', err&&err.stack); showInvalidLink(tr('Something went wrong'),tr('Reload the page. If that doesn\'t help, contact your manager.'),'ti-alert-triangle'); }
});


// ── PWA service worker: always-fresh, auto-reload on new version ───────────
if('serviceWorker' in navigator){
  let _swRefreshing=false;
  const _hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_swRefreshing) return; _swRefreshing=true;
    if(_hadController) window.location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js',{updateViaCache:'none'})
      .then(reg=>{ reg.update(); })
      .catch(()=>{});
  });
}
