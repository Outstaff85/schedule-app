<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner lab</title>
<meta name="theme-color" content="#10141f">
<script>/* The theme before the first draw (docs/redesign.md → Light theme; src/lib/theme.ts): Dark by default, Light, or System — the device's setting. */try{var t=localStorage.getItem('uiTheme');if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}</script>
<!-- Odinson Glass, as on every page of the site (og.css: the ground with its blobs, glass, plates, the fonts) -->
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/og.css">
<!-- The scanner lab (docs/scan-plan.md → Scanner lab; Admin → Scanner lab, super-admin):
     runs the scanner's on-device models on this phone's camera and photos — the
     live frame, the shot, the upright turn — and shows how fast and how sure they
     are. The models and ONNX Runtime are put next to it at deploy (deploy.yml). -->
<style>
  /* The lab's own looks over og.css's tokens: glass controls, solid plates, the flowing line for progress. */
  :root{--ink2:var(--ink-2);--line:rgba(var(--tint),.14)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;color:var(--ink);font:15px/1.4 'DM Sans','Heebo',Arial,sans-serif;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
  h1{font-size:19px;line-height:24px;font-weight:600;margin:0 0 12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
  select,button,label.btn{font:600 14px 'DM Sans','Heebo',Arial,sans-serif;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-edge);border-radius:16px;min-height:42px;padding:0 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;-webkit-tap-highlight-color:transparent}
  button,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  select{padding-right:10px}
  select option{background:var(--surface-2);color:var(--ink)}
  button.primary{background:rgba(var(--tint),.28)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--uline-2);outline-offset:2px}
  input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--green)}
  .stage{position:relative;width:100%;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  video,#still{display:block;width:100%;height:auto}
  #overlay{position:absolute;inset:0;width:100%;height:100%}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
  .stat{background:var(--plate);background-image:var(--plate-grad);box-shadow:var(--shadow-plate);border-radius:16px;padding:10px 14px}
  .stat b{display:block;font:500 20px/26px 'DM Mono',ui-monospace,monospace;color:var(--fig)}
  .stat span{color:var(--ink2);font-size:12px;line-height:16px}
  #log,#errs{white-space:pre-wrap;color:var(--ink2);font:12px/16px 'DM Mono',ui-monospace,monospace;margin-top:4px}
  #errs{color:var(--red-text)}
  #errs:empty::before{content:'No errors';color:var(--ink2)}
  .loghead{color:var(--ink);font-size:13px;font-weight:600;margin:14px 0 0}
  .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 10px}
  .bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--uline);background-size:300% 100%;animation:og-flow 2.4s linear infinite;box-shadow:var(--shadow-uline)}
  .kept{background:var(--plate);background-image:var(--plate-grad);border-radius:16px;box-shadow:inset 4px 0 0 var(--ok),var(--shadow-plate);margin:8px 0;padding:8px 8px 8px 14px}
  .kept-head{display:flex;align-items:center;gap:8px;margin:0}
  .kept-head .open{flex:1;min-width:0;justify-content:flex-start;text-align:left;display:flex;align-items:center;gap:8px;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:4px}
  .kept-head .open img{height:36px;width:auto;border-radius:6px}
  .kept-head .open span{min-width:0;overflow-wrap:anywhere}
  .kept-body{display:grid;gap:10px;margin-top:8px}
  .kept-page{position:relative}
  .kept-page img{width:100%;border-radius:12px;display:block}
  .kept-page button{position:absolute;top:6px;right:6px;min-height:34px;padding:0 12px}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<h1>Scanner lab</h1>
<div class="row">
  <select id="model">
    <option value="lite.onnx+sa24_w16.onnx">Live: light · capture: accurate</option>
    <option value="sa24_w16.onnx">Accurate only (42 MB)</option>
    <option value="lite.onnx">Light only (5 MB)</option>
  </select>
  <select id="engine">
    <option value="122">CPU engine: ONNX Runtime 1.22</option>
    <option value="130">CPU engine: ONNX Runtime 1.30</option>
  </select>
  <select id="backend">
    <option value="auto">Auto (GPU, else CPU)</option>
    <option value="webgpu">GPU (WebGPU)</option>
    <option value="wasm">CPU (WASM)</option>
  </select>
</div>
<div class="row">
  <button class="primary" id="startCam">Start camera</button>
  <label class="btn">Photos or PDF… <input id="file" type="file" multiple hidden></label>
  <button id="snap">Capture</button>
  <button id="stop">Stop</button>
  <label class="btn" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="useWorker" checked> Background thread</label>
  <label class="btn" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="follow" checked> Follow between frames</label>
</div>
<div id="status" style="font-size:13px;color:var(--ink2)">Starting…</div>
<div class="bar"><i id="prog"></i></div>
<div class="stage" id="stage">
  <video id="video" playsinline muted hidden></video>
  <img id="still" alt="" hidden>
  <canvas id="overlay"></canvas>
</div>
<div id="hint" style="font-size:14px;margin-top:8px;min-height:20px"></div>
<div id="train" style="font-size:12px;color:var(--ink2)"></div>
<div id="shot" hidden style="margin-top:10px">
  <p style="color:var(--ink2);margin:0 0 6px;font-size:13px">Tap a page to fix its corners</p>
  <div class="row"><button class="primary" id="retake">Retake</button><button id="keep">Looks good</button><label class="btn" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="auto" checked> Auto capture</label></div>
  <img id="shotImg" alt="" style="width:100%;border-radius:14px;display:block">
  <p id="shot2note" style="color:var(--ink2);margin:10px 0 6px"></p>
  <div id="shotMore" style="display:grid;gap:10px"></div>
</div>
<div id="kept"></div>
<div class="stats">
  <div class="stat"><b id="sBackend">—</b><span>runs on</span></div>
  <div class="stat"><b id="sFps">—</b><span>frames per second</span></div>
  <div class="stat"><b id="sMs">—</b><span>ms per frame (model)</span></div>
  <div class="stat"><b id="sConf">—</b><span>confidence (≥ 0.50 = found)</span></div>
  <div class="stat"><b id="sLoad">—</b><span>model load, s</span></div>
  <div class="stat"><b id="sRes">—</b><span>camera resolution</span></div>
  <div class="stat"><b id="sUi">—</b><span>screen frames/s (smoothness)</span></div>
  <div class="stat"><b id="sCap">—</b><span>capture, ms</span></div>
  <div class="stat"><b id="sTrack">—</b><span>frame follows, frames/s</span></div>
  <div class="stat"><b id="sTrackMs">—</b><span>follow, ms per frame</span></div>
</div>
<div id="logs">
<div class="loghead">Errors</div>
<div id="errs"></div>
<div class="loghead">Loading and work</div>
<div id="log"></div>
</div>

<script>
// The ONNX Runtime build for the CPU: 1.22.0 (faster and smoother there than 1.30); ?ort=130 picks 1.30.0.
// The GPU always uses 1.30.0: its GPU runs the light model right on a phone where 1.22 returned zeros.
const ORT_DIR = new URLSearchParams(location.search).get('ort') === '130' ? 'ort130' : 'ort', GPU_ORT = 'ort130';
document.write('<script src="/scan/' + ORT_DIR + '/ort.all.min.js"><\/script>');
</script>
<script src="/scan/scan-core.js"></script>
<script src="/scan/track.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = t => { $('log').textContent = t + '\n' + $('log').textContent; };
// Errors apart from the loading log (owner, 2026-10-24): each with its time, newest on top.
const logErr = t => { $('errs').textContent = new Date().toTimeString().slice(0, 8) + ' ' + t + '\n' + $('errs').textContent; };
// a line from scan-core.js / the worker (one onLog for both): its failures go to the errors
const logAny = t => (/^Could not start|wrong on this GPU|^WebGPU is not available/.test(t) ? logErr : log)(t);
const status = (t, frac) => { $('status').textContent = t; if (frac != null) $('prog').style.width = Math.round(frac * 100) + '%'; };
window.addEventListener('error', e => logErr('Page error: ' + e.message));
window.addEventListener('unhandledrejection', e => logErr('Error: ' + (e.reason && e.reason.message || e.reason)));
if (typeof ort === 'undefined') logErr('ONNX Runtime did not load (ort.all.min.js)');
ort.env.wasm.wasmPaths = location.origin + '/scan/' + ORT_DIR + '/';
// Several CPU threads need a cross-origin isolated page (COOP/COEP headers); /scan/ is not isolated, so 1.
const THREADS = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
ort.env.wasm.numThreads = THREADS;
// Background threads for the live frame when the pool is used.
const POOL = Math.max(1, Math.min(3, Math.floor((navigator.hardwareConcurrency || 2) / 2)));

const STEADY_MS = 1000, MOVE = 0.02, LOCK_MS = 250;  // green after 0.25 s on the edges, the shot after 1 s
// The frame sticks once green (owner, 2026-10-24: it kept moving and the 1 s countdown kept starting again):
// an answer within HOLD of it leaves it where it is, a weak or missed answer is outlived for MISS_MS (a blur,
// a glare), and the follow between answers starts the countdown again only when the document went DRIFT away
// since it stuck, or jumped (JERK in one camera frame) — not on every tremble of the hand.
const HOLD = 0.04, MISS_MS = 600, DRIFT = 0.03, JERK = 0.02;
let smooth = null, steadySince = 0, lastRes = null, target = null, shown = null;
let anchor = null, missSince = 0, smoothConf = 0;
const farthest = (a, b) => Math.max(...a.map((p, i) => Math.hypot(p[0] - b[i][0], p[1] - b[i][1])));
function restartSteady(now) { steadySince = now; anchor = smooth && smooth.map(p => p.slice()); }
let fails = 0, engine = null, engineKey = '', running = false, stream = null, inFlight = 0, lastSent = 0, seq = 0, applied = 0;
let engineWay = null;  // the way the model runs on now (WAYS below)
const stuckWays = new Set();  // ways whose background thread stopped answering on this page: not tried again
const times = [], frames = [], uiFrames = [];
const small = document.createElement('canvas'); small.width = S; small.height = S;
const sctx = small.getContext('2d', { willReadFrequently: true });

// The GPU memory layout that worked on this device (scan-core.js openSession): started first next time.
const GPU_LAYOUT_KEY = 'scanGpuLayout';
const gpuLayout = { get: () => { try { return localStorage.getItem(GPU_LAYOUT_KEY); } catch (e) { return null; } }, set: v => { try { if (v) localStorage.setItem(GPU_LAYOUT_KEY, v); } catch (e) {} } };

// Two engines with one interface: in the page itself, or in the background worker.
function pageEngine() {
  let live = null, cap = null, face = null;
  return {
    async load(liveName, capName, want, withFace) {
      const a = await openSession(liveName, want, status, logAny, gpuLayout.get()); live = a.sess;
      const b = capName ? await openSession(capName, want, status, logAny, gpuLayout.get()) : a; cap = b.sess;
      gpuLayout.set(a.layout || b.layout);
      if (withFace !== false) face = await ort.InferenceSession.create(await fetchModel('yunet.onnx', () => {}), { executionProviders: ['wasm'] });
      return a.ep + (b.ep !== a.ep ? '/' + b.ep : '');
    },
    hasCap: () => cap !== live,
    async detect(which, input) { const t = performance.now(); const res = await detectRGBA(which === 'cap' ? cap : live, rgbaOf(input)); return { res, ms: performance.now() - t }; },
    async warp(rgba, w, h, pts, upright) { return uprightRGBA(upright ? face : null, warpRGBA(rgba, w, h, pts)); },
    stop() {},
  };
}
function workerEngine(threads, dir = ORT_DIR, onHang = onStuck) {
  const w = new Worker('/scan/scan-worker.js?ort=' + dir), waiting = new Map(); let n = 0, two = false, heard = performance.now();
  const failAll = why => { for (const p of waiting.values()) p.reject(new Error(why)); waiting.clear(); };
  // A worker that says nothing for 30 s while loading is taken as stuck.
  const watch = setInterval(() => { if (waiting.size && performance.now() - heard > 25000) { failAll('no answer for 25 s'); onHang(); } }, 1000);
  w.onmessage = ({ data: m }) => {
    heard = performance.now();
    if (m.type === 'status') status(m.text, m.frac);
    else if (m.type === 'log') logAny(m.text);
    else if (m.type === 'reply') { const p = waiting.get(m.id); waiting.delete(m.id); if (p) m.error ? p.reject(new Error(m.error)) : p.resolve(m); }  // a late answer to a call given up on: dropped
  };
  w.onerror = e => { logErr('Worker error: ' + (e.message || 'could not start')); failAll('the background thread failed: ' + (e.message || 'could not start')); };
  // a request to a thread that had nothing to do starts the clock again: an idle thread says nothing, so
  // its first request after 25 s was taken as stuck at once (every picked file, 2026-10-22)
  const call = (msg, transfer) => new Promise((resolve, reject) => { if (!waiting.size) heard = performance.now(); msg.id = ++n; waiting.set(msg.id, { resolve, reject }); w.postMessage(msg, transfer || []); });
  return {
    async load(liveName, capName, want, withFace = true) {
      two = !!capName;
      const r = await call({ type: 'load', live: liveName, cap: capName, want, threads, face: withFace, layout: gpuLayout.get() });
      gpuLayout.set(r.layout);
      return r.ep;
    },
    hasCap: () => two,
    async detect(which, input) {
      const m = input.bitmap ? await call({ type: 'detect', which, bitmap: input.bitmap }, [input.bitmap]) : await call({ type: 'detect', which, rgba: input.rgba.buffer }, [input.rgba.buffer]);
      return { res: m.res, ms: m.ms };
    },
    async warp(rgba, wd, h, pts, upright) { return (await call({ type: 'warp', rgba: rgba.buffer, w: wd, h, pts, upright }, [rgba.buffer])).out; },
    stop() { clearInterval(watch); failAll('the model was stopped'); w.terminate(); },  // nothing left waiting on it
  };
}

// A background thread that stops answering while scanning (a phone's GPU was seen to hang, and every
// later call then waited on it): the way it ran on is left for this page, and the model starts again on
// the next way at the next use (loop, a picked file).
function onStuck() {
  if (!engine) return;
  const w = WAYS.find(x => x.id === engineWay);
  logErr('The model stopped answering on "' + (w ? w.label : engineWay) + '" — it starts again on the next way');
  noteFail(w ? w.label : engineWay, 'stopped answering while scanning');
  stuckWays.add(engineWay);
  const old = engine; engine = null; engineKey = ''; dropFileThreads();
  try { old.stop(); } catch (e) {}
}

// The ways to run, best first. Each is tried in turn: a way that fails or goes
// silent for 25 s is dropped (with its throwaway background thread), the next
// starts clean. A GPU that hangs or computes wrong was seen on a phone, and a
// phone may refuse CPU threads inside a background thread. Nothing is remembered
// between opens (owner, 2026-10-22): every open tries the best way first.
const WAYS = [
  { id: 'bg-gpulive', label: 'GPU live + CPU capture · bg', worker: true, gpuLive: true, ep: 'wasm', threads: 1 },
  { id: 'bg-pool', label: 'CPU · ' + POOL + ' bg threads + 1', worker: true, pool: true, ep: 'wasm', threads: 1 },
  { id: 'bg-cpu', label: 'CPU ×' + THREADS + ' · bg', worker: true, ep: 'wasm', threads: THREADS },
  { id: 'bg-cpu1', label: 'CPU ×1 · bg', worker: true, ep: 'wasm', threads: 1 },
  { id: 'page-cpu', label: 'CPU ×' + THREADS + ' · page', worker: false, ep: 'wasm', threads: THREADS },
];
// Why a way failed on this device, kept on it (the last 8): shown in the log when the page opens, so a way
// that keeps failing — and why: memory, a hang, the GPU, another error — can be seen on the phone itself.
const FAIL_KEY = 'scanWayFails';
function failKind(text) {
  const t = String(text || '');
  if (/memory|alloc|oom|out of range|rangeerror|bad_alloc/i.test(t)) return 'memory';
  if (/no answer|silent|timed? ?out|stopped answering/i.test(t)) return 'hang';
  if (/webgpu|gpu|adapter|device (was )?lost|shader/i.test(t)) return 'GPU';
  return 'error';
}
function noteFail(label, text) {
  const kind = failKind(text);
  logErr('Failed — ' + label + ': ' + kind + ' (' + String(text || '').slice(0, 160) + ')');
  try {
    const list = JSON.parse(localStorage.getItem(FAIL_KEY) || '[]');
    list.push({ at: new Date().toISOString(), way: label, kind, text: String(text || '').slice(0, 160), mem: navigator.deviceMemory || null });
    localStorage.setItem(FAIL_KEY, JSON.stringify(list.slice(-8)));
  } catch (e) {}
}
function showFails() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(FAIL_KEY) || '[]'); } catch (e) {}
  if (!list.length) return;
  // in the errors, newest on top: the failures oldest first, then their heading above them
  const add = t => { $('errs').textContent = t + '\n' + $('errs').textContent; };
  for (const f of list) add('  ' + f.at.slice(0, 16).replace('T', ' ') + ' — ' + f.way + ': ' + f.kind + ' (' + f.text + ')' + (f.mem ? ', memory ' + f.mem + ' GB' : ''));
  add('Earlier failures on this device (last ' + list.length + ', newest on top):');
}

// Several single-thread background threads: the live frames go to them in
// turn (2–3 frames worked on at once), the accurate model has its own thread,
// so a capture never stops the live frame. Phones that refuse CPU threads
// inside a background thread still run several background threads.
// shared: the accurate model's thread already loaded (capThread — loaded first, picked files use it at
// once); the pool then loads only its live threads and never stops the shared one.
function poolEngine(nLive = POOL, liveEp = null, capEp = null, shared = null) {
  const lives = Array.from({ length: nLive }, () => workerEngine(1, liveEp === 'webgpu' ? GPU_ORT : ORT_DIR)), capE = shared || workerEngine(1), free = lives.slice();
  let two = false;
  return {
    size: nLive,
    shared: !!shared,
    async load(liveName, capName, want) {
      two = !!capName;
      const eps = await Promise.all(lives.map((e, i) => e.load(liveName, null, liveEp || want, !two && i === 0)).concat(two && !shared ? [capE.load(capName, null, capEp || want, true)] : []));
      return eps[0] + (two && (shared || eps[eps.length - 1] !== eps[0]) ? '/' + (shared ? 'wasm' : eps[eps.length - 1]) : '');
    },
    hasCap: () => two,
    async detect(which, input) {
      if (which === 'cap' && two) return capE.detect('live', input);
      const e = free.shift() || lives[0];
      try { return await e.detect('live', input); } finally { if (!free.includes(e)) free.push(e); }
    },
    warp: (rgba, w, h, pts, upright) => (two ? capE : lives[0]).warp(rgba, w, h, pts, upright),
    stop() { lives.forEach(e => e.stop()); if (!shared) capE.stop(); },
  };
}

// The accurate model's thread is started first, on the CPU (owner, 2026-10-22): picked photos and PDFs need
// only it, so they can go in a few seconds after the page opens; the live frame's models (the GPU's light
// one) are loaded after it, in the background when nothing is being worked on, or when the camera starts,
// and they share this thread for the shot — one copy of the accurate model. ensureCap() → the thread
// (a capture-only engine for analyzePicture), started again when it failed or the model was changed.
let capThread = null, capFor = '', capLoading = null;
function capOnly(e) { return { detect: (which, input) => e.detect('live', input), warp: e.warp, hasCap: () => false, stop: () => e.stop(), raw: e, label: 'the capture thread' }; }
function ensureCap() {
  const [live, cap] = $('model').value.split('+'), name = cap || live;
  if (capThread && capFor === name) return Promise.resolve(capThread);
  if (capLoading && capFor === name) return capLoading;
  if (capThread) { capThread.stop(); capThread = null; }
  capFor = name;
  const t0 = performance.now();
  status('Preparing the accurate model…', 0);
  const e = workerEngine(1, ORT_DIR, () => {
    logErr('The capture thread stopped answering — it starts again');
    noteFail('Capture thread', 'stopped answering');
    if (capThread && capThread.raw === e) capThread = null;
    e.stop(); onStuck();
  });
  capLoading = e.load(name, null, 'wasm', true).then(() => {
    capThread = capOnly(e);
    log('The accurate model is ready (' + ((performance.now() - t0) / 1000).toFixed(1) + ' s) — photos and PDFs can go in');
    if (!engine) status('Ready for photos and PDFs — the camera\'s model is loading…', 1);
    return capThread;
  }, err => { e.stop(); noteFail('Capture thread', err && err.message || err); throw err; }).finally(() => { capLoading = null; });
  return capLoading;
}

// One start of the model at a time (the live frame and a picked file may both ask).
let ensuring = null;
function ensureSession() { return ensuring || (ensuring = startSession().finally(() => { ensuring = null; })); }
async function startSession() {
  const [live, cap] = $('model').value.split('+'), want = $('backend').value, inWorker = $('useWorker').checked;
  const key = $('model').value + '|' + want + '|' + inWorker;
  if (engine && engineKey === key) return;
  if (engine) engine.stop();
  dropFileThreads();
  engine = null; $('sBackend').textContent = 'loading…'; $('startCam').disabled = true; status('Preparing the model…', 0);
  const t0 = performance.now();
  let ways = WAYS.filter(w => (inWorker || !w.worker) && (want === 'auto' || w.ep === want || (want === 'webgpu' && false)));
  if (!navigator.gpu) ways = ways.filter(w => w.ep !== 'webgpu' && !w.gpuLive);
  if (want === 'webgpu') ways = inWorker ? [{ id: 'bg-gpu', label: 'GPU · bg', worker: true, ep: 'webgpu', threads: 1 }] : [{ id: 'page-gpu', label: 'GPU · page', worker: false, ep: 'webgpu', threads: 1 }];
  if (want === 'wasm') ways = ways.filter(w => !w.gpuLive);
  if (ways.some(w => !stuckWays.has(w.id))) ways = ways.filter(w => !stuckWays.has(w.id));
  let e = null, used = null;
  for (const w of ways) {
    status('Trying ' + w.label + '…', 0);

  // lanes: lane 0 is the main engine, lane k its file thread k (the main engine when that one failed); a lane
  // takes one picture at a time
  // lanes: 0 is the main engine; 1 the file thread, once a second picture has started it (growFiles)
  const t0 = performance.now(), free = [0], waiting = [], lanes = new Set([0]);
  const take = () => free.length ? Promise.resolve(free.shift()) : new Promise(r => waiting.push(r));
  const give = k => { const r = waiting.shift(); r ? r(k) : free.push(k); };
  const addLane = k => { if (!lanes.has(k)) { lanes.add(k); give(k); } };
  // lane 0: the whole engine when it shares the capture thread (its light model also looks for more documents), else the capture thread
  const engineOf = async k => { const t = k && fileThreads[k - 1]; if (t && !t.dead) return t; return engine && engine.shared ? engine : ensureCap(); };
  // a picture whose thread failed is worked again on the main engine (started again when it was the one that hung)
  // what is being done is shown on the picture that goes on the list next (as a shot is): the picture, the
  // frame of each document as it is found, and what is going on; the pages join the list below as each is done
  let next = 1;
  const stepOf = (n, url, tag) => async (stage, q) => {
    if (n !== next) return;
    const img = $('still');
    if (img.dataset.pick !== String(n)) { img.dataset.pick = String(n); img.src = url; try { await img.decode(); } catch (e) { return; } img.hidden = false; $('video').hidden = true; }
    if (n !== next) return;
    if (q) { shown = q.map(p => p.slice()); drawPts(shown, true, img); } else drawPts(null, false, img);
    $('hint').textContent = (stage === 'finding' ? 'Finding the document' : 'Found — cutting it out') + ' (' + tag + ')…';
  };
  const work = async (url, pdfPage, step) => {
    const k = await take();
    try {
      const eng = await engineOf(k);
      try { return await analyzePicture(url, pdfPage, eng, step); }
      catch (err) {
        log('Picked file on ' + (eng.label || 'the main thread') + ': ' + (err && err.message || err) + ' — again on the main thread');
        return await analyzePicture(url, pdfPage, await engineOf(0), step);
      }
    } finally { give(k); }
  };
  let pages = 0, order = Promise.resolve(), n = 0, failed = false;
  try {
    for await (const [url, tag, pdfPage] of pickedPictures(files)) {
      const k = ++n;
      if (k === 2) growFiles(addLane);
      const done = work(url, pdfPage, stepOf(k, url, tag));
      done.catch(() => {});
      // shown in the files' order, each as soon as it and the ones before it are done
      order = order.then(async () => {
        if (failed) return;
        $('status').textContent = 'Working on ' + tag + '…';
        try { pages = await showPicture(url, await done, pages); next = k + 1; window.dispatchEvent(new Event('lab-picked')); }
        catch (err) { failed = true; logErr('Picked file ' + k + ': ' + (err && err.message || err)); $('hint').textContent = 'A file could not be worked on — see the log'; }
      });
      // one picture at most waiting for a free lane (the next ones are not even opened yet: memory)
      while (waiting.length) await new Promise(r => setTimeout(r, 20));
    }
  } catch (err) { logErr('Picked file: ' + (err && err.message || err)); $('hint').textContent = 'A file could not be opened — see the log'; }
  await order;
  // every page on the list (the other documents found on a photo too)
  const total = $('shot').hidden ? 0 : 1 + $('shotMore').querySelectorAll('img').length;
  picking = false;
  $('status').textContent = total + ' page(s) from ' + files.length + ' file(s)';
  log('Picked files: ' + total + ' page(s) from ' + files.length + ' file(s) in ' + Math.round(performance.now() - t0) + ' ms on ' + lanes.size + ' thread(s)');
  if (total > 1) $('shot2note').textContent = total + ' page(s) from ' + files.length + ' file(s):';
};
// Switching the model, GPU / CPU or the thread: nothing of the old way stays on screen —
// no frame, no figures — and the frame and its following start again on the new way.
$('model').onchange = $('backend').onchange = $('useWorker').onchange = async () => {
  const was = running; running = false; shotId++;
  while (inFlight) await new Promise(r => setTimeout(r, 30));
  target = shown = smooth = lastRes = null; steadySince = 0; Track.reset();
  times.length = frames.length = followTimes.length = followMs.length = 0;
  for (const id of ['sFps', 'sMs', 'sConf', 'sTrack', 'sTrackMs', 'sCap']) $(id).textContent = '—';
  drawPts(null, false, $('video')); $('hint').textContent = 'Switching…';
  await ensureSession().catch(() => {});
  $('hint').textContent = '';
  if (was) { running = true; loop(); startFollow(); }
};
$('engine').value = ORT_DIR === 'ort130' ? '130' : '122';
$('engine').onchange = () => { location.search = '?ort=' + $('engine').value + '&v=' + Date.now(); };
log('CPU engine: ONNX Runtime ' + (ort.env.versions && ort.env.versions.web || ORT_DIR) + ', GPU engine: 1.30.0');
log('GPU (WebGPU) in this browser: ' + (navigator.gpu ? 'yes' : 'no'));
log('CPU: ' + (navigator.hardwareConcurrency || '?') + ' cores' + (navigator.deviceMemory ? ', memory ' + navigator.deviceMemory + ' GB' : '') + '; several background threads of one thread each are used' + (self.crossOriginIsolated ? '' : ' (one core each: this page is not cross-origin isolated)'));
showFails();
// The accurate model first (photos and PDFs can go in), then the camera's models in the background once
// nothing is being worked on; the camera button waits for them.
ensureCap().catch(e => log('Accurate model: ' + (e && e.message || e))).finally(async () => {
  while (picking) await new Promise(r => setTimeout(r, 300));
  ensureSession().catch(e => log('Model: ' + (e && e.message || e)));
});
</script>
