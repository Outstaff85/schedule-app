<script>/* The theme before the first draw (docs/redesign.md → Light theme; src/lib/theme.ts): Dark by default, Light, or System — the device's setting. */try{var t=localStorage.getItem('uiTheme');if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}</script>
<title>Interactive Manager</title>
<style>
  :root {
    --bg:var(--surface); --bg2:var(--surface-2); --bg3:var(--surface-3);
    --border:rgba(var(--tint),0.08); --border2:rgba(var(--tint),0.14);
    --text:#e8eaf0; --text2:var(--ink-2); --text3:#858ba0;
    --accent2:#3d7af5;
    --green-bg:rgba(109,214,160,0.13);
    --amber-bg:rgba(245,166,35,0.12);
    --blue:#60a5fa; --blue-bg:rgba(96,165,250,0.12);
    --red-bg:rgba(248,113,113,0.1);
    --radius:10px;   }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans','Heebo',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* Titlebar / top panel */
  /* The glass blur sits on a layer behind the bar, not on the bar itself: a
     backdrop-filter on the bar would trap the phone bottom bar (fixed) inside it. */
  /* The theme switch (Dark / Light / System): the window's segmented switch (og.css .seg). */
  .login-theme .seg{margin:14px 0 0;}
  .login-theme .seg button,.acct-theme .seg button{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;}
  .login-theme .seg button svg{font-size:15px;}
  /* The active tab: its section color (--k) and the highlight line under it. */
  /* Login screen: the firm's showcase (left, or on top on a phone) and the sign-in card. */
  .login-screen{position:fixed;inset:0;z-index:1000;overflow-y:auto;align-items:stretch;justify-content:center;background:linear-gradient(135deg,#0a0d15,#121829 60%,#0f1117);}
  .login-hero{display:flex;justify-content:center;position:relative;}
  /* The sign-in screen's icons (React, Tabler svgs) take the size their rules set as font-size. */
  .login-left svg.tabler-icon,.login-card svg.tabler-icon{width:1em;height:1em;flex-shrink:0;}
  .login-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .login-spot{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(520px circle at var(--mx,30%) var(--my,30%),rgba(79,142,247,.16),transparent 60%);transition:background .1s;}
  .login-left,.login-card{position:relative;z-index:1;}
  .login-floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .login-floaters svg{position:absolute;font-size:64px;color:rgba(var(--tint),.045);animation:loginDrift 24s ease-in-out infinite alternate;}
  .login-floaters .f1{top:8%;left:6%;} .login-floaters .f2{top:14%;right:8%;animation-duration:28s;font-size:80px;}
  .login-floaters .f3{bottom:12%;left:10%;animation-duration:31s;} .login-floaters .f4{bottom:6%;right:14%;animation-duration:26s;font-size:72px;}
  .login-floaters .f5{top:46%;left:2%;animation-duration:34s;font-size:56px;} .login-floaters .f6{top:40%;right:3%;animation-duration:29s;font-size:52px;}
  @keyframes loginDrift{0%{transform:translate(0,0) rotate(-6deg)}100%{transform:translate(30px,-40px) rotate(8deg)}}
  .login-brand-name{background:linear-gradient(90deg,#fff 0%,#9fc0ff 30%,#6dd6a0 50%,#fff 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:loginShine 7s linear infinite;}
  @keyframes loginShine{0%{background-position:100% 0}100%{background-position:-120% 0}}
  .login-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;animation:loginFloat 18s ease-in-out infinite alternate;}
  .login-blob.b1{width:420px;height:420px;background:#3b6fe0;top:-120px;left:-80px;}
  .login-blob.b2{width:360px;height:360px;background:#2fae7a;bottom:-140px;right:-60px;animation-duration:22s;}
  .login-blob.b3{width:260px;height:260px;background:#e0913b;top:40%;left:45%;opacity:.22;animation-duration:26s;}
  @keyframes loginFloat{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}100%{transform:translate(-40px,70px) scale(.95)}}
  .login-hero-inner{position:relative;max-width:620px;width:100%;}
  .login-brand{font-size:46px;font-weight:800;letter-spacing:-1px;color:var(--ink);display:flex;align-items:center;gap:12px;}
  .login-brand svg{font-size:42px;color:var(--accent);}
  .login-tagline{margin-top:4px;font-size:24px;font-weight:700;min-height:1.4em;}
  .login-rotator{display:inline-block;background:linear-gradient(90deg,#8fb6ff,#6dd6a0);-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .35s,transform .35s;}
  .login-rotator.out{opacity:0;transform:translateY(-10px);}
  .login-desc{margin-top:12px;font-size:15px;line-height:1.6;color:#b9bfd3;}
  .login-sectors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px;}
  .login-sector{position:relative;overflow:hidden;font:inherit;cursor:pointer;background:rgba(var(--tint),.05);border:1px solid rgba(var(--tint),.1);border-radius:14px;padding:14px 8px;text-align:center;color:#e6e9f5;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;}
  .login-sector svg{font-size:28px;color:var(--green);transition:transform .25s;}
  .login-sector:hover{transform:translateY(-3px);border-color:rgba(109,214,160,.45);}
  .login-sector.active{background:rgba(109,214,160,.12);border-color:#6dd6a0;box-shadow:0 8px 28px rgba(109,214,160,.18);transform:translateY(-3px);}
  .login-sector.active svg{transform:scale(1.15);}
  .login-roles{margin-top:14px;min-height:34px;display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:8px;}
  .login-pay{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;animation:loginPop .5s .3s both;}
  .login-pay-label{font-size:13px;color:#9aa1b8;display:inline-flex;align-items:center;gap:5px;}
  /* Payment badges: the payment apps' own marks in our dark-glass chip. */
  .pay-badge{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 4px;border-radius:10px;background:rgba(var(--tint),.06);border:1px solid rgba(var(--tint),.12);color:#e6e9f5;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .2s,border-color .2s;}
  .pay-badge:hover{transform:translateY(-2px);border-color:rgba(var(--tint),.3);}
  .pay-ico{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;}
  .pay-ico.gpay{background:#fff;}
  .pay-ico.gpay b{font:800 16px/1 Arial,sans-serif;background:conic-gradient(from -45deg,#ea4335 0 25%,#4285f4 0 50%,#34a853 0 75%,#fbbc05 0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .pay-ico.paybox{background:#0a8fd8;}
  .pay-ico.bit{background:#062b2f;color:#42d3cc;font:700 13.5px/1 'Varela Round','Nunito',Arial,sans-serif;letter-spacing:-.2px;text-transform:lowercase;}
  .pay-ico.bank{background:#2f4f7f;font-size:16px;}
  .pay-ico.invoice{background:#6b5bd2;font-size:16px;}
  .login-role{font-size:13px;color:#dfe5f5;background:rgba(79,142,247,.14);border:1px solid rgba(79,142,247,.3);border-radius:100px;padding:6px 12px;animation:loginPop .4s both;}
  @keyframes loginPop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  .login-left{flex:1 1 58%;display:flex;flex-direction:column;justify-content:safe center;position:relative;padding:36px 40px;}
  .login-features{position:relative;max-width:620px;width:100%;margin:0 auto;}
  .login-features-title{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue-text);margin:22px 0 10px;}
  .login-feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .login-feature{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(var(--tint),.04);border:1px solid rgba(var(--tint),.08);animation:loginPop .6s both;transition:transform .25s,border-color .25s,background .25s;}
  .login-feature::after,.login-sector::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(180px circle at var(--cx,50%) var(--cy,50%),rgba(109,214,160,.18),transparent 70%);}
  .login-feature:hover::after,.login-sector:hover::after{opacity:1;}
  .login-feature:hover{transform:translateY(-2px);border-color:rgba(79,142,247,.45);background:rgba(79,142,247,.08);}
  .login-feature:nth-child(2){animation-delay:.1s} .login-feature:nth-child(3){animation-delay:.2s} .login-feature:nth-child(4){animation-delay:.3s} .login-feature:nth-child(5){animation-delay:.4s}
  .login-feature:last-child{grid-column:1 / -1;}
  .login-feature svg{font-size:24px;color:var(--accent);flex-shrink:0;margin-top:1px;}
  .login-feature b{display:block;color:#eef0f8;font-size:14px;margin-bottom:2px;}
  .login-feature span{display:block;color:#9aa1b8;font-size:12.5px;line-height:1.45;}
  .login-card{flex:0 0 400px;display:flex;flex-direction:column;justify-content:center;padding:40px 36px;background:rgba(20,24,36,.72);border-left:1px solid rgba(var(--tint),.08);backdrop-filter:blur(14px);box-shadow:-30px 0 80px rgba(0,0,0,.35);}
  .login-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,#4f8ef7,#6dd6a0,transparent);background-size:100% 200%;animation:loginEdge 6s linear infinite;opacity:.8;}
  @keyframes loginEdge{0%{background-position:0 100%}100%{background-position:0 -100%}}
  .login-card #loginBtn{background:linear-gradient(90deg,#4f8ef7,#3fb98a);border:0;box-shadow:0 8px 24px rgba(79,142,247,.3);transition:transform .2s,box-shadow .2s;}
  .login-card #loginBtn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(79,142,247,.45);}
  /* The sign-in card never leaves the screen (user request 2026-10-12): on a
     computer the right column stays in view while the showcase scrolls; on a
     phone a compact card (the two fields side by side, the button under
     them) floats at the bottom of the screen and the page scrolls under it. */
  .login-card{position:sticky;top:0;align-self:flex-start;min-height:100vh;min-height:100dvh;z-index:3;}
  @media (max-width: 820px){
    .login-screen{flex-direction:column;justify-content:flex-start;}
    .login-left{display:contents;}
    .login-floaters svg{font-size:44px;}
    .login-card{box-shadow:none;}
    .login-card::before{display:none;}
    .login-hero{order:1;padding:56px 20px 18px;position:relative;}
    .login-card{order:2;}
    .login-features{order:3;padding:6px 20px 32px;}
    .login-features-title{margin-top:14px;}
    .login-feature-grid{grid-template-columns:1fr;}
    .login-brand{font-size:32px;} .login-brand svg{font-size:30px;}
    .login-tagline{font-size:19px;} .login-desc{font-size:14px;}
    .login-sectors{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;}
    .login-sector{padding:10px 4px;font-size:11px;} .login-sector svg{font-size:22px;}
    .login-card{flex:none;border-left:0;border-top:1px solid rgba(var(--tint),.08);padding:24px 20px 32px;}
    .login-screen{padding-bottom:170px;}
    .login-card{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;min-height:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border:1px solid rgba(var(--tint),.12);border-radius:18px;background:rgba(18,22,34,.94);box-shadow:0 14px 40px rgba(0,0,0,.55);}
    .login-card>div:first-child{display:none;}
    .login-card .field{margin:0;}
    .login-card .field label{display:none;}
    .login-card #loginError{grid-column:1/-1;margin:0!important;min-height:0!important;}
    .login-card #loginError:empty{display:none;}
    .login-card #loginBtn{grid-column:1/-1;justify-content:center;}
  }
  /* Sign-in (redesign stage 11): a compact glass card over the site — pinned
     to the bottom right on a computer, to the bottom on a phone; the showcase
     scrolls under it. */
  .login-card{position:fixed !important;top:auto !important;right:24px;bottom:24px;left:auto;width:380px;min-height:0 !important;flex:none;display:block;padding:20px 20px 18px;border:1px solid rgba(var(--tint),.22) !important;border-radius:22px;background:rgba(17,20,31,.72) !important;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.5) !important;z-index:5}
  .login-card::before{display:none}
  .login-card #loginBtn{background:rgba(var(--tint),.28);box-shadow:0 8px 24px rgba(0,0,0,.25);height:44px}
  .login-card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .login-card-h .og-mark{width:40px;height:40px;flex:none}
  .login-card-h h3{font-size:19px;font-weight:700}
  .login-card-h p{font-size:12px;color:var(--text2);margin-top:2px}
  @media (min-width: 821px){ .login-left{padding-right:420px} }
  @media (max-width: 820px){
    .login-card{left:10px;right:10px;width:auto;display:grid;padding:12px;border-radius:18px}
    .login-card .login-card-h{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .login-blob,.login-role,.login-feature,.login-floaters svg,.login-brand-name,.login-card::before{animation:none;} .login-fx{display:none;} .login-rotator,.login-sector{transition:none;} }

  /* Layout */

  /* Main */
  /* The page area: the React frame's Shell gives it its padding and width. */
  .main{padding:0;}
  .page-section{display:none;}
  .page-section.visible{display:block;}

  /* Buttons */
  .btn{touch-action:manipulation;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:15px;font-family:'DM Sans','Heebo',Arial,sans-serif;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text);text-decoration:none;transition:all 0.15s;}
  .btn:hover{background:var(--bg2);}
  .btn:active{transform:scale(0.98);}
  .btn.accent{background:var(--accent);border-color:var(--accent2);color:#fff;}
  .btn.accent:hover{background:var(--accent2);}
  .btn.red{background:var(--red-bg);border-color:rgba(248,113,113,0.3);color:var(--red);}
  .btn.sm{padding:5px 10px;font-size:14px;}

  /* Modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center;}
  .overlay.open{display:flex;}
  @media (pointer:coarse){ #workerCardModal{-webkit-touch-callout:none;} }
  /* the worker card: its middle scrolls, its bottom bar (Saved, Edit, ⋮) stays at the bottom of the window */
  #workerCardModal{display:flex;flex-direction:column}
  .modal{background:var(--bg2);background-image:var(--sheet-grad);border:1px solid var(--border2);border-radius:14px;padding:24px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto;}
  /* The app's template (variant 3, user request 2026-10-11): rows whose state
     is a colored line on the left (.t3-line, --c); on a phone a window opens
     from the bottom (a sheet). */
  .t3-line{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-left:3px solid var(--c,var(--border2));background:linear-gradient(90deg,rgba(var(--tint),.035),transparent 85%);border-radius:0 8px 8px 0;margin-bottom:4px;font-size:13px;cursor:pointer}
  .t3-line:hover{background:linear-gradient(90deg,rgba(var(--tint),.06),transparent 85%)}
  .t3-line .n{flex:1;min-width:0}
  .t3-line .n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t3-line .n small{display:block;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t3-line .r{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);white-space:nowrap}
  .t3-empty{color:var(--text3);font-size:13px;padding:6px 2px 4px}
  @media (max-width:700px){
    .overlay{align-items:flex-end}
    .overlay>.modal{width:100% !important;max-width:100% !important;max-height:88vh;border-radius:18px 18px 0 0;border-bottom:0;padding:14px 16px 20px}
    .overlay>.modal::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 12px}
  }
  .modal-title{font-size:19px;font-weight:600;color:var(--text);margin-bottom:18px;letter-spacing:-0.3px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14px;color:var(--text2);margin-bottom:5px;font-weight:500;}
  .field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:15px;font-family:'DM Sans','Heebo',Arial,sans-serif;padding:8px 10px;outline:none;transition:border-color 0.15s;}
  .field input:focus,.field select:focus{border-color:var(--accent);}
  /* A heading that splits a longer form (the pay window). */
  .form-section{margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--border2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);}
  .form-section:first-of-type{margin-top:4px;padding-top:0;border-top:none;}
  .modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;}

  /* Scrollbar */
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px;}

  /* Toast */
  .toast{position:fixed;bottom:16px;right:16px;transform:translateY(8px);display:flex;align-items:center;gap:8px;max-width:min(340px,calc(100vw - 32px));box-sizing:border-box;background:var(--bg2,#181c27);border:1px solid var(--border2);border-left:3px solid var(--green);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;line-height:1.35;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:3700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast i{font-size:16px;color:var(--green);flex-shrink:0;}
  .toast.warn{border-left-color:var(--amber);} .toast.warn i{color:var(--amber);}
  .toast.err{border-left-color:var(--red);} .toast.err i{color:var(--red);}
  .toast.info{border-left-color:var(--blue,#60a5fa);} .toast.info i{color:var(--blue,#60a5fa);}
  input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);}
  /* ── Mobile Responsive ────────────────────────────────────────── */
  /* ═══════════════════════════════════════════════════
     MOBILE — tablet 768px and phone 480px
     ═══════════════════════════════════════════════════ */
  @media (max-width: 768px) {

    /* ── Layout ── */
    body { overflow-y: auto; height: auto; min-height: 100vh; }

    /* ── Titlebar ── */
    .btn.sm { font-size: 11px; padding: 5px 10px; min-height: 34px; }

    /* ── Main ── */

    /* ── Modals — full screen bottom sheet ── */
    .overlay { align-items: flex-end; }
    .modal {
      width: 100%; max-width: 100%; border-radius: 18px 18px 0 0;
      padding: 20px 16px env(safe-area-inset-bottom,16px);
      /* A free strip above the sheet: a tap there (the backdrop) closes it.
         dvh = the visible height, without the browser's address bar. */
      max-height: calc(100vh - 72px); max-height: calc(100dvh - 72px); margin: 0;
    }
    .modal-title { font-size: 16px; }
    .modal-actions { gap: 8px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; justify-content: center; min-height: 42px; }

    /* ── Buttons ── */
    .btn { min-height: 36px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  }

  /* ── Loading spinner (Form 101 generation, uploads) ── */
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  /* Admin in the template (variant 3): a line wraps its text when the whole
     message matters (errors); a small icon button at a line's right (copy). */
  .t3-line.wrap .n b,.t3-line.wrap .n small{white-space:normal;word-break:break-word}
  .t3-ib{background:none;border:0;color:var(--text3);font-size:15px;cursor:pointer;padding:4px 6px;flex:none}
  .t3-ib:hover{color:var(--text)}
  .t3-line.off{opacity:.6}

  /* ── Phone (≤ 700 px): the tabs become a bar at the bottom of the screen,
     and the tables of Admin (Errors, Timings) become one card per row
     (cardTables() puts each column's header on its cells as data-label). ── */
  @media (max-width:700px){
    /* The bottom bar is the React frame's (Shell): the toast and the
       bottom-bar gap stay above it. */
    .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px));}
    :root{--bar-gap:calc(76px + env(safe-area-inset-bottom,0px));}
    table.mtable{min-width:0 !important;border-collapse:separate !important;}
    table.mtable thead{display:none;}
    table.mtable,table.mtable tbody,table.mtable tfoot,table.mtable tr,table.mtable td{display:block;width:100%;box-sizing:border-box;}
    table.mtable tr{background:var(--bg2);border:1px solid var(--border2) !important;border-radius:12px;margin:0 0 10px;padding:6px 12px;}
    table.mtable td{display:flex;justify-content:flex-end;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:5px 0 !important;border:0 !important;text-align:right !important;min-height:28px;}
    table.mtable td::before{content:attr(data-label);color:var(--text3);font-size:12px;font-weight:500;text-align:left;flex-shrink:0;margin-right:auto;}
    table.mtable td:first-child{font-weight:600;font-size:15px;justify-content:flex-start;text-align:left !important;}
    table.mtable td:first-child::before{display:none;}
    table.mtable td:empty{display:none;}
    table.mtable td[colspan]{justify-content:center;}
    table.mtable td[colspan]::before{display:none;}
  }
  .site{overflow:hidden;text-overflow:ellipsis}
  .dot{color:#4a5068}
  .pin{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .pin i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pin.ok{color:var(--ok)}.pin.bad{color:var(--red-text)}.pin.vac{color:var(--warn)}
  tr.gone{display:none}
  /* Greeting (Today) and the notifications bell + panel (redesign stage 5). */
  .og-greet{margin:0 2px 14px}
  .og-greet:empty{display:none}
  .og-greet h3{font-size:21px;font-weight:700;letter-spacing:-.2px}
  .gic{display:inline-block;width:30px;height:30px;margin-left:8px;vertical-align:-6px;overflow:visible}
  .gic .rise{animation:gic-rise 4s ease-in-out infinite}
  @keyframes gic-rise{0%,100%{transform:translateY(2px)}50%{transform:translateY(-2px)}}
  .gic .spin{transform-origin:16px 16px;animation:gic-spin 14s linear infinite}
  @keyframes gic-spin{to{transform:rotate(360deg)}}
  .gic .pulse{transform-origin:16px 16px;animation:gic-pulse 3s ease-in-out infinite}
  @keyframes gic-pulse{50%{transform:scale(1.08)}}
  .gic .sink{animation:gic-sink 5s ease-in-out infinite}
  @keyframes gic-sink{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  .gic .moon{animation:gic-moon 4s ease-in-out infinite}
  @keyframes gic-moon{50%{transform:translateY(-2px) rotate(-6deg)}}
  .gic .tw{transform-box:fill-box;transform-origin:center;animation:gic-tw 2.4s ease-in-out infinite}.gic .tw2{animation-delay:1.2s}
  @keyframes gic-tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.6)}}
  /* weather icons (stage 12) */
  .gtemp{font-size:.78em;font-weight:600;color:var(--text2);margin-left:6px;vertical-align:1px}
  .gic .drift{animation:gic-drift 6s ease-in-out infinite}.gic .drift.d2{animation-duration:8s;animation-direction:reverse}
  @keyframes gic-drift{0%,100%{transform:translateX(-1px)}50%{transform:translateX(1.5px)}}
  .gic .drop{animation:gic-drop 1.1s linear infinite}.gic .flake{animation:gic-flake 2.4s linear infinite}
  .gic .d2{animation-delay:.35s}.gic .d3{animation-delay:.7s}.gic .flake.d2{animation-delay:.8s}.gic .flake.d3{animation-delay:1.6s}
  @keyframes gic-drop{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(4px);opacity:0}}
  @keyframes gic-flake{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(5px);opacity:0}}
  .gic .bolt{animation:gic-bolt 2.6s ease-in-out infinite}
  @keyframes gic-bolt{0%,40%,100%{opacity:.25}45%,55%{opacity:1}50%{opacity:.4}}
  .gic .fogl{animation:gic-fog 5s ease-in-out infinite}
  @keyframes gic-fog{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
  /* the bell's list in the windows' glass, as every menu (og-glass-menu = og-glass-sheet, owner 2026-10-26); its tail in the same fill and frame */
  .og-npop{position:fixed;z-index:4000;width:min(340px,calc(100vw - 16px));max-height:min(480px,70vh);overflow:auto;padding:8px;border-radius:18px;background:var(--glass-sheet);background-image:var(--sheet-grad);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-edge);box-shadow:var(--shadow-pop);opacity:0;transform:translateY(-6px) scale(.97);transition:opacity .18s,transform .18s}
  .og-npop.open{opacity:1;transform:none;overflow:visible}
  .og-npop-list{max-height:min(420px,62vh);overflow:auto}
  .og-npop::before{content:'';position:absolute;top:-7px;left:var(--px,14px);width:12px;height:12px;background:var(--plate-top);border-left:1px solid var(--glass-edge);border-top:1px solid var(--glass-edge);border-radius:2px 0 0 0;transform:rotate(45deg)}
  .og-npop h5{display:flex;align-items:center;font-size:13px;padding:6px 8px 8px}
  .og-npop-all{margin-left:auto;border:0;background:none;color:var(--fig);font:600 12px 'DM Sans','Heebo',Arial,sans-serif;cursor:pointer}
  .og-ni{display:flex;gap:10px;width:100%;padding:9px 8px;border:0;border-radius:12px;background:none;color:var(--text);align-items:flex-start;text-align:left;cursor:pointer;font-family:inherit}
  .og-ni:hover{background:rgba(var(--tint),.06)}
  .og-ni .ic{width:30px;height:30px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  .og-ni .tx{flex:1;min-width:0;font-size:13px}
  .og-ni .tx b{display:block;font-weight:600}
  .og-ni .tx small{display:block;font-size:11px;color:#8b90a0;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .og-ni time{font-size:10px;color:#8b90a0;flex:none}
  .og-ni-acts{display:flex;gap:6px;padding:0 8px 8px 48px}
  .gbtn.nact.wa i{color:#25d366}
  .og-ni.new time::after{content:'';display:block;width:7px;height:7px;border-radius:50%;background:#22d3ee;margin:6px 0 0 auto;box-shadow:0 0 8px #22d3ee}
  @media (prefers-reduced-motion:reduce){.gic *,.og-bell i,.og-bell-n{animation:none !important}}
  .seg button.on::after{content:'';position:absolute;left:30%;right:30%;bottom:2px;height:2px;border-radius:2px;background:var(--uline);background-size:300% 100%;animation:og-flow 2.4s linear infinite,og-pop .5s cubic-bezier(.34,1.56,.64,1)}
  .gbtn.nact{height:32px;padding:0 10px;font-size:12px;border-radius:12px;flex:none}

/* Hebrew has no capitals: no letter-spacing (made for spaced-out uppercase Latin). */
html[lang="he"] *{letter-spacing:normal !important;}

/* A window open: the page behind it does not scroll, and a scroll inside the
   window never carries over to the page (swipe down closes it on a phone). */
body:has(.overlay.open){overflow:hidden}
.overlay,.overlay>.modal{overscroll-behavior:contain}

<style>
  /* Odinson Glass form fields (mockup 04, owner 2026-10-13): every field in a
     window is a soft rounded glass box — 38px tall, 12px corners, a faint fill
     and hairline, a cyan focus ring; selects carry a thin chevron; labels are
     small and muted (the map picker). */
  .modal .field label:not(.check-chip):not([style]){font-size:14px;font-weight:500;color:#8b90a0;margin:0 4px 4px}
  .modal .field input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]),.modal .field select,.modal .field textarea{
    height:38px;padding:0 12px;border-radius:12px;border:1px solid rgba(var(--tint),.12);background-color:rgba(var(--tint),.05);color:var(--text);font-size:14px;
    box-shadow:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
  .modal .field textarea{height:auto;min-height:84px;padding:10px 12px;line-height:1.45}
  .modal .field select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#8b90a0 50%),linear-gradient(135deg,#8b90a0 50%,transparent 50%);
    background-position:calc(100% - 19px) 16px,calc(100% - 14px) 16px;background-size:5px 5px;background-repeat:no-repeat}
  .modal [dir=rtl] .field select,.modal .field select[dir=rtl]{padding-right:14px;padding-left:36px;background-position:14px 16px,19px 16px}
  .modal .field input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]):focus,.modal .field select:focus,.modal .field textarea:focus{
    outline:none;border-color:rgba(34,211,238,.6);background-color:rgba(var(--tint),.07);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
  .modal .field input::placeholder,.modal .field textarea::placeholder{color:rgba(var(--tint),.35)}
  .modal .field input:disabled,.modal .field select:disabled{opacity:.55}
  /* Inline old-style fields inside any window (style="background:var(--bg3)…") follow the glass look too. */
  .modal input:is([type=text],[type=number],[type=date],[type=time],[type=tel],[type=email],[type=password],[type=search],[type=url],:not([type])),.modal select,.modal textarea{
    background-color:rgba(var(--tint),.05) !important;border:1px solid rgba(var(--tint),.12) !important;border-radius:12px !important;color:var(--text) !important;font-size:14px !important;box-shadow:none}
  .modal input:is([type=text],[type=number],[type=date],[type=time],[type=tel],[type=email],[type=password],[type=search],[type=url],:not([type])),.modal select{height:38px !important;padding-top:0 !important;padding-bottom:0 !important}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:rgba(34,211,238,.6) !important;box-shadow:0 0 0 3px rgba(34,211,238,.12) !important;outline:none}
  .modal .field>label i.ti{display:none}
  .modal input[type=date]{color-scheme:dark}
</style>

<style>
  /* ── The page area inside the React frame (stage 8e-1, src/manager/Frame.tsx —

  .page-section.visible{animation:og-tab-in .15s ease-out}

    .main>.page-section{max-width:1200px;margin-left:auto;margin-right:auto}
  }
  /* Hebrew mirrors the frame only (the React Shell does it); the Language

  html[lang=he] .lang-btn{direction:ltr}
  /* ── The light theme (docs/redesign.md → Light theme; the tokens are in

<body>

<!-- The frame — title bar, side menu / bottom bar, bell, Language button,
     account — is React (src/manager/Frame.tsx, the Shell with `app`; React
     migration stage 8e-1). It moves the page's sections (#appMain) into its
     page area. -->
<div id="frameRoot" data-island></div>
<div class="main" id="appMain">
    <!-- Dashboard Section -->
    <!-- Today (stage 6a): drawn in React (src/manager/Today.tsx) through
         window.ManagerIsland — renderDashboard() below. -->
    <div class="page-section" id="sectionDashboard">
      <div id="todayRoot" data-island></div>
    </div>

    <!-- Schedule (stage 6b): drawn in React (src/manager/Schedule.tsx) through
         window.ManagerIsland — renderSchedulePage() below. -->
    <div class="page-section visible" id="sectionSchedule">
      <div id="scheduleRoot" data-island></div>
    </div>

    <!-- Workers (stage 6c-1): the list drawn in React (src/manager/Workers.tsx)
         through window.ManagerIsland — renderWorkersPage() below. The worker
         card, the worker window, documents and hours are still this page's. -->
    <div class="page-section" id="sectionWorkers">
      <div id="workersRoot" data-island></div>
    </div>

    <!-- Clients and Suppliers (stage 6d): drawn in React (src/manager/Clients.tsx)
         through window.ManagerIsland — renderClientsPage() / renderSuppliersPage().
         Their windows (ClientEditor.tsx, SupplierEditor.tsx, ManualPunch.tsx) are
         drawn into #clientModal, #supplierModal and #manualPunchModal below. -->
    <div class="page-section" id="sectionClients">
      <div id="clientsRoot" data-island></div>
    </div>

    <div class="page-section" id="sectionSuppliers">
      <div id="suppliersRoot" data-island></div>
    </div>

    <!-- Admin Section — merged 2026-09-30 with the formerly-separate
         #adminScreen gear-button panel (Firms/Users/Errors/Profile) into one
         set of sub-tabs here, replacing the header's gear button. See
         docs/history.md for why two "Admin" surfaces existed in the first place
         and setupAdminPaneBar()'s own comment for the merged role-gating. -->
    <div class="page-section" id="sectionAdmin">
      <!-- Stages 6f-1 / 6f-2: the section tabs, the tiles (no section chosen)
           and every section — Punch Log, Firms, Users, Errors, Timings — are
           drawn in React (src/manager/Admin.tsx) through window.ManagerIsland
           — renderAdmin(). -->
      <div id="adminRoot" data-island></div>
    </div>

    <!-- Accounting (stage 6e): drawn in React (src/manager/Accounting.tsx)
         through window.ManagerIsland — renderAccounting(); the pay window
         (PayWindow.tsx) is drawn into #payModal below. -->
    <div class="page-section" id="sectionAccounting">
      <div id="accountingRoot" data-island></div>
    </div>

    <!-- Commission and Hours (permissions plan, stage 2; an HR login): its
         own workers' pay and commission (the Accounting tab's Salary for its
         workers, src/manager/Accounting.tsx) and the hours review
         (src/hours-review/), drawn through renderCommission() / renderHours(). -->
    <div class="page-section" id="sectionCommission">
      <div id="commissionRoot" data-island></div>
    </div>
    <div class="page-section" id="sectionHours">
      <div id="hoursRoot" data-island></div>
    </div>
    <!-- A supplier or client login (permissions plan, stage 3): its portal's
         screens (src/manager/Portal.tsx) in this one section, whatever tab is
         open — renderPortal(). -->
    <div class="page-section" id="sectionPortal">
      <div id="portalRoot" data-island></div>
    </div>

  </div>

<!-- Modals -->
<div class="overlay" id="payOverlay">
  <div class="modal" id="payModal" style="width:460px"></div>
</div>
<!-- A worker's notices (a tap on a notice chip). -->
<div class="overlay" id="noticesOverlay">
  <div class="modal" id="noticesModal" style="width:440px"></div>
</div>
<div class="overlay" id="workerOverlay">
  <div class="modal" id="workerModal" style="width:680px"></div>
</div>
<div class="overlay" id="workerCardOverlay">
  <div class="modal" id="workerCardModal" style="width:540px"></div>
</div>
<div class="overlay" id="clientOverlay">
  <div class="modal" id="clientModal"></div>
</div>
<!-- The map picker (stage 8e-3): drawn in React (src/manager/MapPicker.tsx). -->
<div class="overlay" id="mapPickOverlay" style="z-index:110">
  <div class="modal" id="mapPickModal" style="max-width:640px;width:100%"></div>
</div>
<div class="overlay" id="supplierOverlay">
  <div class="modal" id="supplierModal"></div>
</div>
<div class="overlay" id="workerDocOverlay" style="z-index:960">
  <div class="modal" id="workerDocModal" style="max-width:420px"></div>
</div>
<div class="overlay" id="hoursImportOverlay">
  <div class="modal" id="hoursImportModal" style="max-width:440px"></div>
</div>
<div class="overlay" id="hoursExportOverlay">
  <div class="modal" id="hoursExportModal" style="max-width:360px"></div>
</div>

<!-- Manual Punch Modal -->
<div class="overlay" id="manualPunchOverlay">
  <div class="modal" id="manualPunchModal" style="max-width:440px"></div>
</div>

<!-- Login gate: full-screen, opaque, above everything else; drawn in React
     (src/manager/SignIn.tsx, stage 8e-2). Shown by JS at
     startup when there's no valid (non-expired) session; hides + the normal
     app init runs only after a successful login. -->
<div id="loginScreen" class="login-screen" style="display:none" data-island></div>

<!-- Super-admin landing screen: pick a firm to open, or create a new one.
     Shown instead of the normal app whenever a superadmin session has no
     viewingTenantId picked yet (see gateApp() / backToFirmsList()). -->
<div id="firmsScreen" class="og-cover" style="display:none;position:fixed;inset:0;z-index:900;overflow-y:auto">
  <div style="max-width:720px;margin:0 auto;padding:28px 20px">
    <!-- Stages 6f-2 / 8e-2: the header and the firms are drawn in React (src/manager/Firms.tsx, FirmsScreen). -->
    <div id="firmsScreenRoot" data-island></div>
  </div>
</div>

<!-- The user window, "Add workers" and the firm window (stage 6f-2) are
     drawn in React (src/manager/Users.tsx, Firms.tsx) into these overlays'
     modals, which the page opens and closes (so they stack and go back to the
     window they were opened from with the page's other windows). -->
<div class="overlay" id="userFormOverlay" style="z-index:980">
  <div class="modal" id="userFormModal" style="max-width:480px"></div>
</div>
<div class="overlay" id="hrAssignOverlay" style="z-index:990">
  <div class="modal" id="hrAssignModal" style="max-width:440px"></div>
</div>
<div class="overlay" id="editFirmOverlay" style="z-index:950">
  <div class="modal" id="firmModal" style="max-width:420px"></div>
</div>

<div class="toast" id="toast"></div>

<!-- The page's own script, the data layer and the React pieces: one module
     built by Vite (src/manager/page/entry.ts; docs/build.md → The manager app). -->
<script type="module" src="/src/manager/page/entry.ts"></script>
<!-- The manager's React pieces (src/manager/, built by npm run build): now the Today tab. -->
</body>
