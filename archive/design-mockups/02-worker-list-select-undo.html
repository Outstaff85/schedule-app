<title>Glass Plates Ticks</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--text:#fff;--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.4);--green:#6dd6a0;--red:#ff8a95;--plate:#1b1e29}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07080c;color:var(--text);font:14px 'DM Sans',Arial,sans-serif;padding:24px 16px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}.lead{color:#8b90a0;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;max-width:1480px}
.cap{font-size:13px;color:#8b90a0;margin:0 0 8px 4px}.cap b{color:#e8eaf0;font-size:15px;margin-right:6px}
.ph{position:relative;border-radius:26px;padding:18px 14px;overflow:clip;min-height:680px;user-select:none;border:1px solid rgba(255,255,255,.1);
 background:radial-gradient(circle at 15% 10%,rgba(79,70,229,.50) 0,transparent 56%),radial-gradient(circle at 92% 62%,rgba(6,182,212,.36) 0,transparent 54%),radial-gradient(circle at 40% 108%,rgba(219,39,119,.34) 0,transparent 56%),#10141f}

.g:hover::after,.g.shine::after{left:130%}
.g::before{content:'';position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:#fff;transform:scaleX(0);transition:transform .25s}

.top h2 em{font-style:normal;font-size:14px;color:var(--t2);margin-left:6px;font-weight:500}

.av{background:var(--a,#6e5a9e)}

.sel .cb{width:26px;margin-right:0}

.sel .kb{opacity:0;pointer-events:none}
.sbar{position:absolute;left:14px;right:14px;bottom:16px;z-index:24;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:18px;background:rgba(30,35,51,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.24);box-shadow:0 12px 30px rgba(0,0,0,.4);transform:translateY(160%);transition:transform .3s cubic-bezier(.3,.7,.3,1)}
.sel .sbar{transform:none}
.sbar b{flex:1;font-size:14px;white-space:nowrap}
.sbar .g{height:38px;padding:0 12px;font-size:13px}.sbar .g.i{width:38px;padding:0}
.selhead{display:none;align-items:center;gap:8px;margin:-4px 2px 8px;font-size:13px;color:var(--t2)}
.sel .selhead{display:flex}.selhead button{border:0;background:none;color:#fff;font:600 13px 'DM Sans',Arial;cursor:pointer;border-bottom:2px solid #fff;padding:2px 0}
.selhead span{flex:1}

/* colored animated underline */
:root{--uline:linear-gradient(90deg,#818cf8,#22d3ee,#f472b6,#818cf8)}
@keyframes flow{to{background-position:300% 0}}
@keyframes pop{0%{transform:scaleX(0)}60%{transform:scaleX(1.12)}100%{transform:scaleX(1)}}
.g::before,.tabs .ind::after,.kb::after,.snack .u::after,.snack .bar{background:var(--uline)!important;background-size:300% 100%!important;animation:flow 2.4s linear infinite}

.tabs .ind::after{animation:flow 2.4s linear infinite,pop .5s cubic-bezier(.34,1.56,.64,1)}
.tabs .ind.moved::after{animation:flow 2.4s linear infinite,pop .5s cubic-bezier(.34,1.56,.64,1)}
.selhead button{border:0!important;padding-bottom:4px!important;position:relative}
.selhead button::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--uline);background-size:300% 100%;animation:flow 2.4s linear infinite}
.snack .u::after{height:2px}
.snack .bar{height:3px;box-shadow:0 0 8px rgba(34,211,238,.5)}
.snack.open .bar{animation:flow 2.4s linear infinite,shr 5s linear forwards}
.it:hover::before{background:var(--uline)!important;background-size:100% 300%!important;width:3px!important}

.nl{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}

.chip{flex:none;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px 0 5px;border-radius:999px;border:0;font:600 11px 'DM Sans',Arial;cursor:pointer;white-space:nowrap;position:relative}
.chip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.chip.red{background:rgba(255,95,109,.16);color:#ff9aa4}.chip.amber{background:rgba(245,166,35,.15);color:#f7c062}.chip.more{background:rgba(255,255,255,.1);color:#cfd3dd;padding:0 7px}
.chip::after{content:'';position:absolute;left:6px;right:6px;bottom:-3px;height:2px;border-radius:2px;background:var(--uline);background-size:300% 100%;animation:flow 2.4s linear infinite;transform:scaleX(0);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.chip:hover::after{transform:scaleX(1)}
.n small{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.site{overflow:hidden;text-overflow:ellipsis}.dot{color:#4a5068}
.pin{display:inline-flex;align-items:center;gap:4px}.pin i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pin.ok{color:#6dd6a0}.pin.bad{color:#ff8a95}
.rt{display:flex;flex-direction:row;align-items:center;gap:6px;margin-right:-2px}
.hrs{position:relative;font:700 15px 'DM Mono',monospace;padding:0 2px 0 6px}
.hrs>*{-webkit-text-fill-color:initial}
.hrs{color:#a5f3fc}
.hrs:not(:has(*)){background-clip:padding-box}
.hrs .t{color:#9fe6c0;text-shadow:0 0 12px rgba(109,214,160,.22)}
.hrs:empty{display:none}
.hrs:has(.st){background:none;border:0;padding:0}
.rt .kb{height:36px;width:26px;border:0;background:none;color:#d6d9e2;font-size:22px;font-weight:400;line-height:1;display:flex;align-items:center;justify-content:center}
.rt .kb:hover{background:none;color:#fff}
.nsheet{position:absolute;left:0;right:0;bottom:0;z-index:21;padding:10px 16px 20px;border-radius:22px 22px 0 0;background:rgba(17,20,31,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.2);transform:translateY(105%);transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.nsheet.open{transform:none}
.nsheet::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:0 auto 12px}
.nh{display:flex;align-items:center;gap:12px}.nh h4{font-size:17px}.nh p{font-size:12px;color:var(--t2);margin-top:2px}.nh>div:nth-child(2){flex:1}
.av.big{width:48px;height:48px;font-size:16px}
.nhrs{font:600 20px 'DM Mono',monospace}.nhrs small{display:block;font:11px 'DM Sans',Arial,sans-serif;color:var(--t2);text-align:right}

.pl .av{background:color-mix(in srgb,var(--c) 22%,#1b1e29)!important;color:var(--c)!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,transparent)}

<script>
const I={e:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',

l:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>',

 ['Avi Cohen','AC','#ff5f6d','Site A',['in','07:58'],'182h','#3f7f6a',[['red','id','Visa','Visa expires 02/11 · 21 days','Renew'],['amber','doc','Docs','Passport copy missing','Upload']]],

const short=n=>{const p=n.trim().split(/\s+/);return p.length<2?n:p[0]+' '+p.slice(1).map(x=>x[0].toUpperCase()+'.').join(' ')};

const chips=x=>{const n=x[7];if(!n.length)return '';const f=n.slice(0,1).map(c=>`<button class="chip ${c[0]}" data-n>${NI[c[0]]}${c[2]}</button>`).join('');return f+(n.length>1?`<button class="chip more" data-n>+${n.length-1}</button>`:'')};
const tick=(t,on,w)=>`<button class="tk${on?' on':''}${w?' w':''}"><span class="box">${I.ck}</span>${t}</button>`;
const S=[['A','List: short name, notices, site and punch, hours'],['B','Tap a notice → notices sheet'],['C','Select mode'],['D','⋮ in the header']];
const g=document.getElementById('g');
S.forEach(([n,t])=>{const w=document.createElement('div');
w.innerHTML=`<div class="cap"><b>${n}</b>${t}</div><div class="ph s${n}">
 <div class="top"><h2>Workers<em>24</em></h2><button class="g p new">${I.p}New</button><button class="g i" data-hm>⋮</button></div>
 <div class="tabs"><div class="ind"></div><button class="on">Active</button><button>Vacation</button><button>Pending</button></div>
 <div class="sec">Workers <em class="cnt">6</em></div>
 <div class="selhead"><span class="scount">0 selected</span><button data-all>Select all</button></div>
 <div class="list">${W.map((x,k)=>`<div class="sw" data-k="${k}"><div class="acts"><button class="e">${I.e}Edit</button><button class="d">${I.d}Delete</button></div>
  <div class="pl" style="--c:${x[2]};--a:${x[6]}"><span class="cb"><span class="box">${I.ck}</span></span><div class="av">${x[1]}</div><div class="n"><div class="nl"><b title="${x[0]}">${short(x[0])}</b>${chips(x)}</div><small><span class="site">${x[3]}</span><span class="dot">·</span>${PIN[x[4][0]](x[4][1])}</small></div><div class="rt"><span class="hrs"><span class="t">${x[5]}</span></span><button class="kb">⋮</button></div></div></div>`).join('')}</div>
 <div class="hint">tap a plate — card · a notice — notices sheet · swipe ← Edit / Delete</div>
 <div class="pop rowm"><button class="it" data-a="e">${I.e}Edit</button><button class="it" data-a="perm">${I.k}Access</button><button class="it">${I.l}Punch link</button><button class="it">${I.a}Archive</button><div class="hr"></div><button class="it del" data-del>${I.d}Delete</button></div>
 <div class="pop headm"><button class="it">${I.sc}Scan passport</button><button class="it">${I.s}Search</button><button class="it">${I.x}Export</button><button class="it">${I.pr}Print</button><button class="it" data-select>${I.sq}Select…</button></div>
 <div class="sbar"><b class="scount2">0</b><button class="g i" title="Export">${I.x}</button><button class="g i" title="Print">${I.pr}</button><button class="g d" data-bulkdel>${I.d}Delete</button><button class="g i" data-done>${I.cl}</button></div>
 <div class="shade"></div><div class="sheet"><h4 class="sh-t">Dana Levi</h4><p>Hours access</p>
  <div class="sec" style="margin-top:8px">Ticks</div><div class="ticks">${tick('Hours',1)}${tick('Approve',1)}${tick('Dispute',0)}</div>
  <div class="sec">More</div><div class="ticks">${tick('Fix',1)}${tick('Export',0)}</div>
  <div class="sec">In a window</div><div class="ticks">${tick('Only own workers',1,1)}</div>
  <div class="row"><button class="g p">${I.k}Approve the month</button><button class="g" style="flex:none">${I.x}Excel</button></div></div>
 <div class="nsheet"><div class="nh"><div class="av big"></div><div><h4 class="nn"></h4><p class="ns"></p></div><span class="nhrs"></span></div>
  <div class="sec" style="margin-top:12px">Notices <em class="ncnt"></em></div><div class="nlist"></div>
  <div class="row"><button class="g p">${I.e}Open worker card</button></div></div>
 <div class="snack"><span></span><button class="u">Undo</button><div class="bar"></div></div></div>`;
g.appendChild(w);setup(w.querySelector('.ph'));});
function setup(ph){
 const tabs=ph.querySelector('.tabs'),ind=tabs.querySelector('.ind');const place=b=>{ind.style.left=b.offsetLeft+'px';ind.style.width=b.offsetWidth+'px'};
 tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{tabs.querySelector('.on').classList.remove('on');b.classList.add('on');place(b);ind.classList.remove('moved');void ind.offsetWidth;ind.classList.add('moved')});
 requestAnimationFrame(()=>place(tabs.querySelector('.on')));
 ph.querySelectorAll('.g').forEach(b=>b.addEventListener('click',()=>{b.classList.remove('shine');void b.offsetWidth;b.classList.add('shine');setTimeout(()=>b.classList.remove('shine'),700)}));
 ph.querySelectorAll('.tk').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 const rowm=ph.querySelector('.rowm'),headm=ph.querySelector('.headm'),sheet=ph.querySelector('.sheet'),shade=ph.querySelector('.shade');
 let cur=null,openSw=null,timer=null,last=null;const selOn=()=>ph.classList.contains('sel');
 const upd=()=>{const k=ph.querySelectorAll('.sw:not(.gone) .pl.on').length;ph.querySelector('.scount').textContent=k+' selected';ph.querySelector('.scount2').textContent=k+' selected'};
 ph.querySelector('[data-select]').onclick=e=>{e.stopPropagation();closeAll();closeSw();ph.classList.add('sel');upd()};
 ph.querySelector('[data-done]').onclick=e=>{e.stopPropagation();ph.classList.remove('sel');ph.querySelectorAll('.pl.on').forEach(x=>x.classList.remove('on'))};
 ph.querySelector('[data-all]').onclick=e=>{e.stopPropagation();const all=[...ph.querySelectorAll('.sw:not(.gone) .pl')];const on=all.every(x=>x.classList.contains('on'));all.forEach(x=>x.classList.toggle('on',!on));upd()};
 ph.querySelector('[data-bulkdel]').onclick=e=>{e.stopPropagation();const ss=[...ph.querySelectorAll('.sw:not(.gone)')].filter(x=>x.querySelector('.pl.on'));if(!ss.length)return;ph.classList.remove('sel');del(ss)};
 const closeAll=()=>{[rowm,headm,sheet,shade,ph.querySelector('.nsheet')].forEach(e=>e.classList.remove('open'));ph.querySelectorAll('.kb.on,.g.on').forEach(e=>e.classList.remove('on'))};
 const closeSw=()=>{if(openSw){openSw.querySelector('.pl').style.transform='';openSw=null}};
 const popAt=(m,btn)=>{const r=btn.getBoundingClientRect(),p=ph.getBoundingClientRect();m.style.top=(r.bottom-p.top+10)+'px';m.style.right=(p.right-r.right-4)+'px';m.style.setProperty('--px',(r.width/2-2)+'px');m.classList.add('open')};
 ph.querySelector('[data-hm]').onclick=e=>{e.stopPropagation();const o=headm.classList.contains('open');closeAll();if(!o){e.currentTarget.classList.add('on');popAt(headm,e.currentTarget)}};
 const ns=ph.querySelector('.nsheet');
 ph.querySelectorAll('[data-n]').forEach(c=>c.onclick=e=>{e.stopPropagation();if(selOn())return;const x=W[+c.closest('.sw').dataset.k];closeAll();closeSw();
  const av=ns.querySelector('.av');av.textContent=x[1];av.style.setProperty('--c',x[2]);ns.querySelector('.nn').textContent=x[0];
  ns.querySelector('.ns').innerHTML=x[3]+' · '+PIN[x[4][0]](x[4][1]);ns.querySelector('.nhrs').innerHTML=x[5]+'<small>this month</small>';
  ns.querySelector('.ncnt').textContent=x[7].length;
  ns.querySelector('.nlist').innerHTML=x[7].map((n,i)=>{const [t,d]=n[3].split(' · ');return `<div class="nt ${n[0]}" style="--c:${n[0]=='red'?'#ff5f6d':'#f5a623'};animation-delay:${.08*i+.15}s"><span class="ic">${NI[n[0]]}</span><div>${t}<small>${d||''}</small></div><button class="g">${n[4]}</button></div>`}).join('');
  ns.classList.add('open');shade.classList.add('open')});
 ph.querySelectorAll('.sw').forEach(sw=>{const pl=sw.querySelector('.pl'),kb=sw.querySelector('.kb');
  kb.onclick=e=>{e.stopPropagation();closeSw();const o=kb.classList.contains('on');closeAll();if(o)return;cur=sw;kb.classList.add('on');popAt(rowm,kb)};
  sw.querySelector('.d').onclick=e=>{e.stopPropagation();del(sw)};sw.querySelector('.e').onclick=e=>{e.stopPropagation();closeSw()};
  let x0=null,moved=false;
  pl.addEventListener('click',e=>{if(selOn()){pl.classList.toggle('on');upd()}});
  pl.addEventListener('pointerdown',e=>{if(e.target.closest('.kb,.chip')||selOn())return;x0=e.clientX;moved=false;pl.classList.add('drag');pl.setPointerCapture(e.pointerId)});
  pl.addEventListener('pointermove',e=>{if(x0==null)return;const base=openSw==sw?-128:0;const dx=e.clientX-x0;if(Math.abs(dx)>4)moved=true;pl.style.transform=`translateX(${Math.max(-128,Math.min(0,base+dx))}px)`});
  pl.addEventListener('pointerup',()=>{if(x0==null)return;x0=null;pl.classList.remove('drag');const v=parseFloat(pl.style.transform.slice(11))||0;
   if(!moved){pl.style.transform='';if(openSw==sw)openSw=null;return}
   if(openSw&&openSw!=sw)closeSw();if(v<-64){pl.style.transform='translateX(-128px)';openSw=sw}else{pl.style.transform='';if(openSw==sw)openSw=null}});});
 ph.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=cur;closeAll();if(c)del(c)});
 ph.querySelectorAll('.rowm [data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=cur;closeAll();if(b.dataset.a=='perm'&&c){ph.querySelector('.sh-t').textContent=c.querySelector('b').textContent;sheet.classList.add('open');shade.classList.add('open')}});
 shade.onclick=()=>closeAll();
 ph.addEventListener('click',e=>{if(!e.target.closest('.pop,.sheet'))closeAll();if(!e.target.closest('.sw'))closeSw()});
 const snack=ph.querySelector('.snack'),cnt=ph.querySelector('.cnt');const count=()=>cnt.textContent=ph.querySelectorAll('.sw:not(.gone)').length;
 function del(sw){const L=Array.isArray(sw)?sw:[sw];closeSw();if(last)finish();L.forEach(x=>{x.classList.add('gone');const q=x.querySelector('.pl');q.style.transform='';q.classList.remove('on')});last=L;count();
  snack.querySelector('span').textContent=L.length>1?L.length+' workers deleted':L[0].querySelector('b').textContent+' deleted';snack.classList.remove('open');void snack.offsetWidth;snack.classList.add('open');clearTimeout(timer);timer=setTimeout(finish,5000)}
 function finish(){snack.classList.remove('open');last=null}
 snack.querySelector('.u').onclick=e=>{e.stopPropagation();if(!last)return;clearTimeout(timer);last.forEach(x=>x.classList.remove('gone'));snack.classList.remove('open');last=null;count()};
}
</script></body></html>
