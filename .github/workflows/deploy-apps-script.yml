name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Push source to Apps Script
        working-directory: apps-script
        run: clasp push --force

      - name: Deploy new version to the existing web app deployment
        working-directory: apps-script
        run: clasp deploy --deploymentId "${{ secrets.CLASP_DEPLOYMENT_ID }}" --description "Auto-deploy ${{ github.sha }}"
