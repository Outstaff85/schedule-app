name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Push source to Apps Script
        id: push
        working-directory: apps-script
        run: clasp push --force
        continue-on-error: true

      - name: Deploy new version to the existing web app deployment
        id: deploy
        if: steps.push.outcome == 'success'
        working-directory: apps-script
        run: clasp deploy --deploymentId "${{ secrets.CLASP_DEPLOYMENT_ID }}" --description "Auto-deploy ${{ github.sha }}"
        continue-on-error: true

      - name: Open/update an issue suggesting the reauth fix
        if: steps.push.outcome == 'failure' || steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="The **Deploy to Apps Script** workflow failed — this usually means Google Workspace forced an OAuth re-authentication and invalidated the \`CLASP_CREDENTIALS\` token (\`invalid_grant\` / \`invalid_rapt\`).

          **Fix:** on a machine with a browser, run:
          \`\`\`
          bash scripts/refresh-clasp-login.sh
          \`\`\`
          It logs you in via Google, updates the \`CLASP_CREDENTIALS\` secret, and re-triggers this workflow. Details in CLAUDE.md under Troubleshooting.

          Failed run: $RUN_URL"

          EXISTING=$(gh issue list --repo "$REPO" --search "Apps Script deploy failing in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "Apps Script deploy failing — clasp token needs refresh" --body "$BODY"
          fi

      - name: Fail job if push or deploy failed
        if: steps.push.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: exit 1
