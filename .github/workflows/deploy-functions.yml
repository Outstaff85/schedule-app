name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'functions-auth/**'
      - 'tests/auth/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build functions venv
        working-directory: functions
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      # Login/user-management codebase (functions-auth/, docs/backend.md).
      - name: Build functions-auth venv
        working-directory: functions-auth
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm install -g firebase-tools

      - name: LibreOffice (the Word templates' test)
        run: which soffice || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-dejavu-core)

      # pip's downloads kept between runs (the same key as tests.yml): the scanner's training packages (CPU torch ~200 MB)
      - name: Python packages kept
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('functions/requirements.lock', 'functions-auth/requirements.txt', 'scripts/scan-train/requirements-synth.txt') }}-scan-train-1

      # A failing login/user-management test stops the deploy. pytest goes
      # into a separate venv so it never reaches the deployed functions.
      # The same packages as tests.yml's "Python for the functions" — tests/auth holds the scanner's training checks
      # too (they need torch and albumentations); keep the two lists equal.
      - name: Test login and user management on the emulators
        run: |
          python -m venv "$RUNNER_TEMP/testvenv"
          "$RUNNER_TEMP/testvenv/bin/pip" install -q -r functions/requirements.lock
          "$RUNNER_TEMP/testvenv/bin/pip" install -q -r functions-auth/requirements.txt pytest flask opencv-python-headless onnx
          "$RUNNER_TEMP/testvenv/bin/pip" install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/testvenv/bin/pip" install -q onnxruntime timm onnx2torch albumentations==2.0.8 albucore==0.0.24
          firebase emulators:exec --only firestore,auth --project demo-schedule "$RUNNER_TEMP/testvenv/bin/python -m pytest tests/auth -q"

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/gcp-sa.json"

      - name: Deploy Cloud Functions
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
        # Up to 3 tries a minute apart: a deploy sometimes fails for a moment
        # ("Failed to list functions") and passes when run again (issue #202).
        run: |
          for i in 1 2 3; do
            firebase deploy --only functions --project schedule-odinson --non-interactive --force && exit 0
            [ "$i" -lt 3 ] && { echo "Deploy failed (try $i of 3) — retrying in 60 s"; sleep 60; }
          done
          exit 1
        continue-on-error: true

      # The deployed builder against the golden hashes: no login, no secret (fill_form_101 {"ping", "selftest"}).
      # A mismatch does not undo the deploy, it stops here and opens the issue below: nothing signed depends on it before S4.
      - name: Production self-check
        id: selfcheck
        if: steps.deploy.outcome == 'success'
        run: python scripts/builder_selfcheck.py https://europe-west3-schedule-odinson.cloudfunctions.net/fill_form_101 --tries 6
        continue-on-error: true

      - name: Open/update an issue if the self-check failed
        if: steps.selfcheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="The deployed Form 101 builder does not give the bytes of \`tests/auth/builder_golden.json\` (docs/backend.md → The golden hashes). Run: $RUN_URL"
          EXISTING=$(gh issue list --repo "$REPO" --search "Builder self-check failing in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "Builder self-check failing" --body "$BODY"
          fi

      - name: Close the self-check issue after a good self-check
        if: steps.selfcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --repo "$REPO" --search "Builder self-check failing in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$REPO" --comment "The deployed builder gives the golden bytes: $RUN_URL"
          fi

      - name: Close the deploy-failure issue after a good deploy
        if: steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --repo "$REPO" --search "Cloud Functions deploy failing in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$REPO" --comment "Deployed fine: $RUN_URL"
          fi

      - name: Open/update an issue if deploy failed
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="The **Deploy Cloud Functions** workflow failed. Failed run: $RUN_URL

          Common causes for this specific workflow (new as of 2026-09-21):
          - The \`FIREBASE_SERVICE_ACCOUNT\` secret (used for Hosting deploys) may lack the IAM roles Cloud Functions 2nd-gen deploys need on the runtime service account (\`schedule-odinson@appspot.gserviceaccount.com\`) — most commonly just **Service Account User** (\`iam.serviceAccounts.ActAs\`), confirmed as the cause on the first real run (2026-09-21). Grant it at GCP Console → IAM, project \`schedule-odinson\` (grant access ON the \`schedule-odinson@appspot.gserviceaccount.com\` service account itself, not the project-level IAM page).
          - A dependency in \`functions/requirements.txt\` (e.g. \`pymupdf\`) may have failed to build for the runtime Python version.
          - The declared runtime (\`python312\` in \`firebase.json\`) may need bumping if Cloud Functions deprecates it.

          Check the run log first — it will say which of these it is."

          EXISTING=$(gh issue list --repo "$REPO" --search "Cloud Functions deploy failing in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "Cloud Functions deploy failing" --body "$BODY"
          fi

      - name: Fail job if deploy or the self-check failed
        if: steps.deploy.outcome == 'failure' || steps.selfcheck.outcome == 'failure'
        run: exit 1
