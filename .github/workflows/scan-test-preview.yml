name: Scan model test (preview channel)

# Temporary: puts scan-test/ (a test page that runs DocAligner in the phone's
# browser) on a Firebase Hosting PREVIEW channel — never the live site. The
# models are downloaded and converted here, so no model file is committed.
# Remove this workflow and scan-test/ before any PR into main.
on:
  push:
    branches: [claude/wonderful-goldberg-lwotm3]
    paths: ['scan-test/**', '.github/workflows/scan-test-preview.yml']
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site (the channel serves dist/)
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # The models are kept in the Actions cache: Drive refuses frequent downloads.
      - uses: actions/cache@v4
        with:
          path: /tmp/models
          key: docaligner-models-v1
      - name: Models (DocAligner, Apache-2.0) and ONNX Runtime Web
        run: |
          pip install -q onnx numpy
          mkdir -p dist/scan-test/ort /tmp/models
          get() {
            [ -s "/tmp/models/$2" ] && return 0
            for i in 1 2 3 4; do
              curl -sSL --fail "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t" -o "/tmp/models/$2" && [ "$(stat -c %s /tmp/models/$2)" -gt 1000000 ] && return 0
              sleep $((i * 5))
            done
            echo "could not download $2"; return 1
          }
          get 14vUH77v6yGg7zFctUgcT6BzV5Iisg4Dl sa24.onnx
          get 1IlbLPkCv-TdaBLOPh_4J97P1_KHYYJ7a lite.onnx
          cp /tmp/models/sa24.onnx /tmp/sa24.onnx
          cp /tmp/models/lite.onnx dist/scan-test/lite.onnx
          # fp16 weights, fp32 math: a plain fp16 conversion gives zeros on WebGPU.
          python scan-test/w16.py /tmp/sa24.onnx dist/scan-test/sa24_w16.onnx
          npm pack onnxruntime-web@1.22.0 --silent
          tar xzf onnxruntime-web-1.22.0.tgz
          cp package/dist/ort.all.min.js package/dist/*.wasm package/dist/ort-wasm-simd-threaded*.mjs dist/scan-test/ort/
          cp scan-test/index.html scan-test/scan-core.js scan-test/scan-worker.js dist/scan-test/
          ls -la dist/scan-test dist/scan-test/ort
      - name: Cross-origin isolation (multithreaded WASM) and no stale copies, for /scan-test only
        run: |
          python - <<'PY'
          import json
          c = json.load(open('firebase.json'))
          h = [{"key": "Cross-Origin-Opener-Policy", "value": "same-origin"},
               {"key": "Cross-Origin-Embedder-Policy", "value": "require-corp"},
               {"key": "Cache-Control", "value": "no-cache"}]
          c["hosting"]["headers"] += [{"source": "/scan-test", "headers": h}, {"source": "/scan-test/**", "headers": h}]
          json.dump(c, open('firebase.json', 'w'), indent=2)
          PY
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: schedule-odinson
          channelId: scan-test
          expires: 7d
      - name: Test page link
        run: |
          echo "TEST PAGE ${{ steps.deploy.outputs.details_url }}/scan-test/"
          curl -sI "${{ steps.deploy.outputs.details_url }}/scan-test/" | grep -i -E "^HTTP|cross-origin"
          curl -sI "${{ steps.deploy.outputs.details_url }}/scan-test/scan-worker.js" | grep -i -E "^HTTP|cross-origin"
