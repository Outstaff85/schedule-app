name: Tests

# Every pull request into main (and by hand): the dictionary and icon checks,
# the build (typecheck, Vite, the old pages copied into dist/), the payroll
# comparison (tests/payroll), the Accounting comparison (tests/accounting), the scan process comparison (tests/scan), the rules tests, the functions tests and the browser tests on the built dist/
# (docs/tests.md).
# Nothing is deployed and no secret is used — everything runs on the emulators.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to the same PR cancels its run still in progress: only the latest commit is
# tested (every file edit is its own auto-commit, so a burst of pushes would otherwise
# queue a full run per commit).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dictionaries, icons and design tokens
        run: |
          node tests/i18n/check.js
          node tests/icons/check.js
          node tests/design/check.js

      - name: Build (typecheck, Vite, dist/)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node tests/build/check.js

      - name: Payroll (old copies vs src/lib/payroll.ts)
        run: node tests/payroll/compare.test.mjs

      - name: Accounting (the old tab's figures vs src/manager/accounting.ts)
        run: node tests/accounting/compare.test.mjs

      - name: Scan process (the old reading vs src/scan-process/)
        run: node tests/scan/compare.test.mjs

      - name: Python for the functions
        run: |
          python -m venv "$RUNNER_TEMP/testvenv"
          "$RUNNER_TEMP/testvenv/bin/pip" install -q -r functions-auth/requirements.txt pytest Pillow pymupdf python-bidi

      - name: Rules tests
        working-directory: tests/rules
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Functions tests
        working-directory: tests/rules
        env:
          PYTHON: ${{ runner.temp }}/testvenv/bin/python
        run: npm run test:auth

      - name: Browser tests
        working-directory: tests/e2e
        env:
          PYTHON: ${{ runner.temp }}/testvenv/bin/python
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Keep the browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/out/
          if-no-files-found: ignore
