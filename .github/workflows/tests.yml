name: Tests

# Every pull request into main (and by hand): the dictionary and icon checks,
# the build (typecheck, Vite, the old pages copied into dist/), the payroll
# comparison (tests/payroll), the Accounting comparison (tests/accounting), the scan process comparison (tests/scan), the rules tests, the functions tests and the browser tests on the built dist/
# (docs/tests.md).
# Nothing is deployed and no secret is used — everything runs on the emulators.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to the same PR cancels its run still in progress: only the latest commit is
# tested (every file edit is its own auto-commit, so a burst of pushes would otherwise
# queue a full run per commit).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # pinned: ubuntu-latest became 26.04 (2026-10-21), where Playwright 1.56 installs no Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # ~10 min as a rule; a slow runner's apt-get took 17 min alone (2026-10-22)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dictionaries, icons and design tokens
        run: |
          node tests/i18n/check.js
          node tests/icons/check.js
          node tests/design/check.js

      # A browser test file that does not parse would skip its whole suite late in the run: fail at once.
      - name: Browser test files parse
        run: for f in tests/e2e/*.js; do node --check "$f" || exit 1; done

      - name: Build (typecheck, Vite, dist/)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node tests/build/check.js

      - name: Payroll (old copies vs src/lib/payroll.ts)
        run: node tests/payroll/compare.test.mjs

      - name: Accounting (the old tab's figures vs src/manager/accounting.ts)
        run: node tests/accounting/compare.test.mjs

      - name: Scan process (the old reading vs src/scan-process/)
        run: node tests/scan/compare.test.mjs

      - name: Scanner corners (scan-lab/scan-core.js and scan/scan-core.js)
        run: node tests/scan/corners.test.mjs

      # LibreOffice for the Word templates' conversion (services/docx2pdf, docs/contracts.md → Word templates)
      # its packages kept between runs: the runners' Ubuntu mirror was down to ~40 KB/s (2026-10-22) and
      # the 60 MB of them took the whole job's time; a kept package is not downloaded again
      - name: LibreOffice packages kept
        id: lo-debs
        uses: actions/cache/restore@v4
        with:
          path: ~/lo-debs
          key: lo-debs-noble-1
      - name: LibreOffice
        id: lo
        run: |
          mkdir -p ~/lo-debs
          if ! which soffice; then
            sudo apt-get update -q
            sudo cp ~/lo-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 libreoffice-writer-nogui fonts-dejavu-core
            cp /var/cache/apt/archives/*.deb ~/lo-debs/ 2>/dev/null || true
          fi
          echo "debs=$(ls ~/lo-debs/*.deb 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: LibreOffice packages kept for the next runs
        if: steps.lo-debs.outputs.cache-hit != 'true' && steps.lo.outputs.debs != '0'
        uses: actions/cache/save@v4
        with:
          path: ~/lo-debs
          key: lo-debs-noble-1

      - name: Python for the functions
        run: |
          python -m venv "$RUNNER_TEMP/testvenv"
          "$RUNNER_TEMP/testvenv/bin/pip" install -q -r functions-auth/requirements.txt pytest Pillow pymupdf python-bidi flask opencv-python-headless onnx

      - name: Rules tests
        working-directory: tests/rules
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Functions tests
        working-directory: tests/rules
        env:
          PYTHON: ${{ runner.temp }}/testvenv/bin/python
        run: npm run test:auth

      - name: Browser tests
        working-directory: tests/e2e
        env:
          PYTHON: ${{ runner.temp }}/testvenv/bin/python
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Keep the browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/out/
          if-no-files-found: ignore
