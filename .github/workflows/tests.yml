name: Tests

# Every pull request into main (and by hand): the dictionary and icon checks,
# the build (typecheck, Vite, the old pages copied into dist/), the rules
# tests, the functions tests and the browser tests on the built dist/
# (docs/tests.md).
# Nothing is deployed and no secret is used — everything runs on the emulators.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dictionaries, icons and design tokens
        run: |
          node tests/i18n/check.js
          node tests/icons/check.js
          node tests/design/check.js

      - name: Build (typecheck, Vite, dist/)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node tests/build/check.js

      - name: Python for the functions
        run: |
          python -m venv "$RUNNER_TEMP/testvenv"
          "$RUNNER_TEMP/testvenv/bin/pip" install -q -r functions-auth/requirements.txt pytest

      - name: Rules tests
        working-directory: tests/rules
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Functions tests
        working-directory: tests/rules
        env:
          PYTHON: ${{ runner.temp }}/testvenv/bin/python
        run: npm run test:auth

      - name: Browser tests
        working-directory: tests/e2e
        env:
          PYTHON: ${{ runner.temp }}/testvenv/bin/python
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - name: Keep the browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/out/
          if-no-files-found: ignore
